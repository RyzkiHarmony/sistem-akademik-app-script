<script>
  // JavaScript_Dashboard.html

  // Get session ID from hidden input
  function getSessionId() {
    return document.getElementById("sessionId").value;
  }

  // Fungsi untuk toggle sidebar di tampilan mobile
  function toggleSidebar() {
    document.body.classList.toggle("sidebar-active");
  }

  // Fungsi untuk mengupdate tanggal
  function updateDateTime() {
    const now = new Date();
    const options = {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric",
    };
    document.getElementById("current-date").textContent =
      now.toLocaleDateString("id-ID", options);
  }

  // Fungsi untuk memuat data dashboard (statistik) dengan caching
  function loadDashboardData(forceRefresh = false) {
    const cacheKey = generateDashboardCacheKey("stats");

    // Check cache first (unless force refresh)
    if (!forceRefresh) {
      const cachedData = getDashboardCacheData(cacheKey);
      if (cachedData) {
        console.log("Loading dashboard stats from cache");

        // Update statistik dengan data dari cache
        document.getElementById("total-siswa-aktif").textContent =
          cachedData.totalSiswaAktif || 0;
        document.getElementById("total-siswa-lulus").textContent =
          cachedData.totalSiswaLulus || 0;
        document.getElementById("rata-rata-nilai").textContent =
          cachedData.rataRataNilai || 0;
        document.getElementById("analisis-kip").textContent =
          (cachedData.analisisKIP || 0) + " Layak";

        // Update summary data from cache
        if (cachedData.summaryStats) {
          updateSummaryDisplay(cachedData.summaryStats);
        }
        return;
      }
    }

    // If no cache or force refresh, load from server
    console.log("Loading dashboard stats from server");

    // Get session ID
    const sessionId = getSessionId();

    // Tampilkan loading state
    document.getElementById("total-siswa-aktif").textContent = "...";
    document.getElementById("total-siswa-lulus").textContent = "...";
    document.getElementById("rata-rata-nilai").textContent = "...";
    document.getElementById("analisis-kip").textContent = "...";

    // Panggil fungsi di server untuk mendapatkan data dashboard
    google.script.run
      .withSuccessHandler(function (data) {
        // Cache the result
        setDashboardCacheData(cacheKey, data);

        // Update statistik dengan data dari server
        document.getElementById("total-siswa-aktif").textContent =
          data.totalSiswaAktif || 0;
        document.getElementById("total-siswa-lulus").textContent =
          data.totalSiswaLulus || 0;
        document.getElementById("rata-rata-nilai").textContent =
          data.rataRataNilai || 0;
        document.getElementById("analisis-kip").textContent =
          (data.analisisKIP || 0) + " Layak";

        // Update summary data from server
        if (data.summaryStats) {
          updateSummaryDisplay(data.summaryStats);
        }
      })
      .withFailureHandler(function (error) {
        showNotification(
          "Terjadi kesalahan saat memuat data dashboard: " + error,
          "error"
        );
      })
      .getDashboardData();
  }

  // Menyimpan data siswa secara global untuk diakses oleh fungsi lain
  let allStudents = [];

  // Cache management for dashboard
  const dashboardCache = new Map();
  const DASHBOARD_CACHE_EXPIRY_TIME = 5 * 60 * 1000; // 5 minutes
  const DASHBOARD_CACHE_KEY_PREFIX = "dashboard_";
  const DASHBOARD_CACHE_VERSION = "1.0";

  // Generate cache key for dashboard data
  function generateDashboardCacheKey(type) {
    return `${DASHBOARD_CACHE_KEY_PREFIX}${type}_v${DASHBOARD_CACHE_VERSION}`;
  }

  // Set cache data for dashboard
  function setDashboardCacheData(key, data) {
    const cacheEntry = {
      data: data,
      timestamp: Date.now(),
      version: DASHBOARD_CACHE_VERSION,
    };

    // Store in memory cache
    dashboardCache.set(key, cacheEntry);

    // Store in localStorage
    try {
      localStorage.setItem(key, JSON.stringify(cacheEntry));
    } catch (e) {
      console.warn("Failed to store dashboard cache in localStorage:", e);
    }
  }

  // Get cache data for dashboard
  function getDashboardCacheData(key) {
    // Check memory cache first
    let cacheEntry = dashboardCache.get(key);

    // If not in memory, check localStorage
    if (!cacheEntry) {
      try {
        const stored = localStorage.getItem(key);
        if (stored) {
          cacheEntry = JSON.parse(stored);
          // Restore to memory cache
          dashboardCache.set(key, cacheEntry);
        }
      } catch (e) {
        console.warn(
          "Failed to retrieve dashboard cache from localStorage:",
          e
        );
        return null;
      }
    }

    if (!cacheEntry) return null;

    // Check if cache is expired
    const isExpired =
      Date.now() - cacheEntry.timestamp > DASHBOARD_CACHE_EXPIRY_TIME;
    if (isExpired) {
      dashboardCache.delete(key);
      try {
        localStorage.removeItem(key);
      } catch (e) {
        console.warn("Failed to remove expired dashboard cache:", e);
      }
      return null;
    }

    // Check version compatibility
    if (cacheEntry.version !== DASHBOARD_CACHE_VERSION) {
      dashboardCache.delete(key);
      try {
        localStorage.removeItem(key);
      } catch (e) {
        console.warn("Failed to remove incompatible dashboard cache:", e);
      }
      return null;
    }

    return cacheEntry.data;
  }

  // Invalidate dashboard cache
  function invalidateDashboardCache() {
    // Clear memory cache
    dashboardCache.clear();

    // Clear localStorage cache
    try {
      const keys = Object.keys(localStorage);
      keys.forEach((key) => {
        if (key.startsWith(DASHBOARD_CACHE_KEY_PREFIX)) {
          localStorage.removeItem(key);
        }
      });
    } catch (e) {
      console.warn("Failed to clear dashboard cache from localStorage:", e);
    }

    console.log("Dashboard cache invalidated");
  }

  // Clean expired dashboard cache
  function cleanExpiredDashboardCache() {
    const now = Date.now();

    // Clean memory cache
    for (const [key, entry] of dashboardCache.entries()) {
      if (now - entry.timestamp > DASHBOARD_CACHE_EXPIRY_TIME) {
        dashboardCache.delete(key);
      }
    }

    // Clean localStorage cache
    try {
      const keys = Object.keys(localStorage);
      keys.forEach((key) => {
        if (key.startsWith(DASHBOARD_CACHE_KEY_PREFIX)) {
          try {
            const entry = JSON.parse(localStorage.getItem(key));
            if (now - entry.timestamp > DASHBOARD_CACHE_EXPIRY_TIME) {
              localStorage.removeItem(key);
            }
          } catch (e) {
            // Remove invalid entries
            localStorage.removeItem(key);
          }
        }
      });
    } catch (e) {
      console.warn("Failed to clean expired dashboard cache:", e);
    }
  }

  // Helper function to convert Indonesian date format to ISO format
  function convertIndonesianDateToISO(indonesianDate) {
    if (!indonesianDate) return "";

    // Handle various date formats
    // Example: "21 Januari 2023" -> "2023-01-21"
    const months = {
      Januari: "01",
      Februari: "02",
      Maret: "03",
      April: "04",
      Mei: "05",
      Juni: "06",
      Juli: "07",
      Agustus: "08",
      September: "09",
      Oktober: "10",
      November: "11",
      Desember: "12",
    };

    const parts = indonesianDate.split(" ");
    if (parts.length === 3) {
      const day = parts[0].padStart(2, "0");
      const month = months[parts[1]] || "01";
      const year = parts[2];

      return `${year}-${month}-${day}`;
    }

    return indonesianDate; // Return original if format doesn't match
  }

  // Fungsi untuk memuat data siswa terbaru dengan caching
  function loadRecentStudents(forceRefresh = false) {
    const cacheKey = generateDashboardCacheKey("recent_students");
    const recentStudentsContainer = document.getElementById("recent-students");

    // Check cache first (unless force refresh)
    if (!forceRefresh) {
      const cachedStudents = getDashboardCacheData(cacheKey);
      if (cachedStudents) {
        console.log("Loading recent students from cache");

        // Simpan data siswa ke variabel global
        allStudents = cachedStudents;

        // Render from cache
        renderRecentStudents(cachedStudents, recentStudentsContainer);
        return;
      }
    }

    // If no cache or force refresh, load from server
    console.log("Loading recent students from server");

    // Get session ID
    const sessionId = getSessionId();

    recentStudentsContainer.innerHTML =
      "<tr><td colspan='6' style='text-align: center;'>Memuat data siswa...</td></tr>";

    // Panggil fungsi di server untuk mendapatkan data siswa terbaru
    google.script.run
      .withSuccessHandler(function (students) {
        // Cache the result
        setDashboardCacheData(cacheKey, students);

        // Simpan data siswa ke variabel global
        allStudents = students;

        // Render students
        renderRecentStudents(students, recentStudentsContainer);
      })
      .withFailureHandler(function (error) {
        recentStudentsContainer.innerHTML = `<tr><td colspan='6' style='text-align: center; color: #e74c3c;'>Error: ${error}</td></tr>`;
        showNotification("Gagal memuat data siswa: " + error, "error");
      })
      .getRecentStudents();
  }

  // Helper function to render recent students
  function renderRecentStudents(students, container) {
    if (students && students.length > 0) {
      // Bersihkan container
      container.innerHTML = "";

      // Data sudah diurutkan berdasarkan NIS terbesar dari server
      // Tidak perlu sorting ulang di client-side

      // Tambahkan baris untuk setiap siswa
      students.forEach(function (student) {
        const status = getStatusBadge(student.status);

        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${student.nis || "-"}</td>
          <td class="student-name">${student.nama || "-"}</td>
          <td>${student.jenisKelamin || student.gender || "-"}</td>
          <td>${student.tanggalDaftar || "-"}</td>
          <td>${status}</td>
        `;

        container.appendChild(row);
      });
    } else {
      container.innerHTML =
        "<tr><td colspan='6' style='text-align: center;'>Tidak ada data siswa</td></tr>";
    }
  }

  // Helper untuk mendapatkan badge status
  function getStatusBadge(status) {
    switch (status?.toLowerCase()) {
      case "aktif":
        return '<span class="badge badge-success">Aktif</span>';
      case "lulus":
        return '<span class="badge badge-primary">Lulus</span>';
      case "mutasi":
        return '<span class="badge badge-warning">Mutasi</span>';
      case "keluar":
        return '<span class="badge badge-danger">Keluar</span>';
      default:
        return '<span class="badge badge-success">Aktif</span>';
    }
  }

  // Fungsi untuk menampilkan notifikasi
  function showNotification(message, type) {
    // Create notification element if it doesn't exist
    let notification = document.querySelector(".notification");

    if (!notification) {
      notification = document.createElement("div");
      notification.className = "notification";
      document.body.appendChild(notification);
    }

    // Set content and type
    notification.textContent = message;
    notification.className = `notification notification-${type}`;

    // Show notification
    setTimeout(() => {
      notification.classList.add("show");
    }, 10);

    // Hide after 3 seconds
    setTimeout(() => {
      notification.classList.remove("show");
    }, 4000);
  }

  // Setup logout button
  function setupLogout() {
    const logoutLink = document.getElementById("logout-link");
    if (logoutLink) {
      logoutLink.addEventListener("click", function (e) {
        e.preventDefault();

        if (confirm("Apakah Anda yakin ingin logout?")) {
          const sessionId = getSessionId();

          // Show loading indicator
          this.textContent = "Logging out...";
          this.style.opacity = "0.7";

          // Call logout function with session ID
          google.script.run
            .withSuccessHandler(function (url) {
              window.location.href = url;
            })
            .withFailureHandler(function (error) {
              alert("Gagal logout: " + error);
              document.getElementById("logout-link").textContent = "Logout";
              document.getElementById("logout-link").style.opacity = "1";
            })
            .logoutAndDestroySession(sessionId);
        }
      });
    } else {
    }
  }

  // Setup refresh functionality
  function setupRefreshFunctionality() {
    // Add keyboard shortcut for refresh (Ctrl+R or F5)
    document.addEventListener("keydown", function (e) {
      if ((e.ctrlKey && e.key === "r") || e.key === "F5") {
        e.preventDefault();
        refreshDashboard();
      }
    });

    // Add double-click refresh on dashboard title
    const pageTitle = document.querySelector(".page-title");
    if (pageTitle) {
      pageTitle.addEventListener("dblclick", function () {
        refreshDashboard();
      });
      pageTitle.style.cursor = "pointer";
      pageTitle.title = "Double-click to refresh dashboard";
    }
  }

  // Refresh dashboard data
  function refreshDashboard() {
    showNotification("Memuat ulang data dashboard...", "info");
    invalidateDashboardCache();
    loadDashboardData(true); // Force refresh
    loadRecentStudents(true); // Force refresh
  }

  // Chart instance global variable
  let summaryChart = null;
  let currentChartType = "doughnut";

  // Chart colors
  const chartColors = {
    siswaAktif: "#3498db",
    dataLengkap: "#2ecc71",
    nilaiTerinput: "#f39c12",
  };

  // Fungsi untuk mengupdate tampilan data ringkasan dengan chart
  function updateSummaryDisplay(summaryData) {
    // Update legend values
    document.getElementById("legend-siswa-aktif").textContent =
      summaryData.siswaAktif + "%";
    document.getElementById("legend-data-lengkap").textContent =
      summaryData.dataLengkap + "%";
    document.getElementById("legend-nilai-terinput").textContent =
      summaryData.nilaiTerinput + "%";

    // Hide loading indicator
    document.getElementById("chart-loading").classList.add("hidden");

    // Create or update chart
    createSummaryChart(summaryData);
  }

  // Fungsi untuk membuat chart ringkasan
  function createSummaryChart(summaryData) {
    const ctx = document.getElementById("summaryChart").getContext("2d");

    // Destroy existing chart if exists
    if (summaryChart) {
      summaryChart.destroy();
    }

    const data = {
      labels: ["Siswa Aktif", "Data Lengkap", "Nilai Terinput"],
      datasets: [
        {
          data: [
            summaryData.siswaAktif,
            summaryData.dataLengkap,
            summaryData.nilaiTerinput,
          ],
          backgroundColor: [
            chartColors.siswaAktif,
            chartColors.dataLengkap,
            chartColors.nilaiTerinput,
          ],
          borderWidth: 2,
          borderColor: "#ffffff",
        },
      ],
    };

    const config = getChartConfig(currentChartType, data);
    summaryChart = new Chart(ctx, config);
  }

  // Fungsi untuk mendapatkan konfigurasi chart berdasarkan tipe
  function getChartConfig(type, data) {
    const baseOptions = {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: false, // We use custom legend
        },
        tooltip: {
          callbacks: {
            label: function (context) {
              return context.label + ": " + context.parsed + "%";
            },
          },
        },
      },
    };

    switch (type) {
      case "doughnut":
        return {
          type: "doughnut",
          data: data,
          options: {
            ...baseOptions,
            cutout: "60%",
            plugins: {
              ...baseOptions.plugins,
              tooltip: {
                ...baseOptions.plugins.tooltip,
                displayColors: true,
              },
            },
          },
        };

      case "bar":
        return {
          type: "bar",
          data: data,
          options: {
            ...baseOptions,
            scales: {
              y: {
                beginAtZero: true,
                max: 100,
                ticks: {
                  callback: function (value) {
                    return value + "%";
                  },
                },
              },
            },
          },
        };

      case "line":
        return {
          type: "line",
          data: {
            ...data,
            datasets: [
              {
                ...data.datasets[0],
                fill: false,
                borderColor: chartColors.siswaAktif,
                backgroundColor: chartColors.siswaAktif,
                tension: 0.4,
              },
            ],
          },
          options: {
            ...baseOptions,
            scales: {
              y: {
                beginAtZero: true,
                max: 100,
                ticks: {
                  callback: function (value) {
                    return value + "%";
                  },
                },
              },
            },
          },
        };

      default:
        return getChartConfig("doughnut", data);
    }
  }

  // Fungsi untuk setup chart toggle buttons
  function setupChartToggle() {
    const toggleButtons = document.querySelectorAll(".chart-toggle-btn");

    toggleButtons.forEach((button) => {
      button.addEventListener("click", function () {
        // Remove active class from all buttons
        toggleButtons.forEach((btn) => btn.classList.remove("active"));

        // Add active class to clicked button
        this.classList.add("active");

        // Get chart type and update
        const chartType = this.getAttribute("data-chart");
        currentChartType = chartType;

        // Recreate chart with new type if data exists
        if (summaryChart && summaryChart.data) {
          const currentData = {
            siswaAktif: summaryChart.data.datasets[0].data[0],
            dataLengkap: summaryChart.data.datasets[0].data[1],
            nilaiTerinput: summaryChart.data.datasets[0].data[2],
          };
          createSummaryChart(currentData);
        }
      });
    });
  }

  // Fungsi untuk memuat data ringkasan dengan loading state
  function loadSummaryData() {
    // Show loading state
    document.getElementById("chart-loading").classList.remove("hidden");

    // Set legend values to loading
    document.getElementById("legend-siswa-aktif").textContent = "...";
    document.getElementById("legend-data-lengkap").textContent = "...";
    document.getElementById("legend-nilai-terinput").textContent = "...";

    // Data akan dimuat bersamaan dengan loadDashboardData()
    // Jika tidak ada data dari cache atau server, gunakan default
    const defaultData = {
      siswaAktif: 0,
      dataLengkap: 0,
      nilaiTerinput: 0,
    };

    setTimeout(() => {
      // Fallback jika data tidak dimuat dari server
      if (document.getElementById("legend-siswa-aktif").textContent === "...") {
        updateSummaryDisplay(defaultData);
      }
    }, 5000);
  }

  // Fungsi untuk setup aksi cepat
  function setupQuickActions() {
    const sessionId = getSessionId();

    // Tambah Siswa Baru
    document
      .getElementById("btn-tambah-siswa")
      .addEventListener("click", function () {
        window.open("https://forms.gle/ygpAQTqxnHjMhNKi9", "_blank");
      });

    // Input Nilai
    document
      .getElementById("btn-input-nilai")
      .addEventListener("click", function () {
        window.open("https://forms.gle/PTrCvLCwrQPwmwdF7", "_blank");
      });
  }

  // Inisialisasi saat halaman dimuat
  document.addEventListener("DOMContentLoaded", function () {
    // Clean expired cache on page load
    cleanExpiredDashboardCache();

    const sessionId = getSessionId();
    const viewAllStudents = document.getElementById("view-all-students");
    viewAllStudents.href =
      "<?= myURL() ?>?page=Students_manage&sessionId=" +
      encodeURIComponent(sessionId);

    // Update tanggal
    updateDateTime();

    // Load data dashboard
    loadDashboardData();

    // Load recent students
    loadRecentStudents();

    // Initialize summary data loading state
    loadSummaryData();

    // Setup logout
    setupLogout();

    // Setup refresh functionality
    setupRefreshFunctionality();

    // Setup quick actions
    setupQuickActions();

    // Setup chart toggle functionality
    setupChartToggle();

    // Tambahkan efek hover pada kartu statistik
    const statCards = document.querySelectorAll(".stat-card");
    statCards.forEach(function (card) {
      card.addEventListener("mouseenter", function () {
        this.style.transform = "translateY(-5px)";
      });
      card.addEventListener("mouseleave", function () {
        this.style.transform = "translateY(0)";
      });
    });

    // Add chart animation on load
    setTimeout(() => {
      const chartContainer = document.querySelector(".chart-container");
      if (chartContainer) {
        chartContainer.style.opacity = "0";
        chartContainer.style.transform = "translateY(20px)";
        chartContainer.style.transition = "all 0.5s ease";

        setTimeout(() => {
          chartContainer.style.opacity = "1";
          chartContainer.style.transform = "translateY(0)";
        }, 100);
      }
    }, 500);
  });
</script>
