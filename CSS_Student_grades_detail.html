<!-- CSS_Student_grades_detail.html -->

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Quicksand", "Segoe UI", sans-serif;
  }

  body {
    background-color: #f8f9fa;
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
    flex-direction: column;
  }

  img {
    justify-content: center;
    align-items: center;
    max-width: 100%;
    max-height: 100%;
  }

  /* Sidebar */
  .sidebar {
    width: 250px;
    background: #1a5276;
    min-height: 100vh;
    color: white;
    transition: all 0.3s ease;
    box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
    z-index: 1000;
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
  }

  .sidebar-header {
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    margin-bottom: 20px;
  }

  .sidebar-logo {
    font-size: 24px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    text-decoration: none;
  }

  .sidebar-logo:before {
    font-family: "Font Awesome 6 Free";
    font-weight: 900;
    content: "\f02d"; /* Font Awesome book icon */
    margin-right: 10px;
  }

  .admin-info {
    display: flex;
    align-items: center;
    padding: 15px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    margin-bottom: 20px;
  }

  .admin-avatar {
    width: 40px;
    height: 40px;
    background: #f4d03f;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-right: 10px;
    font-size: 18px;
  }

  .admin-name {
    font-weight: 600;
    font-size: 14px;
  }

  .admin-role {
    font-size: 12px;
    opacity: 0.7;
  }

  .sidebar-menu {
    list-style: none;
    padding: 0;
  }

  .sidebar-menu li {
    margin-bottom: 5px;
  }

  .sidebar-menu a {
    display: flex;
    align-items: center;
    padding: 12px 20px;
    color: rgba(255, 255, 255, 0.8);
    text-decoration: none;
    transition: all 0.3s ease;
    font-size: 15px;
    border-left: 3px solid transparent;
  }

  .sidebar-menu a:hover,
  .sidebar-menu a.active {
    background: rgba(255, 255, 255, 0.08);
    color: white;
    border-left: 3px solid #f4d03f;
  }

  .sidebar-menu a:before {
    font-family: "Font Awesome 6 Free";
    font-weight: 900;
    margin-right: 10px;
    font-size: 18px;
  }

  .menu-dashboard:before {
    content: "\f080"; /* Font Awesome chart-bar icon */
  }

  .menu-data:before {
    content: "\f19d"; /* Font Awesome graduation-cap icon */
  }

  .menu-grades:before {
    content: "\f044"; /* Font Awesome edit icon */
  }

  .menu-kip:before {
    content: "\f201"; /* Font Awesome chart-line icon */
  }

  .menu-logout:before {
    content: "\f2f5"; /* Font Awesome sign-out-alt icon */
  }

  .mobile-toggle {
    display: none;
    background: #1a5276;
    color: white;
    border: none;
    padding: 10px;
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 1001;
    border-radius: 8px;
    cursor: pointer;
    font-size: 20px;
  }

  /* Main Content */
  .main-content {
    flex: 1;
    padding: 25px;
    margin-left: 250px;
    transition: all 0.3s ease;
  }

  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    padding-bottom: 15px;
    border-bottom: 1px solid #e0e0e0;
  }

  .page-title-section {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .back-btn {
    background: #6c757d;
    color: white;
    border: none;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .back-btn:hover {
    background: #5a6268;
    transform: translateY(-2px);
  }

  .page-title {
    font-size: 24px;
    font-weight: 600;
    color: #1a5276;
    margin: 0;
  }

  .page-date {
    font-size: 14px;
    color: #6c757d;
    font-weight: 500;
  }

  /* Student Info Section */
  .student-info-section {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    margin-bottom: 25px;
    border: 1px solid rgba(0, 0, 0, 0.05);
  }

  .loading-info {
    text-align: center;
    padding: 20px;
    color: #6c757d;
    font-size: 16px;
  }

  .loading-info i {
    margin-right: 10px;
    color: #1a5276;
  }

  .student-info-card {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    align-items: start;
  }

  .student-basic-info {
    background: #1a5276;
    color: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
  }

  .student-avatar {
    width: 80px;
    height: 80px;
    background: #f4d03f;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin: 0 auto 15px;
    border: 3px solid rgba(255, 255, 255, 0.3);
  }

  .student-name {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 5px;
  }

  .student-nis {
    font-size: 14px;
    opacity: 0.9;
    margin-bottom: 10px;
  }

  .student-status {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    background: rgba(255, 255, 255, 0.2);
  }

  .student-details-info {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
  }

  .detail-item {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .detail-label {
    font-size: 12px;
    color: #6c757d;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .detail-value {
    font-size: 16px;
    font-weight: 600;
    color: #1a5276;
  }

  /* Grades Section */
  .grades-section {
    display: flex;
    flex-direction: column;
    gap: 25px;
  }

  .grades-card {
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    border: 1px solid rgba(0, 0, 0, 0.05);
    overflow: hidden;
  }

  .grades-card-header {
    background: #1a5276;
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .grades-card-header h3 {
    font-size: 18px;
    font-weight: 600;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .semester-info {
    background: rgba(255, 255, 255, 0.2);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }

  .grades-card-body {
    padding: 25px;
  }

  .grades-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  }

  .grades-table th {
    background: #1a5276;
    color: white;
    padding: 15px;
    text-align: left;
    font-weight: 600;
    font-size: 14px;
    border-bottom: 2px solid #154a6b;
  }

  .grades-table th:first-child {
    width: 40%;
  }

  .grades-table th:nth-child(2) {
    width: 20%;
    text-align: center;
  }

  .grades-table th:last-child {
    width: 40%;
    text-align: left;
  }

  .grades-table td {
    padding: 12px 15px;
    border-bottom: 1px solid #e9ecef;
    font-size: 14px;
    vertical-align: top;
  }

  .grades-table .achievement-text {
    max-width: 300px;
    word-wrap: break-word;
    white-space: pre-wrap;
    line-height: 1.4;
  }

  .grades-table tr:hover {
    background: #f8f9fa;
  }

  .grades-table tr:last-child td {
    border-bottom: none;
  }

  .subject-name {
    font-weight: 500;
    color: #1a5276;
  }

  .grade-value {
    text-align: center;
    font-weight: 700;
    font-size: 16px;
    padding: 8px 12px;
    border-radius: 6px;
    color: white;
    display: inline-block;
    min-width: 50px;
  }

  .achievement-text {
    font-size: 13px;
    color: #495057;
    line-height: 1.4;
    font-weight: 500;
    padding: 8px 0;
    max-width: 300px;
    word-wrap: break-word;
  }

  .achievement-text:empty::before {
    content: "-";
    color: #6c757d;
    font-style: italic;
  }

  .grade-pass {
    background: #28a745;
  }

  .grade-fail {
    background: #dc3545;
  }

  .grade-empty {
    background: #6c757d;
  }

  /* Styling untuk tabel ekstrakurikuler, prestasi, P5, kehadiran, dan status kenaikan */
  .grades-table th:first-child {
    width: auto;
  }

  .grades-table th:nth-child(2) {
    width: auto;
  }

  .grades-table th:nth-child(3) {
    width: auto;
  }

  /* Styling khusus untuk tabel prestasi */
  #achievement-grid .grades-table th {
    font-size: 12px;
    padding: 8px 6px;
  }

  #achievement-grid .grades-table td {
    font-size: 13px;
    padding: 8px 6px;
  }

  /* Styling khusus untuk tabel P5 */
  #p5-project-grid .grades-table th {
    font-size: 12px;
    padding: 8px 6px;
  }

  #p5-project-grid .grades-table td {
    font-size: 12px;
    padding: 8px 6px;
    vertical-align: top;
  }

  #p5-project-grid .grades-table td[rowspan] {
    background: #f8f9fa;
    font-weight: 600;
    border-right: 2px solid #dee2e6;
  }

  /* Styling untuk tabel kehadiran */
  #attendance-grid .grades-table th,
  #attendance-grid .grades-table td {
    text-align: center;
  }

  #attendance-grid .grades-table td:first-child {
    text-align: left;
    font-weight: 600;
  }

  /* Styling untuk tabel status kenaikan */
  #promotion-status-grid .grades-table td:first-child {
    background: #f8f9fa;
    font-weight: 600;
    width: 40%;
  }

  #promotion-status-grid .grades-table td:nth-child(2) {
    width: 60%;
  }

  /* Responsive untuk tabel yang lebih lebar */
  @media (max-width: 768px) {
    #achievement-grid .grades-table,
    #p5-project-grid .grades-table {
      font-size: 11px;
    }

    #achievement-grid .grades-table th,
    #achievement-grid .grades-table td,
    #p5-project-grid .grades-table th,
    #p5-project-grid .grades-table td {
      padding: 6px 4px;
    }
  }

  /* Styling untuk card spacing */
  .grades-card {
    margin-bottom: 20px;
  }

  .grades-card:last-child {
    margin-bottom: 0;
  }

  /* Accordion styles */
  .accordion-header {
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.3s ease;
    border-radius: 8px 8px 0 0;
  }

  .accordion-header:hover {
    background-color: rgba(26, 82, 118, 0.05);
    transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(26, 82, 118, 0.1);
  }

  .accordion-header:hover h3 {
    color: #1a5276;
  }

  .accordion-header:hover .accordion-icon {
    color: #1a5276;
    transform: scale(1.1);
  }

  .accordion-icon {
    transition: all 0.3s ease;
    color: #6c757d;
    font-size: 14px;
  }

  .accordion-body {
    transition: all 0.3s ease;
    overflow: hidden;
  }

  .accordion-card .grades-card-header {
    border-bottom: 1px solid #e9ecef;
  }

  .accordion-card:hover {
    box-shadow: 0 4px 20px rgba(26, 82, 118, 0.1);
    transform: translateY(-2px);
  }

  /* Styling untuk empty state */
  .grades-table td[colspan] {
    font-style: italic;
    color: #6c757d;
    padding: 20px;
  }

  .grade-excellent {
    background: #28a745;
  }

  .grade-good {
    background: #ffc107;
  }

  .grade-poor {
    background: #dc3545;
  }

  .grades-summary {
    background: #f8f9fa;
    padding: 20px;
    border-radius: 8px;
    border: 1px solid #dee2e6;
  }

  .summary-title {
    font-size: 16px;
    font-weight: 600;
    color: #1a5276;
    margin-bottom: 15px;
    text-align: center;
  }

  .summary-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
  }

  .summary-stat {
    text-align: center;
    padding: 10px;
    background: white;
    border-radius: 6px;
    border: 1px solid #dee2e6;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 700;
    color: #1a5276;
    margin-bottom: 5px;
  }

  .stat-label {
    font-size: 12px;
    color: #6c757d;
    font-weight: 500;
  }

  /* Summary Items - New styling for better consistency */
  .summary-item {
    background: white;
    padding: 15px;
    border-radius: 8px;
    border: 1px solid #dee2e6;
    text-align: center;
    transition: all 0.3s ease;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
  }

  .summary-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
  }

  .summary-label {
    font-size: 12px;
    color: #6c757d;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .summary-value {
    font-size: 24px;
    font-weight: 700;
    color: #1a5276;
    display: block;
  }

  /* Special styling for different summary types */
  .summary-item:nth-child(1) .summary-value {
    color: #1a5276;
  }

  .summary-item:nth-child(2) .summary-value {
    color: #28a745;
  }

  .summary-item:nth-child(3) .summary-value {
    color: #ffc107;
  }

  .summary-item:nth-child(4) .summary-value {
    color: #dc3545;
  }

  .summary-item:nth-child(5) .summary-value {
    color: #28a745;
  }

  .summary-item:nth-child(6) .summary-value {
    color: #dc3545;
  }

  /* No Data Message */
  .no-data-message {
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    text-align: center;
  }

  .no-data-content i {
    font-size: 48px;
    color: #ffc107;
    margin-bottom: 20px;
  }

  .no-data-content h3 {
    font-size: 20px;
    color: #1a5276;
    margin-bottom: 10px;
  }

  .no-data-content p {
    color: #6c757d;
    margin-bottom: 20px;
    font-size: 16px;
  }

  /* Error Section */
  .error-section {
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    text-align: center;
  }

  .error-content i {
    font-size: 48px;
    color: #dc3545;
    margin-bottom: 20px;
  }

  .error-content h3 {
    font-size: 20px;
    color: #dc3545;
    margin-bottom: 10px;
  }

  .error-content p {
    color: #6c757d;
    margin-bottom: 20px;
    font-size: 16px;
  }

  .error-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  /* Buttons */
  .btn-primary {
    background: #1a5276;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(26, 82, 118, 0.3);
  }

  .btn-secondary {
    background: #6c757d;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }

  .btn-secondary:hover {
    background: #5a6268;
    transform: translateY(-2px);
  }

  /* Add Data Button Styling */
  .add-data-btn {
    background: linear-gradient(135deg, #28a745, #20c997);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    margin-top: 8px;
    box-shadow: 0 2px 8px rgba(40, 167, 69, 0.2);
  }

  .add-data-btn:hover {
    background: linear-gradient(135deg, #218838, #1e7e34);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
  }

  .add-data-btn:active {
    transform: translateY(0);
    box-shadow: 0 2px 6px rgba(40, 167, 69, 0.2);
  }

  .add-data-btn i {
    font-size: 12px;
  }

  /* Empty Data Row Styling */
  .empty-data-row td {
    padding: 30px 20px !important;
    background: #f8f9fa;
    border: 2px dashed #dee2e6;
    border-radius: 8px;
    font-style: italic;
    color: #6c757d;
  }

  .empty-data-row:hover td {
    background: #e9ecef;
    border-color: #adb5bd;
  }

  /* Textarea styling for extracurricular description */
  .text-input textarea {
    min-height: 80px;
    font-family: inherit;
    line-height: 1.4;
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 4px;
    width: 100%;
    box-sizing: border-box;
    transition: border-color 0.3s ease;
  }

  .text-input textarea:focus {
    outline: none;
    border-color: #1a5276;
    box-shadow: 0 0 0 2px rgba(26, 82, 118, 0.1);
  }

  .grades-table .text-input {
    width: 100%;
  }

  .grades-table textarea.text-input {
    resize: vertical;
    min-height: 60px;
    max-height: 150px;
  }

  /* Mobile Responsive */
  @media (max-width: 768px) {
    .sidebar {
      transform: translateX(-100%);
      width: 280px;
    }

    .sidebar.active {
      transform: translateX(0);
    }

    .main-content {
      margin-left: 0;
      padding: 15px;
    }

    .mobile-toggle {
      display: block;
    }

    .page-header {
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    .page-title-section {
      width: 100%;
    }

    .page-title {
      font-size: 20px;
    }

    .student-info-card {
      grid-template-columns: 1fr;
    }

    .student-details-info {
      grid-template-columns: 1fr;
    }

    .grades-grid {
      grid-template-columns: 1fr;
    }

    .summary-stats {
      grid-template-columns: repeat(2, 1fr);
    }

    .error-actions {
      flex-direction: column;
      align-items: center;
    }
  }

  /* Sidebar mobile state */
  body.sidebar-active .sidebar {
    transform: translateX(0);
  }

  body.sidebar-active::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 999;
  }

  /* Animation for loading */
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .grades-card {
    animation: fadeIn 0.5s ease-out;
  }

  .student-info-card {
    animation: fadeIn 0.3s ease-out;
  }

  /* Refresh Button Styles */
  .refresh-btn {
    background: #17a2b8;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
  }

  .refresh-btn:hover {
    background: #138496;
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(23, 162, 184, 0.3);
  }

  .refresh-btn:active {
    transform: translateY(0);
    box-shadow: 0 2px 4px rgba(23, 162, 184, 0.2);
  }

  .refresh-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  /* Edit Toggle Button - Consistent with Student_edit.html */
  .edit-toggle-btn {
    background: #2ecc71;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
