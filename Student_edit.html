    <script>
      let currentStudentId = null;
      let originalStudentData = {};
      let editModeCards = {};
      let pendingChanges = {};

      // Fungsi untuk toggle sidebar di tampilan mobile
      function toggleSidebar() {
        document.body.classList.toggle("sidebar-active");
      }

      // Fungsi untuk mengupdate tanggal
      function updateDateTime() {
        const now = new Date();
        const options = {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
        };
        document.getElementById("current-date").textContent =
          now.toLocaleDateString("id-ID", options);
      }

      // Get session ID
      function getSessionId() {
        // First try to get from hidden input
        const hiddenInput = document.getElementById("sessionId");
        if (hiddenInput && hiddenInput.value) {
          return hiddenInput.value;
        }

        // Fallback to URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get("sessionId");
      }

      // Get student ID from URL parameters or server-side template
      function getStudentIdFromUrl() {
        // First try to get from server-side template parameter
        const serverStudentId =
          '<?= typeof studentId !== "undefined" ? studentId : "" ?>';
        if (serverStudentId && serverStudentId !== "") {
          return serverStudentId;
        }

        // Fallback to URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const urlStudentId = urlParams.get("id");

        return urlStudentId;
      }

      // Go back to student detail
      function goBack() {
        const sessionId = getSessionId();
        const url =
          "<?= myURL() ?>?page=Student_detail&sessionId=" +
          encodeURIComponent(sessionId) +
          "&id=" +
          encodeURIComponent(currentStudentId);
        window.location.href = url;
      }

      // Show alert message
      function showAlert(message, type = "info") {
        console.log("showAlert called with message:", message, "type:", type);
        const alertContainer = document.getElementById("alert-container");
        console.log("Alert container found:", alertContainer);

        if (!alertContainer) {
          console.error("Alert container not found!");
          return;
        }

        const alertDiv = document.createElement("div");
        alertDiv.className = `alert alert-${type}`;
        alertDiv.innerHTML = message;
        alertContainer.innerHTML = "";
        alertContainer.appendChild(alertDiv);
        console.log("Alert added to container:", alertDiv);

        // Auto hide after 5 seconds
        setTimeout(() => {
          if (alertDiv.parentNode) {
            alertDiv.remove();
            console.log("Alert removed after 5 seconds");
          }
        }, 5000);
      }

      // Toggle edit mode for a card
      function toggleEditMode(cardId) {
        const isEditing = editModeCards[cardId] || false;

        if (isEditing) {
          // Save changes for this card
          saveCardChanges(cardId);
        } else {
          // Enter edit mode
          enterEditMode(cardId);
        }
      }

      // Enter edit mode for a card
      function enterEditMode(cardId) {
        editModeCards[cardId] = true;
        const card = document.querySelector(`[data-card-id="${cardId}"]`);
        const editBtn = card.querySelector(".edit-toggle-btn");

        // Update button
        editBtn.innerHTML = "💾 Simpan";
        editBtn.className = "edit-toggle-btn save-mode";

        // Add cancel button
        const cancelBtn = document.createElement("button");
        cancelBtn.innerHTML = "❌ Batal";
        cancelBtn.className = "edit-toggle-btn cancel-mode";
        cancelBtn.onclick = () => cancelEditMode(cardId);
        editBtn.parentNode.appendChild(cancelBtn);

        // Convert values to inputs - support both table and row formats
        const detailRows = card.querySelectorAll(".detail-row");
        const tableRows = card.querySelectorAll("tr[data-field]");

        // Handle old detail-row format
        detailRows.forEach((row) => {
          const valueElement = row.querySelector(".detail-value");
          const fieldName = row.getAttribute("data-field");

          if (valueElement && fieldName) {
            const currentValue = valueElement.textContent.trim();
            const fieldType = getFieldType(fieldName);

            if (fieldType === "select") {
              const selectOptions = getSelectOptions(fieldName);
              const select = document.createElement("select");
              select.className = "detail-select";
              select.setAttribute("data-field", fieldName);

              selectOptions.forEach((option) => {
                const optionElement = document.createElement("option");
                optionElement.value = option.value;
                optionElement.textContent = option.text;
                if (option.value === currentValue) {
                  optionElement.selected = true;
                }
                select.appendChild(optionElement);
              });

              valueElement.replaceWith(select);
            } else {
              const input = document.createElement("input");
              input.type = fieldType;
              input.className = "detail-input";

              // Handle date fields - convert from display format to YYYY-MM-DD
              if (
                fieldType === "date" &&
                currentValue !== "-" &&
                currentValue !== ""
              ) {
                input.value = convertToDateInputFormat(currentValue);
              } else {
                input.value = currentValue === "-" ? "" : currentValue;
              }

              input.setAttribute("data-field", fieldName);
              valueElement.replaceWith(input);
            }
          }
        });

        // Handle new table format
        tableRows.forEach((row) => {
          const valueElement = row.querySelector(".detail-value");
          const fieldName = row.getAttribute("data-field");

          if (valueElement && fieldName) {
            const currentValue = valueElement.textContent.trim();
            const fieldType = getFieldType(fieldName);

            if (fieldType === "select") {
              const selectOptions = getSelectOptions(fieldName);
              const select = document.createElement("select");
              select.className = "detail-select";
              select.setAttribute("data-field", fieldName);

              selectOptions.forEach((option) => {
                const optionElement = document.createElement("option");
                optionElement.value = option.value;
                optionElement.textContent = option.text;
                if (option.value === currentValue) {
                  optionElement.selected = true;
                }
                select.appendChild(optionElement);
              });

              valueElement.replaceWith(select);
            } else {
              const input = document.createElement("input");
              input.type = fieldType;
              input.className = "detail-input";

              // Handle date fields - convert from display format to YYYY-MM-DD
              if (
                fieldType === "date" &&
                currentValue !== "-" &&
                currentValue !== ""
              ) {
                input.value = convertToDateInputFormat(currentValue);
              } else {
                input.value = currentValue === "-" ? "" : currentValue;
              }

              input.setAttribute("data-field", fieldName);
              valueElement.replaceWith(input);
            }
          }
        });
      }

      // Cancel edit mode for a card
      function cancelEditMode(cardId) {
        editModeCards[cardId] = false;
        const card = document.querySelector(`[data-card-id="${cardId}"]`);
        const editBtn = card.querySelector(".edit-toggle-btn.save-mode");
        const cancelBtn = card.querySelector(".edit-toggle-btn.cancel-mode");

        // Update button
        editBtn.innerHTML = "✏️ Edit";
        editBtn.className = "edit-toggle-btn";

        // Remove cancel button
        if (cancelBtn) {
          cancelBtn.remove();
        }

        // Restore original values - support both table and row formats
        const detailRows = card.querySelectorAll(".detail-row");
        const tableRows = card.querySelectorAll("tr[data-field]");

        // Handle old detail-row format
        detailRows.forEach((row) => {
          const inputElement = row.querySelector(
            ".detail-input, .detail-select"
          );
          const fieldName = row.getAttribute("data-field");

          if (inputElement && fieldName) {
            const originalValue = getOriginalValue(fieldName);
            const valueDiv = document.createElement("div");
            valueDiv.className = "detail-value";
            valueDiv.textContent = originalValue || "-";
            inputElement.replaceWith(valueDiv);
          }
        });

        // Handle new table format
        tableRows.forEach((row) => {
          const inputElement = row.querySelector(
            ".detail-input, .detail-select"
          );
          const fieldName = row.getAttribute("data-field");

          if (inputElement && fieldName) {
            const originalValue = getOriginalValue(fieldName);
            const valueDiv = document.createElement("div");
            valueDiv.className = "detail-value";
            valueDiv.textContent = originalValue || "-";
            inputElement.replaceWith(valueDiv);
          }
        });
      }

      // Save changes for a specific card
      function saveCardChanges(cardId) {
        const card = document.querySelector(`[data-card-id="${cardId}"]`);
        // Get inputs from both old detail-row format and new table format
        const inputs = card.querySelectorAll(".detail-input, .detail-select");
        const changes = {};

        inputs.forEach((input) => {
          const fieldName = input.getAttribute("data-field");
          const newValue = input.value.trim();
          const originalValue = getOriginalValue(fieldName);

          if (newValue !== originalValue) {
            changes[fieldName] = newValue;
            pendingChanges[fieldName] = newValue;
          }
        });

        if (Object.keys(changes).length > 0) {
          // Save to server
          saveChangesToServer(changes, cardId);
        } else {
          // No changes, just exit edit mode
          exitEditMode(cardId);
        }
      }

      // Exit edit mode and update display
      function exitEditMode(cardId) {
        editModeCards[cardId] = false;
        const card = document.querySelector(`[data-card-id="${cardId}"]`);
        const editBtn = card.querySelector(".edit-toggle-btn.save-mode");
        const cancelBtn = card.querySelector(".edit-toggle-btn.cancel-mode");

        // Update button
        editBtn.innerHTML = "✏️ Edit";
        editBtn.className = "edit-toggle-btn";

        // Remove cancel button
        if (cancelBtn) {
          cancelBtn.remove();
        }

        // Convert inputs back to values - support both table and row formats
        const detailRows = card.querySelectorAll(".detail-row");
        const tableRows = card.querySelectorAll("tr[data-field]");

        // Handle old detail-row format
        detailRows.forEach((row) => {
          const inputElement = row.querySelector(
            ".detail-input, .detail-select"
          );
          const fieldName = row.getAttribute("data-field");

          if (inputElement && fieldName) {
            const currentValue =
              pendingChanges[fieldName] || getOriginalValue(fieldName);
            const valueDiv = document.createElement("div");
            valueDiv.className = "detail-value";
            valueDiv.textContent = currentValue || "-";
            inputElement.replaceWith(valueDiv);
          }
        });

        // Handle new table format
        tableRows.forEach((row) => {
          const inputElement = row.querySelector(
            ".detail-input, .detail-select"
          );
          const fieldName = row.getAttribute("data-field");

          if (inputElement && fieldName) {
            const currentValue =
              pendingChanges[fieldName] || getOriginalValue(fieldName);
            const valueDiv = document.createElement("div");
            valueDiv.className = "detail-value";
            valueDiv.textContent = currentValue || "-";
            inputElement.replaceWith(valueDiv);
          }
        });
      }

      // Convert date from display format to input format (YYYY-MM-DD)
      function convertToDateInputFormat(dateString) {
        if (!dateString || dateString === "-" || dateString === "") {
          return "";
        }

        // Try to parse various date formats
        try {
          // Handle format like "21 Juni 2025" (Indonesian month names)
          const monthNames = {
            Januari: "01",
            Februari: "02",
            Maret: "03",
            April: "04",
            Mei: "05",
            Juni: "06",
            Juli: "07",
            Agustus: "08",
            September: "09",
            Oktober: "10",
            November: "11",
            Desember: "12",
          };

          // Check if it's in Indonesian format (DD Month YYYY)
          const indonesianMatch = dateString.match(
            /(\d{1,2})\s+(\w+)\s+(\d{4})/
          );
          if (indonesianMatch) {
            const day = indonesianMatch[1].padStart(2, "0");
            const monthName = indonesianMatch[2];
            const year = indonesianMatch[3];
            const month = monthNames[monthName];
            if (month) {
              return `${year}-${month}-${day}`;
            }
          }

          // Try to parse as standard date formats
          const date = new Date(dateString);
          if (!isNaN(date.getTime())) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
          }

          // If all else fails, return original string
          return dateString;
        } catch (error) {
          console.warn("Error converting date format:", error);
          return dateString;
        }
      }

      // Save changes to server
      function saveChangesToServer(changes, cardId) {
        const sessionId = getSessionId();

        // Show loading state
        const card = document.querySelector(`[data-card-id="${cardId}"]`);
        const editBtn = card.querySelector(".edit-toggle-btn.save-mode");
        const originalText = editBtn.innerHTML;
        editBtn.innerHTML = "⏳ Menyimpan...";
        editBtn.disabled = true;

        // Prepare data for server
        const updateData = {
          studentId: currentStudentId,
          changes: changes,
        };

        google.script.run
          .withSuccessHandler(function (result) {
            console.log("Server response for cardId", cardId, ":", result);
            editBtn.innerHTML = originalText;
            editBtn.disabled = false;

            if (result.success) {
              console.log("Showing success alert for cardId:", cardId);
              showAlert("✅ Data berhasil disimpan!", "success");

              // Update original data
              Object.keys(changes).forEach((key) => {
                originalStudentData[key] = changes[key];
              });

              exitEditMode(cardId);
            } else {
              console.log(
                "Showing error alert for cardId:",
                cardId,
                "Error:",
                result.error
              );
              showAlert(
                "❌ Gagal menyimpan data: " + (result.error || "Unknown error"),
                "danger"
              );
            }
          })
          .withFailureHandler(function (error) {
            console.log(
              "Failure handler called for cardId",
              cardId,
              "Error:",
              error
            );
            editBtn.innerHTML = originalText;
            editBtn.disabled = false;
            showAlert(
              "❌ Terjadi kesalahan saat menyimpan: " + error.message,
              "danger"
            );
          })
          .updateStudentData(updateData, sessionId);
      }

      // Save all pending changes
      function saveAllChanges() {
        if (Object.keys(pendingChanges).length === 0) {
          showAlert("ℹ️ Tidak ada perubahan untuk disimpan.", "info");
          return;
        }

        const sessionId = getSessionId();
        const updateData = {
          studentId: currentStudentId,
          changes: pendingChanges,
        };

        // Show loading state
        const saveBtn = document.querySelector(".btn-success");
        const originalText = saveBtn.innerHTML;
        saveBtn.innerHTML = '<span class="btn-icon">⏳</span>Menyimpan...';
        saveBtn.disabled = true;

        google.script.run
          .withSuccessHandler(function (result) {
            saveBtn.innerHTML = originalText;
            saveBtn.disabled = false;

            if (result.success) {
              showAlert("✅ Semua perubahan berhasil disimpan!", "success");

              // Update original data
              Object.keys(pendingChanges).forEach((key) => {
                originalStudentData[key] = pendingChanges[key];
              });

              // Clear pending changes
              pendingChanges = {};

              // Exit all edit modes
              Object.keys(editModeCards).forEach((cardId) => {
                if (editModeCards[cardId]) {
                  exitEditMode(cardId);
                }
              });
            } else {
              showAlert(
                "❌ Gagal menyimpan data: " + (result.error || "Unknown error"),
                "danger"
              );
            }
          })
          .withFailureHandler(function (error) {
            saveBtn.innerHTML = originalText;
            saveBtn.disabled = false;
            showAlert(
              "❌ Terjadi kesalahan saat menyimpan: " + error.message,
              "danger"
            );
          })
          .updateStudentData(updateData, sessionId);
      }

      // Load student data for editing
      function loadStudentForEdit(studentId) {
        if (!studentId) {
          showError("ID siswa tidak ditemukan");
          return;
        }

        currentStudentId = studentId;
        const sessionId = getSessionId();

        // Show loading indicator
        document.getElementById("detail-content").innerHTML = `
          <div class="loading-container" style="text-align: center; padding: 50px;">
            <div style="font-size: 18px; color: #666;">Memuat data siswa untuk diedit...</div>
            <div style="margin-top: 10px; font-size: 14px; color: #999;">NIS: ${studentId}</div>
          </div>
        `;

        google.script.run
          .withSuccessHandler(function (student) {
            if (!student) {
              showError("Data siswa tidak ditemukan");
              return;
            }

            originalStudentData = { ...student };
            renderStudentEditForm(student);
          })
          .withFailureHandler(function (error) {
