<script>
  let studentData = null;
  let academicGrades = [];
  let examGrades = [];

  // Simple cache management for student detail
  const DETAIL_CACHE_EXPIRY_TIME = 5 * 60 * 1000; // 5 minutes
  let detailCacheTimestamp = null;

  // Cache management functions
  function isDetailCacheValid() {
    if (!detailCacheTimestamp || !studentData) {
      return false;
    }
    const now = Date.now();
    return now - detailCacheTimestamp < DETAIL_CACHE_EXPIRY_TIME;
  }

  function invalidateDetailCache() {
    studentData = null;
    academicGrades = [];
    examGrades = [];
    detailCacheTimestamp = null;
  }

  // Fungsi untuk toggle sidebar di tampilan mobile
  function toggleSidebar() {
    document.body.classList.toggle("sidebar-active");
  }

  // Fungsi untuk mengupdate tanggal
  function updateDateTime() {
    const now = new Date();
    const options = {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric",
    };
    document.getElementById("current-date").textContent =
      now.toLocaleDateString("id-ID", options);
  }

  // Get session ID
  function getSessionId() {
    // First try to get from hidden input
    const hiddenInput = document.getElementById("sessionId");
    if (hiddenInput && hiddenInput.value) {
      return hiddenInput.value;
    }

    // Fallback to URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get("sessionId");
  }

  // Get student ID (NIS)
  function getStudentId() {
    // First try to get from hidden input
    const hiddenInput = document.getElementById("studentId");
    if (hiddenInput && hiddenInput.value) {
      return hiddenInput.value;
    }

    // Fallback to URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get("nis");
  }

  // Fungsi untuk mendapatkan kelas dari URL
  function getKelas() {
    // First try to get from hidden input
    const hiddenInput = document.getElementById("kelas");
    if (hiddenInput && hiddenInput.value) {
      return hiddenInput.value;
    }

    // Fallback to URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get("kelas");
  }

  // Fungsi untuk mendapatkan semester dari URL
  function getSemester() {
    // First try to get from hidden input
    const hiddenInput = document.getElementById("semester");
    if (hiddenInput && hiddenInput.value) {
      return hiddenInput.value;
    }

    // Fallback to URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get("semester");
  }

  // Go back to students grades list
  function goBack() {
    const sessionId = getSessionId();
    window.location.href =
      "<?= myURL() ?>?page=Students_grades&sessionId=" +
      encodeURIComponent(sessionId);
  }

  // Fungsi untuk memuat data siswa
  function loadStudentData(forceRefresh = false) {
    const sessionId = getSessionId();
    const studentId = getStudentId();
    const kelas = getKelas();
    const semester = getSemester();

    if (!sessionId) {
      showError("Session tidak valid. Silakan login kembali.");
      return;
    }

    if (!studentId) {
      showError("ID siswa tidak valid.");
      return;
    }

    // Check if we should use cached data
    if (!forceRefresh && isDetailCacheValid()) {
      console.log("Using cached student detail data");
      renderStudentInfo();
      renderGrades();
      return;
    }

    console.log(
      "Loading student data for ID:",
      studentId,
      "Kelas:",
      kelas,
      "Semester:",
      semester
    );

    // Show loading
    showLoading();

    // Tambahkan timeout untuk debugging
    const startTime = new Date().getTime();

    google.script.run
      .withSuccessHandler(function (data) {
        const endTime = new Date().getTime();
        const duration = endTime - startTime;

        console.log("=== SUCCESS HANDLER CALLED ===");
        console.log("Request duration:", duration + "ms");
        console.log("getStudentGradeDetail response:", data);

        // Validasi lebih detail
        if (data === null) {
          console.error("Response data is null");
          showError("Data tidak ditemukan (null). NIS: " + studentId);
          return;
        }

        if (data === undefined) {
          console.error("Response data is undefined");
          showError("Data tidak ditemukan (undefined). NIS: " + studentId);
          return;
        }

        if (!data) {
          console.error("Response data is falsy:", data);
          showError("Data tidak ditemukan (falsy). NIS: " + studentId);
          return;
        }

        // Validate response object has required properties
        if (typeof data !== "object") {
          console.error("Invalid response data format:", typeof data);
          showError("Format data tidak valid. Type: " + typeof data);
          return;
        }

        if (data && data.success) {
          if (data.student && data.grades) {
            studentData = data.student;
            allGrades = data.grades || [];
            gradeSummary = data.summary || {};

            console.log("Student data:", studentData);
            console.log("All grades:", allGrades);
            console.log("Grade summary:", gradeSummary);

            // Validasi data siswa
            const hasNIS = studentData.nis || studentData.NIS;
            const hasName = studentData.nama || studentData["Nama Siswa"];

            if (!hasNIS && !hasName) {
              console.error("Student object missing essential data");
              console.error("Available keys:", Object.keys(studentData));
              showError("Data siswa tidak lengkap. Missing NIS and Name.");
              return;
            }

            // Set cache timestamp
            detailCacheTimestamp = Date.now();

            renderStudentInfo();
            renderGrades();
          } else {
            console.log("No student or grades data found");
            showNoData();
          }
        } else {
          const errorMessage =
            data && data.error ? data.error : "Gagal memuat data siswa";
          console.error("Response indicates failure:", errorMessage);
          showError(errorMessage);
        }
      })
      .withFailureHandler(function (error) {
        const endTime = new Date().getTime();
        const duration = endTime - startTime;

        console.error("=== FAILURE HANDLER CALLED ===");
        console.error("Request duration:", duration + "ms");
        console.error("Error loading student data:", error);
        console.error("Error type:", typeof error);
        console.error(
          "Error constructor:",
          error ? error.constructor.name : "No constructor"
        );

        let errorMessage = "Gagal memuat data nilai siswa";
        let debugInfo = "";

        if (error && error.message) {
          errorMessage += ": " + error.message;
          debugInfo += "Message: " + error.message + "\n";
        } else if (typeof error === "string") {
          errorMessage += ": " + error;
          debugInfo += "String error: " + error + "\n";
        } else {
          debugInfo += "Unknown error type: " + typeof error + "\n";
        }

        debugInfo += "NIS: " + studentId + "\n";
        debugInfo += "Session: " + sessionId + "\n";
        debugInfo += "Kelas: " + kelas + "\n";
        debugInfo += "Semester: " + semester + "\n";
        debugInfo += "Duration: " + duration + "ms";

        console.error("Debug info:", debugInfo);

        showError(errorMessage);
      })
      .getStudentGradeDetail(studentId, kelas, semester);
  }

  // Fungsi untuk menampilkan loading
  function showLoading() {
    document.getElementById("student-info-section").style.display = "block";
    document.getElementById("grades-section").style.display = "none";
    document.getElementById("error-section").style.display = "none";

    // Show loading indicator in student info section
    const studentInfoSection = document.getElementById("student-info-section");
    studentInfoSection.innerHTML = `
      <div class="loading-container" style="text-align: center; padding: 50px;">
        <div style="font-size: 18px; color: #666;">Memuat data nilai siswa...</div>
      </div>
    `;
  }

  // Fungsi untuk menampilkan error
  function showError(message) {
    document.getElementById("student-info-section").style.display = "none";
    document.getElementById("grades-section").style.display = "none";
    document.getElementById("error-section").style.display = "block";

    const errorSection = document.getElementById("error-section");
    errorSection.innerHTML = `
      <div class="error-container">
        <h3><i class="fas fa-times-circle"></i> Error Memuat Data Nilai Siswa</h3>
        <p><strong>Pesan:</strong> ${message}</p>
        <div style="margin-top: 15px;">
          <button class="btn btn-primary" onclick="loadStudentData()"><i class="fas fa-sync-alt"></i> Coba Lagi</button>
          <button class="btn btn-secondary" onclick="goBack()"><i class="fas fa-clipboard"></i> Kembali ke Daftar Nilai</button>
        </div>
      </div>
    `;
  }

  // Fungsi untuk menampilkan pesan tidak ada data
  function showNoData() {
    document.getElementById("student-info-section").style.display = "none";
    document.getElementById("error-section").style.display = "none";
    document.getElementById("grades-section").style.display = "block";
    document.getElementById("no-data-message").style.display = "block";
    document.getElementById("academic-grades-card").style.display = "none";
    document.getElementById("exam-grades-card").style.display = "none";
  }

  // Fungsi untuk menampilkan informasi siswa
  function renderStudentInfo() {
    const studentInfoSection = document.getElementById("student-info-section");

    const statusClass = `status-${(studentData.status || "Aktif")
      .toLowerCase()
      .replace(/\s+/g, "-")}`;
    const studentInitial = studentData.nama
      ? studentData.nama.charAt(0).toUpperCase()
      : "?";

    // Generate summary info HTML
    let summaryInfoHtml = "";
    if (gradeSummary) {
      summaryInfoHtml = `
        <div class="detail-item">
          <div class="detail-label">Total Mata Pelajaran</div>
          <div class="detail-value">${gradeSummary.totalSubjects || 0}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Rata-rata</div>
          <div class="detail-value">${
            gradeSummary.averageGrade
              ? gradeSummary.averageGrade.toFixed(1)
              : "0.0"
          }</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Nilai Tertinggi</div>
          <div class="detail-value">${gradeSummary.highestGrade || 0}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Nilai Terendah</div>
          <div class="detail-value">${gradeSummary.lowestGrade || 0}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Lulus</div>
          <div class="detail-value">${gradeSummary.passedSubjects || 0}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Tidak Lulus</div>
          <div class="detail-value">${gradeSummary.failedSubjects || 0}</div>
        </div>
      `;
    } else {
      summaryInfoHtml = `
        <div class="detail-item">
          <div class="detail-label">Status</div>
          <div class="detail-value">Data nilai belum tersedia</div>
        </div>
      `;
    }

    studentInfoSection.innerHTML = `
      <div class="student-info-card">
        <div class="student-basic-info">
          <div class="student-avatar">${studentInitial}</div>
          <div class="student-name">${
            studentData.nama || "Nama tidak tersedia"
          }</div>
          <div class="student-nis">NIS: ${studentData.nis || "-"} | NISN: ${
      studentData.nisn || "-"
    }</div>
          <div class="student-status ${statusClass}">${
      studentData.status || "Aktif"
    }</div>
        </div>
        
        <div class="student-details-info">
          ${summaryInfoHtml}
        </div>
      </div>
    `;

    studentInfoSection.style.display = "block";
  }

  // Fungsi untuk menampilkan nilai
  function renderGrades() {
    document.getElementById("grades-section").style.display = "block";
    document.getElementById("no-data-message").style.display = "none";

    // Check if we have grades data
    if (!allGrades || allGrades.length === 0) {
      showNoData();
      return;
    }

    // Get the first grade record (since all records are for the same student/class/semester)
    const gradeRecord = allGrades[0];
    const kelas = getKelas();
    const semester = getSemester();

    // Show academic grades
    renderAcademicGrades(gradeRecord);

    // Show additional data sections
    renderExtracurricular();
    renderAchievements();
    renderP5Projects();
    renderAttendance();
    renderPromotionStatus();

    // Re-render student info with summary data now available
    renderStudentInfo();

    // Show exam grades if available
    renderExamGrades();
  }

  // Fungsi untuk menampilkan nilai akademik
  function renderAcademicGrades(gradeRecord) {
    const academicCard = document.getElementById("academic-grades-card");
    const semesterInfo = document.getElementById("academic-semester-info");
    const gradesGrid = document.getElementById("academic-grades-grid");
    const gradesSummary = document.getElementById("academic-grades-summary");

    // Show semester info
    const kelas = getKelas() || gradeRecord.kelas || "Tidak diketahui";
    const semester = getSemester() || gradeRecord.semester || "Tidak diketahui";

    semesterInfo.textContent = `Kelas ${kelas} - Semester ${semester}`;

    // Define subject fields
    const subjectFields = [
      { key: "pendidikanAgamaIslam", name: "Pendidikan Agama Islam" },
      { key: "pendidikanPancasila", name: "Pendidikan Pancasila" },
      { key: "bahasaIndonesia", name: "Bahasa Indonesia" },
      { key: "matematika", name: "Matematika" },
      { key: "ilmuPengetahuanAlam", name: "Ilmu Pengetahuan Alam" },
      { key: "ilmuPengetahuanSosial", name: "Ilmu Pengetahuan Sosial" },
      { key: "bahasaInggris", name: "Bahasa Inggris" },
      {
        key: "pendidikanJasmani",
        name: "Pendidikan Jasmani, Olahraga, dan Kesehatan",
      },
      { key: "informatika", name: "Informatika" },
      { key: "seniBudaya", name: "Seni Budaya" },
      { key: "bimbinganKonseling", name: "Bimbingan dan Konseling" },
      { key: "bahasaJawa", name: "Bahasa Jawa" },
    ];

    // Render grades as table
    let gradesHtml = `
      <table class="grades-table">
        <thead>
          <tr>
            <th>Mata Pelajaran</th>
            <th>Nilai</th>
            <th>Capaian Pembelajaran</th>
          </tr>
        </thead>
        <tbody>
    `;

    // Mapping untuk capaian pembelajaran
    const capaianMapping = {
      "pendidikanAgamaIslam": "Capaian Pembelajaran (Pendidikan Agama Islam)",
      "pendidikanPancasila": "Capaian Pembelajaran (Pendidikan Pancasila)",
      "bahasaIndonesia": "Capaian Pembelajaran (Bahasa Indonesia)",
      "matematika": "Capaian Pembelajaran (Matematika)",
      "ilmuPengetahuanAlam": "Capaian Pembelajaran (Ilmu Pengetahuan Alam)",
      "ilmuPengetahuanSosial": "Capaian Pembelajaran (Ilmu Pengetahuan Sosial)",
      "bahasaInggris": "Capaian Pembelajaran (Bahasa Inggris)",
      "pendidikanJasmani": "Capaian Pembelajaran (PJOK)",
      "informatika": "Capaian Pembelajaran (Informatika)",
      "seniBudaya": "Capaian Pembelajaran (Seni Budaya)",
      "bimbinganKonseling": "Capaian Pembelajaran (BK)",
      "bahasaJawa": "Capaian Pembelajaran (Bahasa Jawa)",
    };

    subjectFields.forEach((subject) => {
      const nilai = gradeRecord[subject.key];
      const nilaiDisplay =
        nilai && nilai !== "" ? parseFloat(nilai).toFixed(0) : "-";
      const gradeClass =
        nilai && parseFloat(nilai) >= 75
          ? "grade-pass"
          : nilai && parseFloat(nilai) > 0
          ? "grade-fail"
          : "grade-empty";

      // Ambil capaian pembelajaran dari studentData
      const capaianKey = capaianMapping[subject.key];
      const capaian = (studentData && studentData[capaianKey]) || "-";
      const capaianDisplay = capaian && capaian !== "" ? capaian : "-";

      gradesHtml += `
        <tr>
          <td class="subject-name">${subject.name}</td>
          <td><span class="grade-value ${gradeClass}">${nilaiDisplay}</span></td>
          <td class="achievement-text">${capaianDisplay}</td>
        </tr>
      `;
    });

    gradesHtml += `
        </tbody>
      </table>
    `;

    gradesGrid.innerHTML = gradesHtml;

    // Hide summary section since it's now moved to student info
    gradesSummary.style.display = "none";

    academicCard.style.display = "block";
  }

  // Fungsi untuk menampilkan data ekstrakurikuler

            <th>Keterangan</th>

      {
        name: studentData["Ekstrakurikuler 1"] || "-",
        desc: studentData["Keterangan Ekstrakurikuler 1"] || "-",
      },
      {
        name: studentData["Ekstrakurikuler 2"] || "-",
        desc: studentData["Keterangan Ekstrakurikuler 2"] || "-",
      },
      {
        name: studentData["Ekstrakurikuler 3"] || "-",
        desc: studentData["Keterangan Ekstrakurikuler 3"] || "-",
      },
      {
        name: studentData["Ekstrakurikuler 4"] || "-",
        desc: studentData["Keterangan Ekstrakurikuler 4"] || "-",
      },
    ];

    let hasData = false;

    `;

    extracurricularGrid.innerHTML = extracurricularHtml;
    extracurricularCard.style.display = "block";
  }

  // Fungsi untuk menampilkan projek P5
  function renderP5Projects() {
    const p5Card = document.getElementById("p5-project-card");
    const p5Grid = document.getElementById("p5-project-grid");

    if (!studentData) {
      p5Card.style.display = "none";
      return;
    }

    let p5Html = `
      <table class="grades-table">
        <thead>
          <tr>
            <th>Tema Projek</th>
            <th>Dimensi</th>
            <th>Elemen</th>
            <th>Sub-Elemen</th>
            <th>Target Pencapaian</th>
          </tr>
        </thead>
        <tbody>
    `;

    // Data projek P5 dari kolom 45-65
    const p5Themes = [
      studentData["Tema Projek 1"] || "-",
      studentData["Tema Projek 2"] || "-",
      studentData["Tema Projek 3"] || "-",
    ];

    const p5Dimensions = [
      {
        name: "Beriman, Bertakwa kepada Tuhan Yang Maha Esa, dan Berakhlak Mulia",

  // Accordion functionality
  function toggleAccordion(cardId) {
    const allCards = [
      "academic-grades",
      "extracurricular",
      "achievement",
      "p5-project",
      "attendance",
      "promotion-status",
    ];
    const targetBody = document.getElementById(cardId + "-body");
    const targetIcon = document.getElementById(cardId + "-icon");

    // Close all other cards
    allCards.forEach((id) => {
      if (id !== cardId) {
        const body = document.getElementById(id + "-body");
        const icon = document.getElementById(id + "-icon");
        if (body && icon) {
          body.style.display = "none";
          icon.classList.remove("fa-chevron-up");
          icon.classList.add("fa-chevron-down");
        }
      }
    });

    // Toggle the clicked card
    if (targetBody && targetIcon) {
      if (
        targetBody.style.display === "none" ||
        targetBody.style.display === ""
      ) {
        targetBody.style.display = "block";
        targetIcon.classList.remove("fa-chevron-down");
        targetIcon.classList.add("fa-chevron-up");
      } else {
        targetBody.style.display = "none";
        targetIcon.classList.remove("fa-chevron-up");
        targetIcon.classList.add("fa-chevron-down");
      }
    }
  }

  // Enter edit mode for a card - consistent with Student_edit.html
  function enterEditMode(cardId) {
    editModeCards[cardId] = true;
    const card = document.querySelector(`[data-card-id="${cardId}"]`);
    const editBtn = card.querySelector(".edit-toggle-btn");

    if (!editBtn) return;

    // Handle different card types
    switch (cardId) {
      case 'academic-grades':
        enterEditModeAcademic(card, editBtn);
        break;
      case 'extracurricular':
        enterEditModeExtracurricular(card, editBtn);
        break;
      case 'achievement':
        enterEditModeAchievement(card, editBtn);
        break;
      case 'p5-grades':
        enterEditModeP5(card, editBtn);
        break;
      case 'attendance':
        enterEditModeAttendance(card, editBtn);
        break;
      case 'promotion-status':
        enterEditModePromotion(card, editBtn);
        break;
      case 'exam-grades':
        enterEditModeExam(card, editBtn);
        break;
      default:
        showGradeAlert(
          "Fitur edit untuk card ini belum diimplementasikan. Silakan gunakan halaman edit terpisah.",
          "warning"
        );
        return;
    }
  }

  // Enter edit mode for academic grades card
  function enterEditModeAcademic(card, editBtn) {
    const gradesTable = card.querySelector(".grades-table");
    if (!gradesTable) return;

    // Update button
    editBtn.innerHTML = '<i class="fas fa-save"></i> Simpan';
    editBtn.className = "edit-toggle-btn save-mode";

    // Add cancel button
    const cancelBtn = document.createElement("button");
    cancelBtn.innerHTML = '<i class="fas fa-times"></i> Batal';
    cancelBtn.className = "edit-toggle-btn cancel-mode";
    cancelBtn.onclick = () => cancelEditMode('academic-grades');
    editBtn.parentNode.appendChild(cancelBtn);

    // Add edit-mode class to table
    gradesTable.classList.add("edit-mode");

    // Convert grade values to inputs
    const gradeValueElements = gradesTable.querySelectorAll(".grade-value");
    gradeValueElements.forEach((element) => {
      const currentValue = element.textContent.trim();
      const parentRow = element.closest("tr");
      const subjectCell = parentRow.querySelector(".subject-name");

      if (subjectCell) {
        const subjectName = subjectCell.textContent.trim();
        const fieldName = getGradeFieldName(subjectName);

        if (fieldName) {
          // Store original value
          originalGradeData[fieldName] =
            currentValue === "-" ? "" : currentValue;

          // Create input
          const input = document.createElement("input");
          input.type = "number";
          input.className = "grade-input";
          input.min = "0";
          input.max = "100";
          input.step = "0.1";
          input.value = currentValue === "-" ? "" : currentValue;
          input.setAttribute("data-field", fieldName);
          input.setAttribute("data-subject", subjectName);

          // Add validation
          input.addEventListener("input", validateGradeInput);
          input.addEventListener("blur", validateGradeInput);

          // Clear existing content and add input
          element.innerHTML = "";
          element.appendChild(input);
        }
      }
    });

    // Convert achievement text to inputs
    const achievementElements =
      gradesTable.querySelectorAll(".achievement-text");
    achievementElements.forEach((element) => {
      const currentValue = element.textContent.trim();
      const parentRow = element.closest("tr");
      const subjectCell = parentRow.querySelector(".subject-name");

      if (subjectCell) {
        const subjectName = subjectCell.textContent.trim();
        const fieldName = getAchievementFieldName(subjectName);

        if (fieldName) {
          // Store original value
          originalGradeData[fieldName] =
            currentValue === "-" ? "" : currentValue;

          // Create textarea for achievement
          const textarea = document.createElement("textarea");
          textarea.className = "achievement-input";
          textarea.rows = "4"; // Increased from 2 to 4 for longer text
          textarea.value = currentValue === "-" ? "" : currentValue;
          textarea.setAttribute("data-field", fieldName);
          textarea.setAttribute("data-subject", subjectName);
          textarea.placeholder =
            "Masukkan capaian pembelajaran siswa selama 1 semester...";

          // Clear existing content and add textarea
          element.innerHTML = "";
          element.appendChild(textarea);
        }
      }
    });

    showGradeAlert(
      "Mode edit nilai diaktifkan. Ubah nilai dan klik Simpan.",
      "info"
    );
  }

  // Cancel edit mode for grade inputs
  function cancelEditModeGrades(gradesTable) {
    const gradeInputs = gradesTable.querySelectorAll(".grade-input");
    gradeInputs.forEach((input) => {
      const fieldName = input.getAttribute("data-field");
      const originalValue = originalGradeData[fieldName] || "";
      const parentElement = input.parentElement;

      // Restore grade value display
      const displayValue =
        originalValue === "" ? "-" : parseFloat(originalValue).toFixed(0);
      const gradeClass =
        originalValue && parseFloat(originalValue) >= 75
          ? "grade-pass"
          : originalValue && parseFloat(originalValue) > 0
          ? "grade-fail"
          : "grade-empty";

      // Remove input and create new span element
      input.remove();
      const gradeSpan = document.createElement("span");
      gradeSpan.className = `grade-value ${gradeClass}`;
      gradeSpan.textContent = displayValue;

      // Ensure parent element is clean before adding span
      parentElement.innerHTML = "";
      parentElement.appendChild(gradeSpan);
    });

    // Restore achievement inputs if present
    const achievementInputs = gradesTable.querySelectorAll(".achievement-input");
    achievementInputs.forEach((textarea) => {
      const fieldName = textarea.getAttribute("data-field");
      const originalValue = originalGradeData[fieldName] || "";
      const parentElement = textarea.parentElement;

      // Restore achievement text display
      const displayValue = originalValue === "" ? "-" : originalValue;

      // Remove textarea and create new span element
      textarea.remove();
      const achievementSpan = document.createElement("span");
      achievementSpan.className = "achievement-text";
      achievementSpan.textContent = displayValue;

      // Ensure parent element is clean before adding span
      parentElement.innerHTML = "";
      parentElement.appendChild(achievementSpan);
    });

  // Save changes for a specific card - consistent with Student_edit.html
  function saveCardChanges(cardId) {
    const sessionId = getSessionId();
    const studentId = getStudentId();
    const kelas = getKelas();
    const semester = getSemester();
    const card = document.querySelector(`[data-card-id="${cardId}"]`);
    const gradesTable = card.querySelector(".grades-table");

    if (!sessionId || !studentId || !kelas || !semester || !gradesTable) {
      showGradeAlert("Data tidak lengkap untuk menyimpan.", "error");
      return;
    }

    // Collect changes based on card type
    const changes = {};
    let hasChanges = false;
    let hasErrors = false;

    // Handle different input types based on card
    switch (cardId) {
      case 'academic-grades':
      case 'exam-grades':
        collectGradeChanges(gradesTable, changes, originalGradeData);
        break;
      case 'extracurricular':
      case 'achievement':
        collectTextChanges(gradesTable, changes, originalGradeData);
        break;
      case 'attendance':
        collectNumberChanges(gradesTable, changes, originalGradeData);
        break;
      default:
        collectGenericChanges(gradesTable, changes, originalGradeData);
        break;
    }

    // Check if there are changes
    hasChanges = Object.keys(changes).length > 0;

    // Check for validation errors
    const invalidInputs = gradesTable.querySelectorAll(".invalid");
    hasErrors = invalidInputs.length > 0;

    if (hasErrors) {
      showGradeAlert(
        "Terdapat nilai yang tidak valid. Periksa kembali input Anda.",
        "error"
      );
      return;
    }

    if (!hasChanges) {
      showGradeAlert("Tidak ada perubahan untuk disimpan.", "info");
      exitEditMode(cardId);
      return;
    }

    // Show loading state
    const editBtn = card.querySelector(".edit-toggle-btn.save-mode");
    const originalText = editBtn.innerHTML;
    editBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
    editBtn.disabled = true;

    // Prepare data for server
    const updateData = {
      studentId: studentId,
      kelas: kelas,
      semester: semester,
      changes: changes,
    };

    // Call server function
    google.script.run
      .withSuccessHandler(function (result) {
        editBtn.innerHTML = originalText;
        editBtn.disabled = false;

        if (result.success) {
          showGradeAlert("Nilai berhasil disimpan!", "success");

          // Update original data
          Object.keys(changes).forEach((key) => {
            originalGradeData[key] = changes[key];
          });

          exitEditMode(cardId);

          // Refresh data to show updated values
          setTimeout(() => {
            refreshStudentDetail();
          }, 1000);
        } else {
          showGradeAlert(
            "Gagal menyimpan nilai: " + (result.error || "Unknown error"),
            "error"
          );
        }
      })
      .withFailureHandler(function (error) {
        editBtn.innerHTML = originalText;
        editBtn.disabled = false;
        showGradeAlert("Terjadi kesalahan: " + error.message, "error");
      })
      .updateStudentGrades(updateData, sessionId);
  }

  // Validate grade input
  function validateGradeInput(event) {
    const input = event.target;
    const value = input.value.trim();

    // Remove invalid class first
    input.classList.remove("invalid");

    if (value !== "") {
      const numericValue = parseFloat(value);
      if (isNaN(numericValue) || numericValue < 0 || numericValue > 100) {
        input.classList.add("invalid");
        return false;
      }
    }

    return true;
  }

    };

    return achievementFieldMap[subjectName] || null;
  }

  // Get exam grade field name from subject name
  function getExamGradeFieldName(subjectName) {
    // Mapping nama mata pelajaran ke nama kolom ujian sekolah di sheet DATA NILAI
    const examFieldMap = {
      "Pendidikan Agama Islam": "Pendidikan Agama Islam - Ujian Sekolah",
      "Pendidikan Pancasila": "Pendidikan Pancasila - Ujian Sekolah",
      "Bahasa Indonesia": "Bahasa Indonesia - Ujian Sekolah",
      "Matematika": "Matematika - Ujian Sekolah",
      "Ilmu Pengetahuan Alam": "Ilmu Pengetahuan Alam - Ujian Sekolah",
      "Ilmu Pengetahuan Sosial": "Ilmu Pengetahuan Sosial - Ujian Sekolah",
      "Bahasa Inggris": "Bahasa Inggris - Ujian Sekolah",
      "Pendidikan Jasmani, Olahraga, dan Kesehatan": "Pendidikan Jasmani, Olahraga, dan Kesehatan - Ujian Sekolah",
      "Informatika": "Informatika - Ujian Sekolah",
      "Seni Budaya": "Seni Budaya - Ujian Sekolah",
      "Bimbingan dan Konseling": "Bimbingan dan Konseling - Ujian Sekolah",
      "Bahasa Jawa": "Bahasa Jawa - Ujian Sekolah",
    };

    return examFieldMap[subjectName] || null;
  }

  // Show grade edit alert
  function showGradeAlert(message, type = "info") {
    // Remove existing alerts
    const existingAlerts = document.querySelectorAll(".grade-edit-alert");
    existingAlerts.forEach((alert) => alert.remove());

    // Create new alert
    const alert = document.createElement("div");
    alert.className = `grade-edit-alert ${type}`;
    alert.innerHTML = message;

    document.body.appendChild(alert);

    // Auto remove after 4 seconds
    setTimeout(() => {
      if (alert.parentNode) {
        alert.remove();
      }
    }, 4000);
  }

  // Get original value for a field - consistent with Student_edit.html
  function getOriginalValue(fieldName) {
    return originalGradeData[fieldName] || "";
  }

  // Function to handle grade section editing
  function editGradeSection(sectionId) {
    const sessionId = getSessionId();
    const studentId = getStudentId();
    const kelas = getKelas();
    const semester = getSemester();

    if (!sessionId) {
      showGradeAlert("Session tidak valid. Silakan login kembali.", "error");
      return;
    }

    if (!studentId) {
      showGradeAlert("ID siswa tidak tersedia.", "error");
      return;
    }

    // Create edit URL with section parameter
    let editUrl = `<?= myURL() ?>?page=Students_grades&sessionId=${encodeURIComponent(
      sessionId
    )}&action=edit&nis=${encodeURIComponent(studentId)}`;

    if (kelas) {
      editUrl += `&kelas=${encodeURIComponent(kelas)}`;
    }

    if (semester) {
      editUrl += `&semester=${encodeURIComponent(semester)}`;
    }

    if (sectionId) {
      editUrl += `&section=${encodeURIComponent(sectionId)}`;
    }

    // Redirect to edit page
    window.location.href = editUrl;
  }
</script>
