<script>
  // Global variables
  let currentPage = 1;
  let itemsPerPage = 50;
  let totalItems = 0;
  let allData = [];
  let filteredData = [];
  let isAnalyzing = false;

  // Initialize page
  document.addEventListener("DOMContentLoaded", function () {
    initializePage();
    setupEventListeners();
    loadExistingData();
  });

  // Mobile sidebar toggle
  function toggleSidebar() {
    document.body.classList.toggle("sidebar-active");
  }

  function initializePage() {
    // Update datetime
    updateDateTime();

    // Load dashboard statistics
    loadDashboardStats();
  }

  function setupEventListeners() {
    // Search functionality
    document
      .getElementById("search-box")
      .addEventListener("input", function () {
        debounce(filterData, 300)();
      });

    // Filter functionality
    document
      .getElementById("filter-kategori")
      .addEventListener("change", filterData);
    document
      .getElementById("filter-status")
      .addEventListener("change", filterData);

    // Modal close on outside click
    window.addEventListener("click", function (event) {
      const modal = document.getElementById("detail-modal");
      if (event.target === modal) {
        closeModal();
      }
    });
  }

  function loadDashboardStats() {
    console.log("Loading dashboard stats...");
    google.script.run
      .withSuccessHandler(function (stats) {
        console.log("Dashboard stats received:", stats);
        document.getElementById("total-siswa").textContent = stats.total || 0;
        document.getElementById("sangat-layak").textContent =
          stats.sangatLayak || 0;
        document.getElementById("layak").textContent = stats.layak || 0;
        document.getElementById("kurang-layak").textContent =
          stats.kurangLayak || 0;
      })
      .withFailureHandler(function (error) {
        console.error("Error loading dashboard stats:", error);
      })
      .getKIPDashboardStats();
  }

  function loadExistingData() {
    console.log("Loading existing KIP analysis data...");
    showLoading();

    google.script.run
      .withSuccessHandler(function (data) {
        console.log("KIP analysis data received:", data);
        console.log("Data type:", typeof data);
        console.log("Data is array:", Array.isArray(data));
        console.log("Data length:", data ? data.length : "null/undefined");

        // Handle null, undefined, or non-array responses
        if (!data) {
          console.log("Received null/undefined data");
          allData = [];
          filteredData = [];
          showEmptyState();
          hideLoading();
          return;
        }

        if (!Array.isArray(data)) {
          console.log("Received non-array data, converting to array");
          data = [];
        }

        if (data.length > 0) {
          console.log("Found", data.length, "records");
          allData = data;
          filteredData = [...allData];
          hideLoading();
          displayData();
          showTable();
          showDataStatus(`Berhasil memuat ${data.length} data analisis KIP`, 'success');
        } else {
          console.log("No data found, showing empty state");
          allData = [];
          filteredData = [];
          hideLoading();
          showEmptyState();
          showDataStatus('Belum ada data analisis KIP. Silakan klik "Mulai Analisis" untuk memproses data siswa.', 'warning');
        }
      })
      .withFailureHandler(function (error) {
        console.error("Error loading KIP analysis data:", error);
        hideLoading();
        showError("Gagal memuat data: " + error.message);
        // Initialize empty arrays on error
        allData = [];
        filteredData = [];
        showEmptyState();
      })
      .getKIPAnalysisResults();
  }

  function startAnalysis() {
    if (isAnalyzing) return;

    if (
      !confirm(
        "Mulai analisis eligibilitas KIP untuk semua siswa? Proses ini mungkin memakan waktu beberapa menit."
      )
    ) {
      return;
    }

    isAnalyzing = true;
    const analyzeBtn = document.getElementById("btn-analyze");
    analyzeBtn.disabled = true;
    analyzeBtn.textContent = "Sedang Menganalisis...";

    showProgress();
    hideTable();
    hideEmptyState();

    // Start the analysis process
    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          let message = "Analisis selesai!";
          if (result.totalStudents && result.processedCount) {
            message = `Analisis selesai! Diproses ${result.processedCount} siswa aktif dari ${result.totalStudents} total siswa.`;
          }
          updateProgress(100, message);
          setTimeout(() => {
            hideProgress();
            loadExistingData();
            loadDashboardStats();
            resetAnalyzeButton();
            
            // Show success message with details
            if (result.totalStudents && result.processedCount) {
              showDataStatus(`Analisis KIP berhasil diselesaikan! Diproses ${result.processedCount} siswa aktif dari ${result.totalStudents} total siswa.`, 'success');
            } else {
              showDataStatus("Analisis KIP berhasil diselesaikan!", 'success');
            }
          }, 1000);
        } else {
          hideProgress();
          const errorMessage = result && result.message ? result.message : "Analisis KIP gagal diselesaikan";
          showError("Analisis gagal: " + errorMessage);
          resetAnalyzeButton();
        }
      })
      .withFailureHandler(function (error) {
        console.error("Analysis failed:", error);
        hideProgress();
        resetAnalyzeButton();
        
        let errorMessage = "Gagal melakukan analisis KIP";
        if (error && error.message) {
          errorMessage = error.message;
        } else if (typeof error === 'string') {
          errorMessage = error;
        }
        
        showError(errorMessage + ". Silakan periksa data siswa dan coba lagi.");
      })
      .startKIPAnalysis();

    // Simulate progress updates
    simulateProgress();
  }

  function simulateProgress() {
    let progress = 0;
    const interval = setInterval(() => {
      progress += Math.random() * 15;
      if (progress >= 95) {
        progress = 95;
        clearInterval(interval);
      }
      updateProgress(
        progress,
        `Memproses data siswa aktif... ${Math.round(progress)}%`
      );
    }, 1000);
  }

  function resetAnalyzeButton() {
    isAnalyzing = false;
    const analyzeBtn = document.getElementById("btn-analyze");
    analyzeBtn.disabled = false;
    analyzeBtn.textContent = "Mulai Analisis";
  }

  function refreshData() {
    console.log("Refreshing KIP analysis data...");
    showLoading();
    loadExistingData();
    loadDashboardStats();
  }

  // Fungsi untuk memuat ulang data secara paksa
  function forceRefreshData() {
    console.log("Force refreshing KIP analysis data...");
    showLoading();

    // Reset data arrays
    allData = [];
    filteredData = [];

    // Reload data
    loadExistingData();
    loadDashboardStats();
  }

  function filterData() {
    const searchTerm = document
      .getElementById("search-box")
      .value.toLowerCase();
    const kategoriFilter = document.getElementById("filter-kategori").value;
    const statusFilter = document.getElementById("filter-status").value;

    filteredData = allData.filter((item) => {
      const matchesSearch =
        item.namaSiswa.toLowerCase().includes(searchTerm) ||
        item.nis.toString().includes(searchTerm);
      const matchesKategori =
        !kategoriFilter || item.kategori === kategoriFilter;
      const matchesStatus = !statusFilter || item.status === statusFilter;

      return matchesSearch && matchesKategori && matchesStatus;
    });

    currentPage = 1;
    displayData();
  }

  function displayData() {
    console.log("Displaying data. Filtered data length:", filteredData.length);
    const startIndex = (currentPage - 1) * itemsPerPage;
    const endIndex = startIndex + itemsPerPage;
    const pageData = filteredData.slice(startIndex, endIndex);
    console.log("Page data:", pageData);

    const tbody = document.getElementById("table-body");
    if (!tbody) {
      console.error("Table body element not found!");
      return;
    }
    tbody.innerHTML = "";

    pageData.forEach((item, index) => {
      const row = createTableRow(item, startIndex + index + 1);
      tbody.appendChild(row);
    });

    updatePagination();
  }

  function createTableRow(item, ranking) {
    const row = document.createElement("tr");

    const kategoriClass = getKategoriClass(item.kategori);

    row.innerHTML = `
      <td>${ranking}</td>
      <td>${item.nis}</td>
      <td>${item.namaSiswa}</td>
      <td>${item.kelas || "-"}</td>
      <td><strong>${item.skorTotal.toFixed(1)}</strong></td>
      <td><span class="kategori-badge ${kategoriClass}">${
      item.kategori
    }</span></td>
      <td>${item.status || "Pending"}</td>
      <td>
        <button class="btn-detail" onclick="showDetail('${item.nis}')">
          Detail
        </button>
      </td>
    `;

    return row;
  }

  function getKategoriClass(kategori) {
    switch (kategori) {
      case "Sangat Layak":
        return "kategori-sangat-layak";
      case "Layak":
        return "kategori-layak";
      case "Kurang Layak":
        return "kategori-kurang-layak";
      default:
        return "";
    }
  }

  function showDetail(nis) {
    const item = allData.find((data) => data.nis === nis);
    if (!item) return;

    const modalBody = document.getElementById("modal-body");
    modalBody.innerHTML = `
      <div class="score-breakdown">
        <div class="score-item">
          <h4>Informasi Siswa</h4>
          <div class="score-details">
            <div>
              <strong>NIS:</strong> ${item.nis}<br>
              <strong>Nama:</strong> ${item.namaSiswa}<br>
              <strong>Kelas:</strong> ${item.kelas || "-"}<br>
              <strong>Tanggal Analisis:</strong> ${formatDate(
                item.tanggalAnalisis
              )}
            </div>
          </div>
        </div>
        
        <div class="score-item">
          <h4>Kriteria Penghasilan Keluarga (40%)</h4>
          <div class="score-details">
            <div>
              <strong>Penghasilan Ayah:</strong> ${
                item.penghasilanAyah || "Tidak ada data"
              }<br>
              <strong>Penghasilan Ibu:</strong> ${
                item.penghasilanIbu || "Tidak ada data"
              }<br>
              <strong>Penghasilan Wali:</strong> ${
                item.penghasilanWali || "Tidak ada data"
              }
            </div>
            <div class="score-value">${item.skorPenghasilan.toFixed(1)}</div>
          </div>
        </div>
        
        <div class="score-item">
          <h4>Kriteria Status Keluarga (30%)</h4>
          <div class="score-details">
            <div>
              <strong>Status Orang Tua:</strong> ${
                item.statusOrangTua || "Tidak ada data"
              }
            </div>
            <div class="score-value">${item.skorStatus.toFixed(1)}</div>
          </div>
        </div>
        
        <div class="score-item">
          <h4>Kriteria Jumlah Tanggungan (20%)</h4>
          <div class="score-details">
            <div>
              <strong>Jumlah Saudara Kandung:</strong> ${
                item.jumlahSaudara || "Tidak ada data"
              }
            </div>
            <div class="score-value">${item.skorTanggungan.toFixed(1)}</div>
          </div>
        </div>
        
        <div class="score-item">
          <h4>Kriteria Beasiswa (10%)</h4>
          <div class="score-details">
            <div>
              <strong>Status Beasiswa:</strong> ${
                item.statusBeasiswa || "Tidak ada data"
              }
            </div>
            <div class="score-value">${item.skorBeasiswa.toFixed(1)}</div>
          </div>
        </div>
        
        <div class="score-item" style="background: #e3f2fd; border-color: #2196f3;">
          <h4>Skor Total</h4>
          <div class="score-details">
            <div>
              <strong>Kategori:</strong> <span class="kategori-badge ${getKategoriClass(
                item.kategori
              )}">${item.kategori}</span>
            </div>
            <div class="score-value" style="font-size: 24px; color: #2196f3;">${item.skorTotal.toFixed(
              1
            )}</div>
          </div>
        </div>
        
        ${
          item.catatan
            ? `
        <div class="score-item">
          <h4>Catatan Admin</h4>
          <div>${item.catatan}</div>
        </div>
        `
            : ""
        }
      </div>
    `;

    document.getElementById("detail-modal").style.display = "block";
  }

  function closeModal() {
    document.getElementById("detail-modal").style.display = "none";
  }

  function updatePagination() {
    totalItems = filteredData.length;
    const totalPages = Math.ceil(totalItems / itemsPerPage);

    document.getElementById(
      "page-info"
    ).textContent = `Halaman ${currentPage} dari ${totalPages}`;
    document.getElementById("prev-btn").disabled = currentPage <= 1;
    document.getElementById("next-btn").disabled = currentPage >= totalPages;

    if (totalItems > 0) {
      document.getElementById("pagination").style.display = "flex";
    } else {
      document.getElementById("pagination").style.display = "none";
    }
  }

  function changePage(direction) {
    const totalPages = Math.ceil(filteredData.length / itemsPerPage);
    const newPage = currentPage + direction;

    if (newPage >= 1 && newPage <= totalPages) {
      currentPage = newPage;
      displayData();
    }
  }

  function exportData() {
    if (filteredData.length === 0) {
      alert("Tidak ada data untuk diekspor");
      return;
    }

    const exportBtn = document.querySelector(".btn-export");
    exportBtn.disabled = true;
    exportBtn.textContent = "Mengekspor...";

    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          // Create download link
          const link = document.createElement("a");
          link.href = result.url;
          link.download = result.filename;
          link.click();
        } else {
          alert("Gagal mengekspor data: " + result.message);
        }

        exportBtn.disabled = false;
        exportBtn.textContent = "Export Excel";
      })
      .withFailureHandler(function (error) {
        alert("Error saat mengekspor: " + error.message);
        exportBtn.disabled = false;
        exportBtn.textContent = "Export Excel";
      })
      .exportKIPAnalysis(filteredData);
  }

  // Utility functions
  function showLoading() {
    document.getElementById("loading-state").style.display = "block";
    document.getElementById("empty-state").style.display = "none";
    document.getElementById("table-wrapper").style.display = "none";
  }

  function hideLoading() {
    document.getElementById("loading-state").style.display = "none";
  }

  function showEmptyState() {
    const emptyStateElement = document.getElementById("empty-state");
    if (emptyStateElement) {
      emptyStateElement.innerHTML = `
        <h3>Belum Ada Data Analisis KIP</h3>
        <p>Klik "Mulai Analisis" untuk memproses data siswa dan membuat analisis eligibilitas KIP</p>
        <p style="font-size: 12px; color: #666; margin-top: 10px;">💡 Tip: Pastikan data siswa sudah tersedia di sheet "DATA SISWA" sebelum memulai analisis</p>
      `;
      emptyStateElement.style.display = "block";
    }
    document.getElementById("table-wrapper").style.display = "none";
    document.getElementById("pagination").style.display = "none";
  }

  function hideEmptyState() {
    document.getElementById("empty-state").style.display = "none";
  }

  function showTable() {
    document.getElementById("table-wrapper").style.display = "block";
  }

  function hideTable() {
    document.getElementById("table-wrapper").style.display = "none";
    document.getElementById("pagination").style.display = "none";
  }

  function showProgress() {
    document.getElementById("progress-container").style.display = "block";
  }

  function hideProgress() {
    document.getElementById("progress-container").style.display = "none";
  }

  function updateProgress(percentage, text) {
    document.getElementById("progress-fill").style.width = percentage + "%";
    document.getElementById("progress-text").textContent = text;
  }

  function showError(message) {
    const errorDiv = document.createElement('div');
    errorDiv.className = 'error-message';
    errorDiv.innerHTML = `
      <div style="background: #ffebee; border: 1px solid #f44336; color: #c62828; padding: 12px; border-radius: 4px; margin: 10px 0;">
        <strong>❌ Error:</strong> ${message}
        <br><small style="margin-top: 8px; display: block;">💡 Coba refresh halaman atau klik "Refresh Data" untuk memuat ulang</small>
      </div>
    `;
    
    const container = document.querySelector('.kip-table') || document.querySelector('.main-content') || document.body;
    container.insertBefore(errorDiv, container.firstChild);
    
    // Remove error message after 8 seconds
    setTimeout(() => {
      if (errorDiv.parentNode) {
        errorDiv.parentNode.removeChild(errorDiv);
      }
    }, 8000);
  }

  function showDataStatus(message, type = 'info') {
    const statusDiv = document.createElement('div');
    statusDiv.className = 'status-message';
    
    let bgColor, borderColor, textColor;
    switch(type) {
      case 'warning':
        bgColor = '#fff3cd';
        borderColor = '#ffc107';
        textColor = '#856404';
        break;
      case 'success':
        bgColor = '#d4edda';
        borderColor = '#28a745';
        textColor = '#155724';
        break;
      default:
        bgColor = '#d1ecf1';
        borderColor = '#17a2b8';
        textColor = '#0c5460';
    }
    
    statusDiv.innerHTML = `
      <div style="background: ${bgColor}; border: 1px solid ${borderColor}; color: ${textColor}; padding: 12px; border-radius: 4px; margin: 10px 0;">
        <strong>ℹ️ Info:</strong> ${message}
      </div>
    `;
    
    const container = document.querySelector('.kip-table') || document.querySelector('.main-content') || document.body;
    container.insertBefore(statusDiv, container.firstChild);
    
    // Remove status message after 5 seconds
    setTimeout(() => {
      if (statusDiv.parentNode) {
        statusDiv.parentNode.removeChild(statusDiv);
      }
    }, 5000);
  }

  function showSuccess(message) {
    // Create a success notification
    const notification = document.createElement("div");
    notification.style.cssText = `
      position: fixed;
      top: 20px;
      right: 20px;
      background: linear-gradient(135deg, #4CAF50, #45a049);
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
      z-index: 10000;
      font-size: 14px;
      font-weight: 500;
      max-width: 400px;
      animation: slideInRight 0.3s ease;
    `;
    notification.textContent = message;

    // Add animation keyframes
    if (!document.getElementById("notification-styles")) {
      const style = document.createElement("style");
      style.id = "notification-styles";
      style.textContent = `
        @keyframes slideInRight {
          from { transform: translateX(100%); opacity: 0; }
          to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
          from { transform: translateX(0); opacity: 1; }
          to { transform: translateX(100%); opacity: 0; }
        }
      `;
      document.head.appendChild(style);
    }

    document.body.appendChild(notification);

    // Auto remove after 5 seconds
    setTimeout(() => {
      notification.style.animation = "slideOutRight 0.3s ease";
      setTimeout(() => {
        if (notification.parentNode) {
          notification.parentNode.removeChild(notification);
        }
      }, 300);
    }, 5000);
  }

  function formatDate(dateString) {
    if (!dateString) return "-";
    const date = new Date(dateString);
    return date.toLocaleDateString("id-ID", {
      year: "numeric",
      month: "long",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit",
    });
  }

  function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
      const later = () => {
        clearTimeout(timeout);
        func(...args);
      };
      clearTimeout(timeout);
      timeout = setTimeout(later, wait);
    };
  }

  function updateDateTime() {
    const now = new Date();
    const options = {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit",
      timeZone: "Asia/Jakarta",
    };

    const dateTimeString = now.toLocaleDateString("id-ID", options);

    // Update navbar datetime if exists
    const dateTimeElement = document.querySelector(".navbar-datetime");
    if (dateTimeElement) {
      dateTimeElement.textContent = dateTimeString;
    }

    // Update page date if exists
    const pageDateElement = document.querySelector(".page-date");
    if (pageDateElement) {
      pageDateElement.textContent = dateTimeString;
    }
  }

  // Update datetime every minute
  setInterval(updateDateTime, 60000);
</script>
