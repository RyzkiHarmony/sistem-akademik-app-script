<script>
  // Global variables
  let currentPage = 1;
  let itemsPerPage = 50;
  let totalItems = 0;
  let allData = [];
  let filteredData = [];
  let isAnalyzing = false;
  let sortColumn = "";
  let sortDirection = "asc";

  // Initialize page
  document.addEventListener("DOMContentLoaded", function () {
    initializePage();
    setupEventListeners();
    loadExistingData();
  });

  // Mobile sidebar toggle
  function toggleSidebar() {
    document.body.classList.toggle("sidebar-active");
  }

  function initializePage() {
    // Update datetime
    updateDateTime();

    // Load dashboard statistics
    loadDashboardStats();
  }

  function setupEventListeners() {
    // Search functionality
    document
      .getElementById("search-box")
      .addEventListener("input", function () {
        debounce(filterData, 300)();
      });

    // Filter functionality
    document
      .getElementById("filter-kategori")
      .addEventListener("change", filterData);
    document
      .getElementById("filter-status")
      .addEventListener("change", filterData);

    // Modal close on outside click
    window.addEventListener("click", function (event) {
      const modal = document.getElementById("detail-modal");
      if (event.target === modal) {
        closeModal();
      }
    });
  }

  function loadDashboardStats() {
    console.log("Loading dashboard stats...");
    google.script.run
      .withSuccessHandler(function (stats) {
        console.log("Dashboard stats received:", stats);
        document.getElementById("total-siswa").textContent = stats.total || 0;
        document.getElementById("sangat-layak").textContent =
          stats.sangatLayak || 0;
        document.getElementById("layak").textContent = stats.layak || 0;
        document.getElementById("kurang-layak").textContent =
          stats.kurangLayak || 0;
      })
      .withFailureHandler(function (error) {
        console.error("Error loading dashboard stats:", error);
      })
      .getKIPDashboardStats();
  }

  function loadExistingData() {
    console.log("=== START LOAD EXISTING DATA DEBUG ===");
    console.log("Loading existing KIP analysis data...");

    showLoading();

    // First check if KIP analysis data exists
    google.script.run
      .withSuccessHandler(function (hasData) {
        console.log("KIP analysis data exists:", hasData);

        if (!hasData) {
          console.log(
            "No KIP analysis data found - showing empty state with analysis option"
          );
          hideLoading();
          showEmptyStateWithAnalysisOption();
          hideTable();
          return;
        }

        // If data exists, fetch it
        google.script.run
          .withSuccessHandler(function (data) {
            console.log("=== KIP DATA RECEIVED DEBUG ===");
            console.log("Raw data received:", data);
            console.log("Data type:", typeof data);
            console.log("Data is array:", Array.isArray(data));
            console.log("Data is null:", data === null);
            console.log("Data is undefined:", data === undefined);
            console.log("Data length:", data ? data.length : "null/undefined");

            if (data && data.length > 0) {
              console.log("First item:", data[0]);
              console.log("First item type:", typeof data[0]);
            }

            try {
              // Validasi hasil dari server
              if (data === null || data === undefined) {
                throw new Error("Data null atau undefined dari server");
              }

              if (typeof data !== "object") {
                throw new Error(
                  "Data bukan object dari server, type: " + typeof data
                );
              }

              // Konversi ke array jika bukan array
              if (!Array.isArray(data)) {
                console.log("Data is not an array, converting...");
                console.log("Data object keys:", Object.keys(data));
                data = [];
              }

              // Simpan data ke variabel global
              allData = data;
              filteredData = [...allData];

              console.log("allData length after assignment:", allData.length);
              console.log(
                "filteredData length after assignment:",
                filteredData.length
              );

              // Sembunyikan loading
              hideLoading();

              if (data.length > 0) {
                console.log("Found", data.length, "records");

                // Sembunyikan empty state
                hideEmptyState();

                // Render tabel
                renderKIPTable(data);

                // Tampilkan tabel
                showTable();

                // Tampilkan pesan sukses
                showDataStatus(
                  `Berhasil memuat ${data.length} data analisis KIP`,
                  "success"
                );
              } else {
                console.log("No data found, showing empty state");
                showEmptyStateWithAnalysisOption();
                hideTable();
                showDataStatus(
                  'Belum ada data analisis KIP. Silakan klik "Mulai Analisis" untuk memproses data siswa.',
                  "warning"
                );
              }
            } catch (error) {
              console.error("Error processing KIP data:", error);
              hideLoading();
              showError("Gagal memproses data analisis KIP: " + error.message);
              allData = [];
              filteredData = [];
              showEmptyStateWithAnalysisOption();
            }

            console.log("=== END LOAD EXISTING DATA DEBUG ===");
          })
          .withFailureHandler(function (error) {
            console.error("Error loading KIP analysis data:", error);
            hideLoading();
            showError("Gagal memuat data analisis KIP: " + error);
            allData = [];
            filteredData = [];
            showEmptyStateWithAnalysisOption();
          })
          .getKIPAnalysisResults();
      })
      .withFailureHandler(function (error) {
        console.error("Error checking KIP data existence:", error);
        hideLoading();
        showError("Gagal memeriksa data analisis KIP: " + error);
        allData = [];
        filteredData = [];
        showEmptyStateWithAnalysisOption();
      })
      .hasKIPAnalysisData();
  }

  function startAnalysis() {
    if (isAnalyzing) {
      showError("Analisis sedang berjalan. Mohon tunggu...");
      return;
    }

    if (
      !confirm(
        "Mulai analisis KIP untuk semua siswa? Proses ini akan:\n\n• Menganalisis data ekonomi keluarga\n• Menghitung skor kelayakan KIP\n• Membuat ranking siswa\n\nProses ini mungkin memakan waktu beberapa menit. Lanjutkan?"
      )
    ) {
      return;
    }

    isAnalyzing = true;
    showLoading();
    hideEmptyState();
    showDataStatus(
      "🔄 Memulai analisis KIP... Mohon tunggu, proses ini mungkin memakan waktu beberapa menit.",
      "info"
    );

    // Show progress indicator
    const progressDiv = document.createElement("div");
    progressDiv.id = "analysis-progress";
    progressDiv.innerHTML = `
      <div style="text-align: center; padding: 20px; background: #f8f9fa; border-radius: 8px; margin: 20px 0;">
        <div style="font-size: 18px; margin-bottom: 10px;">📊 Sedang Menganalisis Data Siswa</div>
        <div style="font-size: 14px; color: #666;">Proses ini meliputi:</div>
        <ul style="text-align: left; display: inline-block; margin: 10px 0;">
          <li>✅ Mengambil data siswa aktif</li>
          <li>🔄 Menghitung skor ekonomi keluarga</li>
          <li>⏳ Membuat ranking kelayakan KIP</li>
          <li>⏳ Menyimpan hasil analisis</li>
        </ul>
        <div style="font-size: 12px; color: #888;">Harap jangan menutup halaman ini...</div>
      </div>
    `;

    const container = document.querySelector(".main-content");
    if (container) {
      container.insertBefore(progressDiv, container.firstChild);
    }

    google.script.run
      .withSuccessHandler(function (result) {
        isAnalyzing = false;
        hideLoading();

        // Remove progress indicator
        const progressElement = document.getElementById("analysis-progress");
        if (progressElement) {
          progressElement.remove();
        }

        if (result && result.success) {
          showDataStatus(`✅ ${result.message}`, "success");
          console.log("Analysis completed successfully:", result);

          // Reload data after successful analysis
          setTimeout(() => {
            loadExistingData();
          }, 1500);
        } else {
          const errorMessage = result
            ? result.message
            : "Gagal melakukan analisis KIP";
          showError(`❌ ${errorMessage}`);
          showEmptyStateWithAnalysisOption();
        }
      })
      .withFailureHandler(function (error) {
        isAnalyzing = false;
        hideLoading();

        // Remove progress indicator
        const progressElement = document.getElementById("analysis-progress");
        if (progressElement) {
          progressElement.remove();
        }

        console.error("Analysis failed:", error);
        showError(`❌ Gagal melakukan analisis KIP: ${error}`);
        showEmptyStateWithAnalysisOption();
      })
      .startKIPAnalysis();
  }

  // Progress functions removed - using new loading system

  function refreshData() {
    console.log("Refreshing KIP analysis data...");
    showLoading();
    loadExistingData();
    loadDashboardStats();
  }

  // Fungsi untuk memuat ulang data secara paksa
  function forceRefreshData() {
    console.log("Force refreshing KIP analysis data...");
    showLoading();

    // Reset data arrays
    allData = [];
    filteredData = [];

    // Reload data
    loadExistingData();
    loadDashboardStats();
  }

  function filterData() {
    const searchTerm = document
      .getElementById("search-box")
      .value.toLowerCase();
    const kategoriFilter = document.getElementById("filter-kategori").value;
    const statusFilter = document.getElementById("filter-status").value;

    filteredData = allData.filter((item) => {
      const matchesSearch =
        item.namaSiswa.toLowerCase().includes(searchTerm) ||
        item.nis.toString().includes(searchTerm);
      const matchesKategori =
        !kategoriFilter || item.kategori === kategoriFilter;
      const matchesStatus = !statusFilter || item.status === statusFilter;

      return matchesSearch && matchesKategori && matchesStatus;
    });

    currentPage = 1;
    if (filteredData && filteredData.length > 0) {
      hideEmptyState();
      renderKIPTable(filteredData);
      showTable();
    } else {
      // Show different message for filtered results vs no data at all
      if (allData && allData.length > 0) {
        showFilteredEmptyState();
      } else {
        showEmptyStateWithAnalysisOption();
      }
      hideTable();
    }
  }

  function renderKIPTable(data) {
    console.log("=== RENDER KIP TABLE DEBUG ===");
    console.log("Rendering KIP table with data length:", data.length);

    const tbody = document.getElementById("table-body");
    if (!tbody) {
      console.error("Table body element not found!");
      return;
    }

    // Clear existing content
    tbody.innerHTML = "";

    // Calculate pagination
    const startIndex = (currentPage - 1) * itemsPerPage;
    const endIndex = startIndex + itemsPerPage;
    const pageData = data.slice(startIndex, endIndex);

    console.log("Rendering", pageData.length, "items for page", currentPage);

    // Create table rows
    pageData.forEach((item, index) => {
      const row = createKIPTableRow(item, startIndex + index + 1);
      tbody.appendChild(row);
    });

    // Update pagination
    updateKIPPagination(data.length);

    console.log("=== END RENDER KIP TABLE DEBUG ===");
  }

  function createKIPTableRow(item, ranking) {
    const row = document.createElement("tr");
    const kategoriClass = getKategoriClass(item.kategori);

    // Ensure skorTotal is a number
    const skorTotal =
      typeof item.skorTotal === "number"
        ? item.skorTotal
        : parseFloat(item.skorTotal) || 0;

    row.innerHTML = `
      <td>${ranking}</td>
      <td>${item.nis || "-"}</td>
      <td>${item.namaSiswa || "-"}</td>
      <td><strong>${skorTotal.toFixed(1)}</strong></td>
      <td><span class="kategori-badge ${kategoriClass}">${
      item.kategori || "-"
    }</span></td>
      <td>${item.status || "Pending"}</td>
      <td>
        <button class="btn-detail" onclick="showDetail('${item.nis}')">
          Detail
        </button>
      </td>
    `;

    return row;
  }

  function updateKIPPagination(totalItems) {
    const totalPages = Math.ceil(totalItems / itemsPerPage);

    const pageInfo = document.getElementById("page-info");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const pagination = document.getElementById("pagination");

    if (pageInfo) {
      pageInfo.textContent = `Halaman ${currentPage} dari ${totalPages}`;
    }

    if (prevBtn) {
      prevBtn.disabled = currentPage <= 1;
    }

    if (nextBtn) {
      nextBtn.disabled = currentPage >= totalPages;
    }

    if (pagination) {
      pagination.style.display = totalItems > 0 ? "flex" : "none";
    }
  }

  function sortData(column) {
    if (sortColumn === column) {
      sortDirection = sortDirection === "asc" ? "desc" : "asc";
    } else {
      sortColumn = column;
      sortDirection = "asc";
    }

    filteredData.sort((a, b) => {
      let aValue = a[column];
      let bValue = b[column];

      if (column === "skorTotal") {
        aValue = parseFloat(aValue) || 0;
        bValue = parseFloat(bValue) || 0;
      }

      if (aValue < bValue) return sortDirection === "asc" ? -1 : 1;
      if (aValue > bValue) return sortDirection === "asc" ? 1 : -1;
      return 0;
    });

    renderKIPTable(filteredData);
    updateSortIcons();
  }

  function updateSortIcons() {
    // Reset all sort icons
    document.querySelectorAll(".sort-icon").forEach((icon) => {
      icon.textContent = "↕️";
    });

    // Update the active sort icon
    const activeIcon = document.querySelector(
      `[onclick="sortData('${sortColumn}')"] .sort-icon`
    );
    if (activeIcon) {
      activeIcon.textContent = sortDirection === "asc" ? "↑" : "↓";
    }
  }

  function displayData() {
    // Fungsi ini sekarang digantikan oleh renderKIPTable
    // Tetap ada untuk kompatibilitas dengan kode lama
    if (filteredData && filteredData.length > 0) {
      renderKIPTable(filteredData);
      showTable();
    } else {
      showEmptyState();
      hideTable();
    }
  }

  // Fungsi createTableRow digantikan dengan createKIPTableRow

  function getKategoriClass(kategori) {
    switch (kategori) {
      case "Sangat Layak":
        return "kategori-sangat-layak";
      case "Layak":
        return "kategori-layak";
      case "Kurang Layak":
        return "kategori-kurang-layak";
      default:
        return "";
    }
  }

  function showDetail(nis) {
    const item = allData.find((data) => data.nis === nis);
    if (!item) return;

    const modalBody = document.getElementById("modal-body");
    modalBody.innerHTML = `
      <div class="score-breakdown">
        <div class="score-item">
          <h4>Informasi Siswa</h4>
          <div class="score-details">
            <div>
              <strong>NIS:</strong> ${item.nis}<br>
              <strong>Nama:</strong> ${item.namaSiswa}<br>
              <strong>Tanggal Analisis:</strong> ${formatDate(
                item.tanggalAnalisis
              )}
            </div>
          </div>
        </div>
        
        <div class="score-item">
          <h4>Kriteria Penghasilan Keluarga (40%)</h4>
          <div class="score-details">
            <div>
              <strong>Penghasilan Ayah:</strong> ${
                item.penghasilanAyah || "Tidak ada data"
              }<br>
              <strong>Penghasilan Ibu:</strong> ${
                item.penghasilanIbu || "Tidak ada data"
              }<br>
              <strong>Penghasilan Wali:</strong> ${
                item.penghasilanWali || "Tidak ada data"
              }
            </div>
            <div class="score-value">${item.skorPenghasilan.toFixed(1)}</div>
          </div>
        </div>
        
        <div class="score-item">
          <h4>Kriteria Status Keluarga (30%)</h4>
          <div class="score-details">
            <div>
              <strong>Status Orang Tua:</strong> ${
                item.statusOrangTua || "Tidak ada data"
              }
            </div>
            <div class="score-value">${item.skorStatus.toFixed(1)}</div>
          </div>
        </div>
        
        <div class="score-item">
          <h4>Kriteria Jumlah Tanggungan (20%)</h4>
          <div class="score-details">
            <div>
              <strong>Jumlah Saudara Kandung:</strong> ${
                item.jumlahSaudara || "Tidak ada data"
              }
            </div>
            <div class="score-value">${item.skorTanggungan.toFixed(1)}</div>
          </div>
        </div>
        
        <div class="score-item">
          <h4>Kriteria Beasiswa (10%)</h4>
          <div class="score-details">
            <div>
              <strong>Status Beasiswa:</strong> ${
                item.statusBeasiswa || "Tidak ada data"
              }
            </div>
            <div class="score-value">${item.skorBeasiswa.toFixed(1)}</div>
          </div>
        </div>
        
        <div class="score-item" style="background: #e3f2fd; border-color: #2196f3;">
          <h4>Skor Total</h4>
          <div class="score-details">
            <div>
              <strong>Kategori:</strong> <span class="kategori-badge ${getKategoriClass(
                item.kategori
              )}">${item.kategori}</span>
            </div>
            <div class="score-value" style="font-size: 24px; color: #2196f3;">${item.skorTotal.toFixed(
              1
            )}</div>
          </div>
        </div>
        
        ${
          item.catatan
            ? `
        <div class="score-item">
          <h4>Catatan Admin</h4>
          <div>${item.catatan}</div>
        </div>
        `
            : ""
        }
      </div>
    `;

    const modal = document.getElementById("detail-modal");
    modal.classList.add("fullscreen");
    modal.style.display = "block";
  }

  function closeModal() {
    const modal = document.getElementById("detail-modal");
    modal.classList.remove("fullscreen");
    modal.style.display = "none";
  }

  // Fungsi updatePagination digantikan dengan updateKIPPagination

  function changePage(direction) {
    const totalPages = Math.ceil(filteredData.length / itemsPerPage);
    const newPage = currentPage + direction;

    if (newPage >= 1 && newPage <= totalPages) {
      currentPage = newPage;
      renderKIPTable(filteredData);
    }
  }

  function goToPage(page) {
    const totalPages = Math.ceil(filteredData.length / itemsPerPage);
    if (page >= 1 && page <= totalPages) {
      currentPage = page;
      renderKIPTable(filteredData);
    }
  }

  function exportData() {
    if (filteredData.length === 0) {
      alert("Tidak ada data untuk diekspor");
      return;
    }

    const exportBtn = document.querySelector(".btn-export");
    exportBtn.disabled = true;
    exportBtn.textContent = "Mengekspor...";

    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          // Buka URL download di tab baru
          window.open(result.url, "_blank");
          showDataStatus(
            `File ${result.filename} berhasil diekspor ke Excel!`,
            "success"
          );
        } else {
          alert("Gagal mengekspor data: " + result.message);
        }

        exportBtn.disabled = false;
        exportBtn.textContent = "Export Excel";
      })
      .withFailureHandler(function (error) {
        alert("Error saat mengekspor: " + error.message);
        exportBtn.disabled = false;
        exportBtn.textContent = "Export Excel";
      })
      .exportKIPAnalysis(filteredData);
  }

  // Utility functions
  function showLoading() {
    document.getElementById("loading-state").style.display = "block";
    document.getElementById("empty-state").style.display = "none";
    document.getElementById("table-wrapper").style.display = "none";
  }

  function hideLoading() {
    document.getElementById("loading-state").style.display = "none";
  }

  function showEmptyState() {
    const emptyStateElement = document.getElementById("empty-state");
    if (emptyStateElement) {
      emptyStateElement.innerHTML = `
        <h3>Belum Ada Data Analisis KIP</h3>
        <p>Klik "Mulai Analisis" untuk memproses data siswa dan membuat analisis eligibilitas KIP</p>
        <p style="font-size: 12px; color: #666; margin-top: 10px;">💡 Tip: Pastikan data siswa sudah tersedia di sheet "DATA SISWA" sebelum memulai analisis</p>
      `;
      emptyStateElement.style.display = "block";
    }
    document.getElementById("table-wrapper").style.display = "none";
    document.getElementById("pagination").style.display = "none";
  }

  function showEmptyStateWithAnalysisOption() {
    const emptyStateElement = document.getElementById("empty-state");
    if (emptyStateElement) {
      emptyStateElement.innerHTML = `
        <h3>Belum Ada Data Analisis KIP</h3>
        <p>Klik "Mulai Analisis" untuk memproses data siswa dan membuat analisis eligibilitas KIP</p>
        <p style="font-size: 12px; color: #666; margin-top: 10px;">💡 Tip: Pastikan data siswa sudah tersedia di sheet "DATA SISWA" sebelum memulai analisis</p>
        <div style="margin-top: 20px;">
          <button onclick="startAnalysis()" class="btn-primary" style="padding: 12px 24px; font-size: 16px;">
            🚀 Mulai Analisis KIP
          </button>
        </div>
      `;
      emptyStateElement.style.display = "block";
    }
    document.getElementById("table-wrapper").style.display = "none";
    document.getElementById("pagination").style.display = "none";
  }

  function showFilteredEmptyState() {
    const emptyStateElement = document.getElementById("empty-state");
    if (emptyStateElement) {
      emptyStateElement.innerHTML = `
        <h3>Tidak Ada Data yang Sesuai</h3>
        <p>Tidak ditemukan data yang sesuai dengan filter pencarian Anda</p>
        <p style="font-size: 12px; color: #666; margin-top: 10px;">💡 Tip: Coba ubah kata kunci pencarian atau filter kategori/status</p>
      `;
      emptyStateElement.style.display = "block";
    }
    document.getElementById("table-wrapper").style.display = "none";
    document.getElementById("pagination").style.display = "none";
  }

  function hideEmptyState() {
    document.getElementById("empty-state").style.display = "none";
  }

  function showTable() {
    console.log("showTable() called");
    const tableWrapper = document.getElementById("table-wrapper");
    const pagination = document.getElementById("pagination");

    console.log("table-wrapper element:", tableWrapper);
    console.log("pagination element:", pagination);

    if (tableWrapper) {
      console.log("Setting table-wrapper display to block");
      tableWrapper.style.display = "block";
      console.log(
        "table-wrapper display after setting:",
        tableWrapper.style.display
      );
    } else {
      console.error("table-wrapper element not found!");
    }

    if (pagination) {
      console.log("Setting pagination display to flex");
      pagination.style.display = "flex";
      console.log(
        "pagination display after setting:",
        pagination.style.display
      );
    } else {
      console.error("pagination element not found!");
    }
  }

  function hideTable() {
    document.getElementById("table-wrapper").style.display = "none";
    document.getElementById("pagination").style.display = "none";
  }

  // Old progress functions removed - using new loading indicators

  function showError(message) {
    const errorDiv = document.createElement("div");
    errorDiv.className = "error-message";
    errorDiv.innerHTML = `
      <div style="background: #ffebee; border: 1px solid #f44336; color: #c62828; padding: 12px; border-radius: 4px; margin: 10px 0;">
        <strong>❌ Error:</strong> ${message}
        <br><small style="margin-top: 8px; display: block;">💡 Coba refresh halaman atau klik "Refresh Data" untuk memuat ulang</small>
      </div>
    `;

    const container =
      document.querySelector(".kip-table") ||
      document.querySelector(".main-content") ||
      document.body;
    container.insertBefore(errorDiv, container.firstChild);

    // Remove error message after 8 seconds
    setTimeout(() => {
      if (errorDiv.parentNode) {
        errorDiv.parentNode.removeChild(errorDiv);
      }
    }, 8000);
  }

  function showDataStatus(message, type = "info") {
    const statusDiv = document.createElement("div");
    statusDiv.className = "status-message";

    let bgColor, borderColor, textColor;
    switch (type) {
      case "warning":
        bgColor = "#fff3cd";
        borderColor = "#ffc107";
        textColor = "#856404";
        break;
      case "success":
        bgColor = "#d4edda";
        borderColor = "#28a745";
        textColor = "#155724";
        break;
      default:
        bgColor = "#d1ecf1";
        borderColor = "#17a2b8";
        textColor = "#0c5460";
    }

    statusDiv.innerHTML = `
      <div style="background: ${bgColor}; border: 1px solid ${borderColor}; color: ${textColor}; padding: 12px; border-radius: 4px; margin: 10px 0;">
        <strong>ℹ️ Info:</strong> ${message}
      </div>
    `;

    const container =
      document.querySelector(".kip-table") ||
      document.querySelector(".main-content") ||
      document.body;
    container.insertBefore(statusDiv, container.firstChild);

    // Remove status message after 5 seconds
    setTimeout(() => {
      if (statusDiv.parentNode) {
        statusDiv.parentNode.removeChild(statusDiv);
      }
    }, 5000);
  }

  function showSuccess(message) {
    // Create a success notification
    const notification = document.createElement("div");
    notification.style.cssText = `
      position: fixed;
      top: 20px;
      right: 20px;
      background: linear-gradient(135deg, #4CAF50, #45a049);
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
      z-index: 10000;
      font-size: 14px;
      font-weight: 500;
      max-width: 400px;
      animation: slideInRight 0.3s ease;
    `;
    notification.textContent = message;

    // Add animation keyframes
    if (!document.getElementById("notification-styles")) {
      const style = document.createElement("style");
      style.id = "notification-styles";
      style.textContent = `
        @keyframes slideInRight {
          from { transform: translateX(100%); opacity: 0; }
          to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
          from { transform: translateX(0); opacity: 1; }
          to { transform: translateX(100%); opacity: 0; }
        }
      `;
      document.head.appendChild(style);
    }

    document.body.appendChild(notification);

    // Auto remove after 5 seconds
    setTimeout(() => {
      notification.style.animation = "slideOutRight 0.3s ease";
      setTimeout(() => {
        if (notification.parentNode) {
          notification.parentNode.removeChild(notification);
        }
      }, 300);
    }, 5000);
  }

  function formatDate(dateString) {
    if (!dateString) return "-";
    const date = new Date(dateString);
    return date.toLocaleDateString("id-ID", {
      year: "numeric",
      month: "long",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit",
    });
  }

  function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
      const later = () => {
        clearTimeout(timeout);
        func(...args);
      };
      clearTimeout(timeout);
      timeout = setTimeout(later, wait);
    };
  }

  function updateDateTime() {
    const now = new Date();
    const options = {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric",
      timeZone: "Asia/Jakarta",
    };

    const dateTimeString = now.toLocaleDateString("id-ID", options);

    // Update navbar datetime if exists
    const dateTimeElement = document.querySelector(".navbar-datetime");
    if (dateTimeElement) {
      dateTimeElement.textContent = dateTimeString;
    }

    // Update page date if exists
    const pageDateElement = document.querySelector(".page-date");
    if (pageDateElement) {
      pageDateElement.textContent = dateTimeString;
    }
  }

  // Update datetime every minute
  setInterval(updateDateTime, 60000);
</script>
