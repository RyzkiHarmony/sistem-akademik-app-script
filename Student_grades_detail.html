          </button>
          <h1 class="page-title">Detail Nilai Siswa</h1>
          <button
            class="refresh-btn"
            id="refresh-detail-btn"
            onclick="refreshStudentDetail()"
            title="Refresh data dari server"
          >
            <i class="fas fa-sync-alt"></i> Refresh
          </button>
        </div>
        <div class="page-date" id="current-date"></div>
      </div>

      <!-- Hidden Session ID -->
      <input type="hidden" id="sessionId" value="<?= sessionId ?>" />
      <input
        type="hidden"
        id="studentId"
        value="<?= typeof nis !== 'undefined' ? nis : '' ?>"
      />
      <input
        type="hidden"
        id="kelas"
        value="<?= typeof kelas !== 'undefined' ? kelas : '' ?>"
      />
      <input

        id="semester"
        value="<?= typeof semester !== 'undefined' ? semester : '' ?>"
      />

      <!-- Student Info Section -->
      <div class="student-info-section" id="student-info-section">

          <i class="fas fa-spinner fa-spin"></i> Memuat data siswa...
        </div>
      </div>

      <!-- Grades Section -->
      <div class="grades-section" id="grades-section" style="display: none">
        <!-- Academic Grades -->
        <div
          class="grades-card"
          id="academic-grades-card"
          style="display: none"
        >
          <div class="grades-card-header">
            <h3><i class="fas fa-book"></i> Nilai Akademik</h3>
            <div class="semester-info" id="academic-semester-info"></div>

          <div class="grades-card-body">
            <div class="grades-grid" id="academic-grades-grid"></div>
            <div class="grades-summary" id="academic-grades-summary"></div>
          </div>
        </div>

        <div class="grades-card" id="exam-grades-card" style="display: none">
          <div class="grades-card-header">
            <h3><i class="fas fa-clipboard-check"></i> Nilai Ujian Sekolah</h3>
            <div class="semester-info" id="exam-semester-info"></div>
          </div>
          <div class="grades-card-body">
            <div class="grades-grid" id="exam-grades-grid"></div>
            <div class="grades-summary" id="exam-grades-summary"></div>
          </div>
        </div>

        <!-- No Data Message -->
        <div class="no-data-message" id="no-data-message" style="display: none">
          <div class="no-data-content">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>Tidak Ada Data Nilai</h3>
            <p>Data nilai untuk siswa ini belum tersedia atau belum diinput.</p>
            <button class="btn-primary" onclick="goBack()">
              <i class="fas fa-arrow-left"></i> Kembali
            </button>
          </div>
        </div>
      </div>

      <!-- Error Section -->
      <div class="error-section" id="error-section" style="display: none">
        <div class="error-content">
          <i class="fas fa-exclamation-circle"></i>
          <h3>Terjadi Kesalahan</h3>
          <p id="error-message">Gagal memuat data siswa.</p>
          <div class="error-actions">
            <button class="btn-secondary" onclick="loadStudentData()">
              <i class="fas fa-redo"></i> Coba Lagi
            </button>
            <button class="btn-primary" onclick="goBack()">
