<script>
  let searchResults = [];
  let isSearching = false;

  // Real-time search variables
  let searchTimeout = null;
  let lastSearchQuery = "";
  let allStudentsData = []; // Cache untuk data siswa

  // Pagination variables
  let currentPage = 1;
  let studentsPerPage = 5;
  let filteredStudentsData = []; // Data yang sudah difilter

  // Sorting variables
  let currentSortField = "";
  let currentSortDirection = "asc";

  // Enhanced cache management
  const GRADES_CACHE_EXPIRY_TIME = 10 * 60 * 1000; // 10 minutes
  const GRADES_CACHE_KEY = "students_grades_cache";
  const GRADES_CACHE_VERSION = "1.0";
  let cacheTimestamp = null;

  // Cache management functions
  function isGradesCacheValid() {
    if (!cacheTimestamp || allStudentsData.length === 0) {
      return false;
    }
    const now = Date.now();
    return now - cacheTimestamp < GRADES_CACHE_EXPIRY_TIME;
  }

  function invalidateGradesCache() {
    allStudentsData = [];
    cacheTimestamp = null;
    localStorage.removeItem(GRADES_CACHE_KEY);
    localStorage.removeItem(GRADES_CACHE_KEY + "_timestamp");
    localStorage.removeItem(GRADES_CACHE_KEY + "_version");
  }

  function saveGradesToLocalStorage() {
    try {
      const cacheData = {
        data: allStudentsData,
        timestamp: cacheTimestamp,
        version: GRADES_CACHE_VERSION,
      };
      localStorage.setItem(GRADES_CACHE_KEY, JSON.stringify(cacheData));
    } catch (e) {
      console.warn("Failed to save grades to localStorage:", e);
    }
  }

  function loadGradesFromLocalStorage() {
    try {
      const cached = localStorage.getItem(GRADES_CACHE_KEY);
      if (!cached) return false;

      const cacheData = JSON.parse(cached);
      if (cacheData.version !== GRADES_CACHE_VERSION) {
        invalidateGradesCache();
        return false;
      }

      const now = Date.now();
      if (now - cacheData.timestamp >= GRADES_CACHE_EXPIRY_TIME) {
        invalidateGradesCache();
        return false;
      }

      allStudentsData = cacheData.data || [];
      cacheTimestamp = cacheData.timestamp;
      return true;
    } catch (e) {
      console.warn("Failed to load grades from localStorage:", e);
      invalidateGradesCache();
      return false;
    }
  }

  // Fungsi untuk toggle sidebar di tampilan mobile
  function toggleSidebar() {
    document.body.classList.toggle("sidebar-active");
  }

  // Fungsi untuk mengupdate tanggal
  function updateDateTime() {
    const now = new Date();
    const options = {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric",
    };
    document.getElementById("current-date").textContent =
      now.toLocaleDateString("id-ID", options);
  }

  // Get session ID
  function getSessionId() {
    const hiddenInput = document.getElementById("sessionId");
    if (hiddenInput && hiddenInput.value) {
      return hiddenInput.value;
    }
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get("sessionId");
  }

  // Fungsi helper untuk memfilter data siswa
  function shouldIncludeStudentData(student) {
    // Hanya tampilkan data yang memiliki nilai pada kolom kelas dan semester
    return (
      student.kelas &&
      student.kelas.trim() !== "" &&
      student.semester &&
      student.semester.toString().trim() !== ""
    );
  }

  // Fungsi untuk memuat semua data nilai siswa (cache)
  function loadAllStudentsData(forceRefresh = false) {
    const sessionId = getSessionId();
    if (!sessionId) {
      showError("Session tidak valid. Silakan login kembali.");
      return;
    }

    // Check if we should use cached data
    if (!forceRefresh) {
      // Try to load from localStorage first
      if (loadGradesFromLocalStorage() && isGradesCacheValid()) {
        console.log("Using cached grades data from localStorage");
        // Update UI with cached data
        filteredStudentsData = allStudentsData;
        currentPage = 1;
        updatePaginatedResults();
        renderStudentTable();
        updateSummaryCards(allStudentsData);
        return;
      }

      // Check in-memory cache
      if (allStudentsData.length > 0 && isGradesCacheValid()) {
        console.log("Using cached grades data from memory");
        // Update UI with cached data
        filteredStudentsData = allStudentsData;
        currentPage = 1;
        updatePaginatedResults();
        renderStudentTable();
        updateSummaryCards(allStudentsData);
        return;
      }
    }

    console.log("Loading fresh grades data from server");

    google.script.run
      .withSuccessHandler(function (data) {
        console.log(
          "getAllStudentGradesForFrontend response (loadAllStudentsData):",
          data
        );
        console.log("Data type:", typeof data);
        console.log(
          "Has grades property:",
          data && data.hasOwnProperty("grades")
        );
        console.log(
          "Has success property:",
          data && data.hasOwnProperty("success")
        );

        if (data && data.success && data.grades && data.grades.length > 0) {
          console.log("Grades length:", data.grades.length);
          // Log raw data untuk debugging
          console.log(
            "Raw data sample (first 10 records):",
            data.grades.slice(0, 10).map((g) => ({
              nama: g.nama,
              kelas: g.kelas,
              jenisKelas: g.jenisKelas,
              kelas_: g.kelas_,
              jenisKelas_: g.jenisKelas_,
              semester: g.semester,
              semester_: g.semester_,
              semesterKelulusan: g.semesterKelulusan,
              hasKelas: !!g.kelas,
              hasJenisKelas: !!g.jenisKelas,
              hasKelas_: !!g.kelas_,
              hasJenisKelas_: !!g.jenisKelas_,
              hasSemester: !!g.semester,
              hasSemester_: !!g.semester_,
              hasSemesterKelulusan: !!g.semesterKelulusan,
            }))
          );

          // Count records with different column combinations
          const withKelasOnly = data.grades.filter(
            (g) => g.kelas && !g.kelas_
          ).length;
          const withKelas_Only = data.grades.filter(
            (g) => g.kelas_ && !g.kelas
          ).length;
          const withBothKelas = data.grades.filter(
            (g) => g.kelas && g.kelas_
          ).length;
          const withNeitherKelas = data.grades.filter(
            (g) => !g.kelas && !g.kelas_
          ).length;

          console.log(`Kelas distribution:`);
          console.log(`- Kelas only: ${withKelasOnly}`);
          console.log(`- Kelas_ only: ${withKelas_Only}`);
          console.log(`- Both Kelas & Kelas_: ${withBothKelas}`);
          console.log(`- Neither: ${withNeitherKelas}`);

          const withSemesterOnly = data.grades.filter(
            (g) => g.semester && !g.semester_
          ).length;
          const withSemester_Only = data.grades.filter(
            (g) => g.semester_ && !g.semester
          ).length;
          const withBothSemester = data.grades.filter(
            (g) => g.semester && g.semester_
          ).length;
          const withNeitherSemester = data.grades.filter(
            (g) => !g.semester && !g.semester_
          ).length;

          console.log(`Semester distribution:`);
          console.log(`- Semester only: ${withSemesterOnly}`);
          console.log(`- Semester_ only: ${withSemester_Only}`);
          console.log(`- Both Semester & Semester_: ${withBothSemester}`);
          console.log(`- Neither: ${withNeitherSemester}`);

          // Log semesterKelulusan distribution
          const withSemesterKelulusan = data.grades.filter(
            (g) => g.semesterKelulusan && g.semesterKelulusan.trim() !== ""
          ).length;
          const semesterKelulusanYa = data.grades.filter(
            (g) =>
              g.semesterKelulusan &&
              (g.semesterKelulusan.toLowerCase() === "ya" ||
                g.semesterKelulusan.toLowerCase() === "yes" ||
                g.semesterKelulusan === "1" ||
                g.semesterKelulusan === 1)
          ).length;
          const semesterKelulusanTidak = data.grades.filter(
            (g) =>
              g.semesterKelulusan &&
              (g.semesterKelulusan.toLowerCase() === "tidak" ||
                g.semesterKelulusan.toLowerCase() === "no" ||
                g.semesterKelulusan === "0" ||
                g.semesterKelulusan === 0)
          ).length;

          // Log sample kelas values with their structure
          const kelasStructureSample = data.grades.slice(0, 20).map((g) => ({
            nama: g.nama,
            kelas: g.kelas,
            jenisKelas: g.jenisKelas,
            jenisKelas_: g.jenisKelas_,
            kelasType: g.kelas ? g.kelas.split(" ").slice(1).join(" ") : "N/A",
          }));
          console.log(`Kelas structure sample:`, kelasStructureSample);

          // Log unique jenisKelas values untuk debugging filter jenis kelas
          const uniqueJenisKelas = [
            ...new Set(
              data.grades
                .map((g) => g.jenisKelas)
                .filter((jk) => jk && jk.trim() !== "")
            ),
          ];
          console.log(`Unique jenisKelas values:`, uniqueJenisKelas);

          const uniqueJenisKelas_ = [
            ...new Set(
              data.grades
                .map((g) => g.jenisKelas_)
                .filter((jk) => jk && jk.trim() !== "")
            ),
          ];
          console.log(`Unique jenisKelas_ values:`, uniqueJenisKelas_);

          // Setiap baris sudah berisi data lengkap siswa dengan semua mata pelajaran
          const processedData = data.grades.map((grade) => {
            // Hitung jumlah mata pelajaran yang memiliki nilai
            const subjectFields = [
              "pendidikanAgamaIslam",
              "pendidikanPancasila",
              "bahasaIndonesia",
              "matematika",
              "ilmuPengetahuanAlam",
              "ilmuPengetahuanSosial",
              "bahasaInggris",
              "pendidikanJasmani",
              "informatika",
              "seniBudaya",
              "bimbinganKonseling",
              "bahasaJawa",
            ];

            let totalSubjects = 0;
            let totalGrade = 0;
            let validGrades = 0;

            subjectFields.forEach((subject) => {
              const nilai = parseFloat(grade[subject]);
              if (!isNaN(nilai) && nilai > 0) {
                totalSubjects++;
                totalGrade += nilai;
                validGrades++;
              }
            });

            const averageGrade = validGrades > 0 ? totalGrade / validGrades : 0;

            // Create student record
            const record = {
              nis: grade.nis,
              nama: grade.nama,
              kelas: grade.kelas,
              jenisKelas: grade.jenisKelas || grade.jenisKelas_ || "",
              nisn: grade.nisn,
              semester: grade.semester,
              tahunAjaran: grade.tahunAjaran,
              totalSubjects: totalSubjects,
              averageGrade: averageGrade,
            };

            return record;
          });

          // Proses semua data (tidak ada filtering berdasarkan semester)
          allStudentsData = processedData.filter(shouldIncludeStudentData);

          // Set cache timestamp and save to localStorage
          cacheTimestamp = Date.now();
          saveGradesToLocalStorage();

          console.log("Data processing results:");
          console.log("- Total students:", allStudentsData.length);

          // Tampilkan semua data yang sudah difilter dengan pagination
          filteredStudentsData = allStudentsData;
          currentPage = 1;
          updatePaginatedResults();
          renderStudentTable();

          // Update summary cards with all data
          updateSummaryCards(allStudentsData);

          // Populate year filter dropdown
          populateYearFilter(allStudentsData);

          // Show pagination info if there are more pages
          if (data.totalPages && data.totalPages > 1) {
            console.log(
              "Data pagination info: Page " +
                data.currentPage +
                " of " +
                data.totalPages +
                ", Total records: " +
                data.totalCount
            );
            showInfo(
              "Menampilkan " +
                allStudentsData.length +
                " dari " +
                data.totalCount +
                " total siswa (Halaman " +
                data.currentPage +
                " dari " +
                data.totalPages +
                ")"
            );
          }
        } else {
          console.warn("No grades data received in loadAllStudentsData:", data);
          const errorMessage =
            data && data.message
              ? data.message
              : "Tidak ada data nilai siswa yang ditemukan";
          showError(errorMessage);
        }
      })
      .withFailureHandler(function (error) {
        console.error("Error loading student grades data:", error);
        showError(
          "Gagal memuat data nilai siswa: " +
            (error.message || error.toString())
        );
      })
      .getAllStudentGradesForFrontend();
  }

  // Fungsi untuk mencari siswa berdasarkan NIS atau nama
  function searchStudents() {
    const searchTerm = document.getElementById("search-input").value.trim();

    if (!searchTerm) {
      // Jika tidak ada pencarian, tampilkan semua data dengan pagination
      if (allStudentsData.length > 0) {
        filteredStudentsData = allStudentsData;
        currentPage = 1;
        updatePaginatedResults();
        renderStudentTable();
      } else {
        showSearchInfo("Masukkan NIS atau nama siswa untuk mencari data nilai");
      }
      return;
    }

    const sessionId = getSessionId();
    if (!sessionId) {
      showError("Session tidak valid. Silakan login kembali.");
      return;
    }

    showLoading();
    isSearching = true;

    // Jika data sudah ada di cache, gunakan cache
    if (allStudentsData.length > 0) {
      performSearch(searchTerm);
    } else {
      // Load data dari server
      google.script.run
        .withSuccessHandler(function (data) {
          isSearching = false;
          console.log(
            "getAllStudentGradesForFrontend response (searchStudents):",
            data
          );
          console.log("Data type:", typeof data);
          console.log(
            "Has grades property:",
            data && data.hasOwnProperty("grades")
          );
          console.log(
            "Has success property:",
            data && data.hasOwnProperty("success")
          );

          if (data && data.success && data.grades && data.grades.length > 0) {
            console.log("Grades length:", data.grades.length);

            // Log raw data untuk debugging (searchStudents)
            console.log(
              "Raw data sample (searchStudents - first 5 records):",
              data.grades.slice(0, 5).map((g) => ({
                nama: g.nama,
                kelas: g.kelas,
                kelas_: g.kelas_,
                semester: g.semester,
                semester_: g.semester_,
              }))
            );

            // Count records with kelas vs kelas_ (searchStudents)
            const withKelas = data.grades.filter(
              (g) => g.kelas && !g.kelas_
            ).length;
            const withKelas_ = data.grades.filter(
              (g) => g.kelas_ && !g.kelas
            ).length;
            const withBoth = data.grades.filter(
              (g) => g.kelas && g.kelas_
            ).length;
            console.log(
              `Records distribution (searchStudents): kelas only: ${withKelas}, kelas_ only: ${withKelas_}, both: ${withBoth}`
            );

            // Process data - create separate records for academic and exam data (searchStudents)
            const processedData = data.grades.map((grade) => {
              const records = [];

              // Academic data (using kelas, semester columns)
              if (grade.kelas && grade.semester) {
                const subjectFields = [
                  "pendidikanAgamaIslam",
                  "pendidikanPancasila",
                  "bahasaIndonesia",
                  "matematika",
                  "ilmuPengetahuanAlam",
                  "ilmuPengetahuanSosial",
                  "bahasaInggris",
                  "pendidikanJasmani",
                  "informatika",
                  "seniBudaya",
                  "bimbinganKonseling",
                  "bahasaJawa",
                ];

                let totalSubjects = 0;
                let totalGrade = 0;
                let validGrades = 0;

                subjectFields.forEach((subject) => {
                  const nilai = parseFloat(grade[subject]);
                  if (!isNaN(nilai) && nilai > 0) {
                    totalSubjects++;
                    totalGrade += nilai;
                    validGrades++;
                  }
                });

                const averageGrade =
                  validGrades > 0 ? totalGrade / validGrades : 0;

                records.push({
                  nis: grade.nis,
                  nama: grade.nama,
                  kelas: grade.kelas,
                  jenisKelas: grade.jenisKelas || grade.jenisKelas_ || "",
                  nisn: grade.nisn,
                  semester: grade.semester,
                  tahunAjaran: grade.tahunAjaran,
                  totalSubjects: totalSubjects,
                  averageGrade: averageGrade,
                  dataType: "academic",
                });
              }

              // Exam data (using kelas_, semester_ columns)
              if (grade.kelas_ && grade.semester_) {
                const subjectFields = [
                  "pendidikanAgamaIslam",
                  "pendidikanPancasila",
                  "bahasaIndonesia",
                  "matematika",
                  "ilmuPengetahuanAlam",
                  "ilmuPengetahuanSosial",
                  "bahasaInggris",
                  "pendidikanJasmani",
                  "informatika",
                  "seniBudaya",
                  "bimbinganKonseling",
                  "bahasaJawa",
                ];

                let totalSubjects = 0;
                let totalGrade = 0;
                let validGrades = 0;

                // For exam data, we might need to use different field names
                // For now, using the same fields but marking as exam type
                subjectFields.forEach((subject) => {
                  const nilai = parseFloat(grade[subject]);
                  if (!isNaN(nilai) && nilai > 0) {
                    totalSubjects++;
                    totalGrade += nilai;
                    validGrades++;
                  }
                });

                const averageGrade =
                  validGrades > 0 ? totalGrade / validGrades : 0;

                records.push({
                  nis: grade.nis,
                  nama: grade.nama,
                  kelas: grade.kelas_,
                  jenisKelas: grade.jenisKelas || grade.jenisKelas_ || "",
                  nisn: grade.nisn,
                  semester: grade.semester_,
                  tahunAjaran: grade.tahunAjaran,
                  totalSubjects: totalSubjects,
                  averageGrade: averageGrade,
                  dataType: "exam",
                });
              }

              return records;
            });

            // Flatten the array since each grade can produce multiple records
            const flattenedData = processedData.flat();

            // Proses semua data (tidak ada filtering berdasarkan semester)
            allStudentsData = flattenedData.filter(shouldIncludeStudentData);

            // Log data types distribution (searchStudents)
            const academicData = allStudentsData.filter(
              (s) => s.dataType === "academic"
            );
            const examData = allStudentsData.filter(
              (s) => s.dataType === "exam"
            );
            console.log(
              `Data types (searchStudents): Academic: ${academicData.length}, Exam: ${examData.length}, Total: ${allStudentsData.length}`
            );

            // Debug: Log sample data untuk melihat struktur kelas dan semester
            console.log(
              "Sample student data (searchStudents):",
              allStudentsData.slice(0, 5).map((s) => ({
                nama: s.nama,
                kelas: s.kelas,
                semester: s.semester,
                kelasType: typeof s.kelas,
                semesterType: typeof s.semester,
              }))
            );

            // Show pagination info if there are more pages
            if (data.totalPages && data.totalPages > 1) {
              console.log(
                "Data pagination info: Page " +
                  data.currentPage +
                  " of " +
                  data.totalPages +
                  ", Total records: " +
                  data.totalCount
              );
              showInfo(
                "Menampilkan " +
                  allStudentsData.length +
                  " dari " +
                  data.totalCount +
                  " total siswa (Halaman " +
                  data.currentPage +
                  " dari " +
                  data.totalPages +
                  ")"
              );
            }

            // Populate year filter dropdown
            populateYearFilter(allStudentsData);

            performSearch(searchTerm);
          } else {
            console.warn("No grades data received in searchStudents:", data);
            const errorMessage =
              data && data.message
                ? data.message
                : "Gagal memuat data nilai siswa - data kosong atau tidak valid";
            showError(errorMessage);
          }
        })
        .withFailureHandler(function (error) {
          isSearching = false;
          console.error("Error searching student grades:", error);
          showError(
            "Terjadi kesalahan saat mencari data nilai siswa: " +
              (error.message || error.toString())
          );
        })
        .getAllStudentGradesForFrontend();
    }
  }

  // Fungsi untuk melakukan pencarian pada data yang sudah ada
  function performSearch(searchTerm) {
    const searchLower = searchTerm.toLowerCase();
    filteredStudentsData = allStudentsData.filter((student) => {
      // Safely convert to string and check if the values exist
      const nis = student.nis ? String(student.nis).toLowerCase() : "";
      const nama = student.nama ? String(student.nama).toLowerCase() : "";

      return nis.includes(searchLower) || nama.includes(searchLower);
    });

    // Reset ke halaman pertama setelah pencarian
    currentPage = 1;
    updatePaginatedResults();
    isSearching = false;
    hideLoadingIndicator();
    renderStudentTable();

    // Update summary cards with filtered data
    updateSummaryCards(filteredStudentsData);
  }

  // Fungsi untuk mengupdate hasil dengan pagination
  function updatePaginatedResults() {
    const startIndex = (currentPage - 1) * studentsPerPage;
    const endIndex = startIndex + studentsPerPage;
    searchResults = filteredStudentsData.slice(startIndex, endIndex);
  }

  // Fungsi untuk navigasi pagination
  function goToPage(page) {
    const totalPages = Math.ceil(filteredStudentsData.length / studentsPerPage);
    if (page >= 1 && page <= totalPages) {
      currentPage = page;
      updatePaginatedResults();
      renderStudentTable();
    }
  }

  // Fungsi untuk halaman sebelumnya
  function previousPage() {
    if (currentPage > 1) {
      goToPage(currentPage - 1);
    }
  }

  // Fungsi untuk halaman selanjutnya
  function nextPage() {
    const totalPages = Math.ceil(filteredStudentsData.length / studentsPerPage);
    if (currentPage < totalPages) {
      goToPage(currentPage + 1);
    }
  }

  // Real-time search dengan debouncing
  function setupRealTimeSearch() {
    const searchInput = document.getElementById("search-input");

    if (searchInput) {
      searchInput.addEventListener("input", function (e) {
        const query = e.target.value.trim();

        // Clear previous timeout
        if (searchTimeout) {
          clearTimeout(searchTimeout);
        }

        // Only search if query changed
        if (query === lastSearchQuery) {
          return;
        }

        lastSearchQuery = query;

        // Show real-time feedback
        const searchBox = document.querySelector(".search-box");
        if (searchBox) {
          searchBox.classList.add("searching");
        }

        // Jika query kosong, terapkan filter saja
        if (!query) {
          if (allStudentsData.length > 0) {
            applyFiltersAndSearch();
          } else {
            showSearchInfo(
              "Masukkan NIS atau nama siswa untuk mencari data nilai"
            );
          }
          if (searchBox) {
            searchBox.classList.remove("searching");
          }
          return;
        }

        // Debounce search - wait 500ms after user stops typing
        searchTimeout = setTimeout(() => {
          applyFiltersAndSearch();

          // Remove searching class after search completes
          setTimeout(() => {
            if (searchBox) {
              searchBox.classList.remove("searching");
            }
          }, 300);
        }, 500);
      });

      // Handle Enter key for immediate search
      searchInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          if (searchTimeout) {
            clearTimeout(searchTimeout);
          }
          applyFiltersAndSearch();
        }
      });
    }
  }

  // Fungsi untuk menampilkan loading indicator
  function showLoadingIndicator() {
    const searchBtn = document.getElementById("search-btn");
    const searchInput = document.getElementById("search-input");
    const searchBox = document.querySelector(".search-box");

    if (searchBtn) {
      searchBtn.disabled = true;
      searchBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mencari...';
    }

    if (searchInput) {
      searchInput.style.opacity = "0.7";
    }

    if (searchBox) {
      searchBox.classList.add("searching");
    }
  }

  // Fungsi untuk menyembunyikan loading indicator
  function hideLoadingIndicator() {
    const searchBtn = document.getElementById("search-btn");
    const searchInput = document.getElementById("search-input");
    const searchBox = document.querySelector(".search-box");

    if (searchBtn) {
      searchBtn.disabled = false;
      searchBtn.innerHTML = '<i class="fas fa-search"></i> Cari';
    }

    if (searchInput) {
      searchInput.style.opacity = "1";
    }

    if (searchBox) {
      searchBox.classList.remove("searching");
    }
  }

  // Fungsi untuk menampilkan loading
  function showLoading() {
    const searchInfo = document.getElementById("search-info");
    const studentTable = document.getElementById("student-table");
    const tableBody = document.getElementById("students-table-body");

    searchInfo.style.display = "none";
    studentTable.style.display = "table";
    tableBody.innerHTML = `
      <tr>
        <td colspan="8" style="text-align: center; padding: 40px;">
          ⏳ Mencari data siswa...
        </td>
      </tr>
    `;

    showLoadingIndicator();
  }

  // Fungsi untuk menampilkan error
  function showError(message) {
    const searchInfo = document.getElementById("search-info");
    const studentTable = document.getElementById("student-table");
    const tableBody = document.getElementById("students-table-body");

    searchInfo.style.display = "none";
    studentTable.style.display = "table";
    tableBody.innerHTML = `
      <tr>
        <td colspan="8" style="text-align: center; padding: 40px; color: #dc3545;">
          ❌ ${message}
        </td>
      </tr>
    `;

    hideLoadingIndicator();
  }

  // Fungsi untuk menampilkan info
  function showInfo(message) {
    const searchInfo = document.getElementById("search-info");

    searchInfo.innerHTML = `<div style="color: #007bff; font-weight: bold;">ℹ️ ${message}</div>`;
    searchInfo.style.display = "block";
  }

  // Fungsi untuk menampilkan info pencarian
  function showSearchInfo(message) {
    const searchInfo = document.getElementById("search-info");
    const studentTable = document.getElementById("student-table");

    searchInfo.textContent = message;
    searchInfo.style.display = "block";
    studentTable.style.display = "none";
  }

  // Fungsi untuk menghitung dan menampilkan summary statistics
  function updateSummaryCards(students) {
    const summarySection = document.getElementById("summary-section");

    if (!students || students.length === 0) {
      summarySection.style.display = "none";
      return;
    }

    // Calculate statistics
    const totalStudents = students.length;
    let totalGrades = 0;
    let validGradeCount = 0;
    let below75Count = 0;
    let above75Count = 0;

    students.forEach((student) => {
      const avgGrade = parseFloat(student.averageGrade);
      if (!isNaN(avgGrade) && avgGrade > 0) {
        totalGrades += avgGrade;
        validGradeCount++;

        if (avgGrade < 75) {
          below75Count++;
        } else {
          above75Count++;
        }
      }
    });

    const overallAverage =
      validGradeCount > 0 ? (totalGrades / validGradeCount).toFixed(1) : 0;

    // Update summary card values
    document.getElementById("overall-average").textContent = overallAverage;
    document.getElementById("below-75-count").textContent = below75Count;
    document.getElementById("above-75-count").textContent = above75Count;

    // Show summary section
    summarySection.style.display = "block";
  }

  // Fungsi untuk menampilkan table siswa
  function renderStudentTable() {
    const searchInfo = document.getElementById("search-info");
    const studentTable = document.getElementById("student-table");
    const tableBody = document.getElementById("students-table-body");

    if (filteredStudentsData.length === 0) {
      searchInfo.style.display = "block";
      searchInfo.innerHTML =
        "Tidak ada siswa yang ditemukan dengan kata kunci tersebut";
      studentTable.style.display = "none";
      hidePaginationControls();
      updateSummaryCards([]);
      return;
    }

    if (searchResults.length === 0) {
      searchInfo.style.display = "block";
      searchInfo.innerHTML = "Tidak ada data pada halaman ini";
      studentTable.style.display = "none";
      showPaginationControls();
      updateSummaryCards(filteredStudentsData);
      return;
    }

    searchInfo.style.display = "none";
    studentTable.style.display = "table";

    // Hitung nomor urut berdasarkan halaman
    const startNumber = (currentPage - 1) * studentsPerPage;

    tableBody.innerHTML = searchResults
      .map((student, index) => {
        // Format rata-rata nilai
        const avgGrade = student.averageGrade
          ? student.averageGrade.toFixed(1)
          : "0.0";
        const gradeColor =
          student.averageGrade >= 75
            ? "#28a745"
            : student.averageGrade >= 60
            ? "#ffc107"
            : "#dc3545";

        let semesterDisplay = student.semester || "-";

        return `
          <tr>
            <td>${startNumber + index + 1}</td>
            <td>${student.nis}</td>
            <td class="student-name">${student.nama}</td>
            <td>${student.kelas || "-"}</td>
            <td>${student.jenisKelas || "-"}</td>
            <td>${semesterDisplay}</td>
            <td>${student.tahunAjaran || "-"}</td>
            <td style="color: ${gradeColor}; font-weight: bold;">${avgGrade}</td>
            <td>
              <div class="action-buttons">
                <a href="#" class="btn btn-primary btn-sm btn-view-grades" 
                   data-id="${student.nis}" 
                   data-kelas="${student.kelas}" 
                   data-semester="${student.semester}" 
                   title="Lihat Detail Nilai Siswa">
                  📝 Detail Nilai
                </a>
              </div>
            </td>
           </tr>
         `;
      })
      .join("");

    // Setup action buttons after rendering
    setupActionButtons();

    // Show pagination controls
    showPaginationControls();

    // Update summary cards
    updateSummaryCards(filteredStudentsData);
  }

  // Setup action buttons
  function setupActionButtons() {
    // View student grades button - Setup both href and click handler
    document.querySelectorAll(".btn-view-grades").forEach(function (button) {
      const studentId = button.getAttribute("data-id");
      const kelas = button.getAttribute("data-kelas");
      const semester = button.getAttribute("data-semester");
      const sessionId = getSessionId();

      // Set href like navbar approach (Opsi 1)
      if (sessionId && studentId && kelas && semester) {
        button.href =
          "<?= myURL() ?>?page=Student_grades_detail&sessionId=" +
          encodeURIComponent(sessionId) +
          "&nis=" +
          encodeURIComponent(studentId) +
          "&kelas=" +
          encodeURIComponent(kelas) +
          "&semester=" +
          encodeURIComponent(semester);
      }

      // Keep click handler as backup (Opsi 2)
      button.addEventListener("click", function (event) {
        const studentId = this.getAttribute("data-id");
        const kelas = this.getAttribute("data-kelas");
        const semester = this.getAttribute("data-semester");

        viewStudentGrades(studentId, kelas, semester, event);
      });
    });
  }

  // Fungsi untuk melihat nilai siswa
  function viewStudentGrades(studentId, kelas, semester, event) {
    // Only prevent default if href is not properly set (fallback mode)
    const button = event ? event.target : null;
    const hasValidHref =
      button &&
      button.href &&
      button.href !== "#" &&
      !button.href.endsWith("#");

    if (event && !hasValidHref) {
      event.preventDefault();
    }

    // If href is properly set, let the browser handle navigation naturally
    if (hasValidHref) {
      return; // Let the href handle navigation
    }

    // Fallback navigation for cases where href is not set
    if (!studentId || !kelas || !semester) {
      showError("Data siswa tidak lengkap");
      return;
    }

    try {
      // Get current session ID from URL
      const sessionId = getSessionId();

      // Navigate to student grades detail page with proper Google Apps Script URL format
      const detailUrl =
        "<?= myURL() ?>?page=Student_grades_detail&sessionId=" +
        encodeURIComponent(sessionId) +
        "&nis=" +
        encodeURIComponent(studentId) +
        "&kelas=" +
        encodeURIComponent(kelas) +
        "&semester=" +
        encodeURIComponent(semester);

      // Direct redirect without delay to ensure URL changes immediately
      window.location.href = detailUrl;
    } catch (error) {
      showError("Terjadi kesalahan saat membuka detail nilai siswa");
    }
  }

  // Fungsi untuk menampilkan kontrol pagination
  function showPaginationControls() {
    const totalPages = Math.ceil(filteredStudentsData.length / studentsPerPage);
    const totalStudents = filteredStudentsData.length;

    if (totalPages <= 1) {
      hidePaginationControls();
      return;
    }

    // Cari atau buat container untuk pagination
    let paginationContainer = document.getElementById("pagination-container");
    if (!paginationContainer) {
      paginationContainer = document.createElement("div");
      paginationContainer.id = "pagination-container";
      paginationContainer.className = "pagination";
      const studentTable = document.getElementById("student-table");
      studentTable.parentNode.insertBefore(
        paginationContainer,
        studentTable.nextSibling
      );
    }

    // Create pagination info
    const paginationInfo = document.createElement("div");
    paginationInfo.className = "pagination-info";
    paginationInfo.textContent = `Menampilkan ${searchResults.length} dari ${totalStudents} siswa (Halaman ${currentPage} dari ${totalPages})`;

    // Create pagination controls container
    const paginationControls = document.createElement("div");
    paginationControls.className = "pagination-controls";

    // Previous button
    const prevButton = document.createElement("button");
    prevButton.innerHTML = "&laquo; Sebelumnya";
    prevButton.className = "pagination-btn prev-btn";
    prevButton.disabled = currentPage === 1;
    prevButton.addEventListener("click", (e) => {
      e.preventDefault();
      if (currentPage > 1) {
        previousPage();
      }
    });
    paginationControls.appendChild(prevButton);

    // Page numbers with ellipsis logic
    const maxVisiblePages = 5;
    let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
    let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

    // Adjust if we're near the end
    if (endPage - startPage + 1 < maxVisiblePages && startPage > 1) {
      startPage = Math.max(1, endPage - maxVisiblePages + 1);
    }

    // Add first page and ellipsis if needed
    if (startPage > 1) {
      const firstPageButton = document.createElement("button");
      firstPageButton.textContent = "1";
      firstPageButton.className = "pagination-btn page-btn";
      firstPageButton.addEventListener("click", (e) => {
        e.preventDefault();
        goToPage(1);
      });
      paginationControls.appendChild(firstPageButton);

      if (startPage > 2) {
        const ellipsis = document.createElement("span");
        ellipsis.textContent = "...";
        ellipsis.className = "pagination-ellipsis";
        paginationControls.appendChild(ellipsis);
      }
    }

    // Page numbers
    for (let i = startPage; i <= endPage; i++) {
      const pageButton = document.createElement("button");
      pageButton.textContent = i;
      pageButton.className = "pagination-btn page-btn";

      if (i === currentPage) {
        pageButton.classList.add("active");
        pageButton.setAttribute("aria-current", "page");
      }

      pageButton.addEventListener("click", (e) => {
        e.preventDefault();
        if (i !== currentPage) {
          goToPage(i);
        }
      });

      paginationControls.appendChild(pageButton);
    }

    // Add last page and ellipsis if needed
    if (endPage < totalPages) {
      if (endPage < totalPages - 1) {
        const ellipsis = document.createElement("span");
        ellipsis.textContent = "...";
        ellipsis.className = "pagination-ellipsis";
        paginationControls.appendChild(ellipsis);
      }

      const lastPageButton = document.createElement("button");
      lastPageButton.textContent = totalPages;
      lastPageButton.className = "pagination-btn page-btn";
      lastPageButton.addEventListener("click", (e) => {
        e.preventDefault();
        goToPage(totalPages);
      });
      paginationControls.appendChild(lastPageButton);
    }

    // Next button
    const nextButton = document.createElement("button");
    nextButton.innerHTML = "Selanjutnya &raquo;";
    nextButton.className = "pagination-btn next-btn";
    nextButton.disabled = currentPage === totalPages;
    nextButton.addEventListener("click", (e) => {
      e.preventDefault();
      if (currentPage < totalPages) {
        nextPage();
      }
    });
    paginationControls.appendChild(nextButton);

    // Clear and rebuild pagination container
    paginationContainer.innerHTML = "";
    paginationContainer.appendChild(paginationInfo);
    paginationContainer.appendChild(paginationControls);
    paginationContainer.style.display = "flex";
  }

  // Fungsi untuk menyembunyikan kontrol pagination
  function hidePaginationControls() {
    const paginationContainer = document.getElementById("pagination-container");
    if (paginationContainer) {
      paginationContainer.style.display = "none";
    }
  }

  // Fungsi untuk mengisi dropdown tahun
  function populateYearFilter(data) {
    const yearFilter = document.getElementById("year-filter");
    const years = new Set();

    data.forEach((student) => {
      if (student.tahunAjaran) {
        years.add(student.tahunAjaran);
      }
    });

    // Clear existing options except "Semua Tahun"
    yearFilter.innerHTML = '<option value="all">Semua Tahun</option>';

    // Sort years and add to dropdown
    Array.from(years)
      .sort()
      .forEach((year) => {
        const option = document.createElement("option");
        option.value = year;
        option.textContent = year;
        yearFilter.appendChild(option);
      });
  }

  // Fungsi untuk filter berdasarkan nilai rata-rata
  function applyGradeFilter(data, filterValue) {
    if (filterValue === "all") {
      return data;
    }

    return data.filter((student) => {
      // Gunakan averageGrade yang sudah dihitung, bukan rataRata
      const average = parseFloat(student.averageGrade) || 0;

      switch (filterValue) {
        case "below-75":
          return average < 75;
        case "75-above":
          return average >= 75;
        case "80-above":
          return average >= 80;
        case "90-above":
          return average >= 90;
        default:
          return true;
      }
    });
  }

  // Fungsi untuk filter berdasarkan tahun
  function applyYearFilter(data, filterValue) {
    if (filterValue === "all") {
      return data;
    }

    return data.filter((student) => {
      return student.tahunAjaran === filterValue;
    });
  }

  // Fungsi untuk filter berdasarkan jenis kelas
  function applyClassTypeFilter(data, filterValue) {
    if (filterValue === "all") {
      return data;
    }

    return data.filter((student) => {
      // Use jenisKelas field directly if available, otherwise fallback to extracting from kelas
      let jenisKelas = "";

      if (student.jenisKelas && student.jenisKelas.trim() !== "") {
        jenisKelas = student.jenisKelas.toUpperCase();
      } else if (student.kelas) {
        // Fallback: extract class type from kelas field (e.g., "7 SPINEL" -> "SPINEL")
        const kelasParts = student.kelas.split(" ");
        if (kelasParts.length > 1) {
          jenisKelas = kelasParts.slice(1).join(" ").toUpperCase();
        }
      }

      console.log(
        `Filtering student ${
          student.nama
        }: jenisKelas="${jenisKelas}", filterValue="${filterValue}", match=${
          jenisKelas === filterValue
        }`
      );
      return jenisKelas === filterValue;
    });
  }

  // Fungsi untuk menerapkan filter dan search secara bersamaan
  function applyFiltersAndSearch() {
    const searchQuery = document.getElementById("search-input").value.trim();
    const gradeFilter = document.getElementById("grade-filter").value;
    const yearFilter = document.getElementById("year-filter").value;
    const classTypeFilter = document.getElementById("class-type-filter").value;

    let dataToFilter = allStudentsData;

    // Apply search filter first if there's a search query
    if (searchQuery) {
      const searchLower = searchQuery.toLowerCase();
      dataToFilter = allStudentsData.filter(
        (student) =>
          student.nis.toString().toLowerCase().includes(searchLower) ||
          student.nama.toLowerCase().includes(searchLower)
      );
    }

    // Apply all filters sequentially
    let finalFilteredData = dataToFilter;
    finalFilteredData = applyGradeFilter(finalFilteredData, gradeFilter);
    finalFilteredData = applyYearFilter(finalFilteredData, yearFilter);
    finalFilteredData = applyClassTypeFilter(
      finalFilteredData,
      classTypeFilter
    );

    // Update filtered data and pagination
    filteredStudentsData = finalFilteredData;
    searchResults = finalFilteredData;
    currentPage = 1;

    // Apply current sorting if any
    if (currentSortField) {
      applySortToData();
    }

    // Update UI
    updatePaginatedResults();
    renderStudentTable();
    updateSummaryCards(finalFilteredData);
    updateSortIndicators();

    // Show appropriate message
    if (finalFilteredData.length === 0) {
      const hasActiveFilters =
        gradeFilter !== "all" ||
        yearFilter !== "all" ||
        classTypeFilter !== "all";

      if (searchQuery && hasActiveFilters) {
        showSearchInfo(
          `Tidak ada siswa yang ditemukan dengan kata kunci "${searchQuery}" dan filter yang dipilih`
        );
      } else if (searchQuery) {
        showSearchInfo(
          `Tidak ada siswa yang ditemukan dengan kata kunci "${searchQuery}"`
        );
      } else if (hasActiveFilters) {
        showSearchInfo(
          `Tidak ada siswa yang memenuhi kriteria filter yang dipilih`
        );
      }
    }
  }

  // Fungsi untuk reset pencarian
  function resetSearch() {
    // Clear timeout jika ada
    if (searchTimeout) {
      clearTimeout(searchTimeout);
    }

    document.getElementById("search-input").value = "";
    document.getElementById("grade-filter").value = "all";
    document.getElementById("year-filter").value = "all";
    document.getElementById("class-type-filter").value = "all";
    lastSearchQuery = "";
    searchResults = [];
    filteredStudentsData = allStudentsData; // Reset to show all data
    currentPage = 1;
    // Reset sorting
    currentSortField = "";
    currentSortDirection = "asc";
    updateSortIndicators();
    hideLoadingIndicator();
    hidePaginationControls();

    // Update summary cards with all data
    updateSummaryCards(allStudentsData);

    // Show all data if available, otherwise show search info
    if (allStudentsData.length > 0) {
      updatePaginatedResults();
      renderStudentTable();
    } else {
      showSearchInfo("Masukkan NIS atau nama siswa untuk mencari data");
    }
  }

  // Sort table by column
  function sortTable(field) {
    if (field === currentSortField) {
      // Toggle direction if same field
      currentSortDirection = currentSortDirection === "asc" ? "desc" : "asc";
    } else {
      // New field, default to ascending
      currentSortField = field;
      currentSortDirection = "asc";
    }

    // Apply sort to current filtered data
    applySortToData();

    // Update UI
    currentPage = 1;
    updatePaginatedResults();
    renderStudentTable();
    updateSortIndicators();
  }

  // Apply sorting to filtered data
  function applySortToData() {
    if (!currentSortField) return;

    filteredStudentsData.sort((a, b) => {
      let aValue, bValue;

      switch (currentSortField) {
        case "nis":
          aValue = parseInt(a.nis) || 0;
          bValue = parseInt(b.nis) || 0;
          break;
        case "nama":
          aValue = a.nama.toLowerCase();
          bValue = b.nama.toLowerCase();
          break;
        case "kelas":
          aValue = a.kelas.toLowerCase();
          bValue = b.kelas.toLowerCase();
          break;
        case "semester":
          aValue = parseInt(a.semester) || 0;
          bValue = parseInt(b.semester) || 0;
          break;
        case "tahunAjaran":
          aValue = a.tahunAjaran || "";
          bValue = b.tahunAjaran || "";
          break;
        case "averageGrade":
          aValue = parseFloat(a.averageGrade) || 0;
          bValue = parseFloat(b.averageGrade) || 0;
          break;
        default:
          return 0;
      }

      if (typeof aValue === "string") {
        if (currentSortDirection === "asc") {
          return aValue.localeCompare(bValue);
        } else {
          return bValue.localeCompare(aValue);
        }
      } else {
        if (currentSortDirection === "asc") {
          return aValue - bValue;
        } else {
          return bValue - aValue;
        }
      }
    });

    // Update searchResults to match sorted filteredStudentsData
    searchResults = filteredStudentsData;
  }

  // Update sort indicators on table headers
  function updateSortIndicators() {
    // Remove all sort indicators from sortable headers
    document.querySelectorAll(".student-table th.sortable").forEach((th) => {
      th.classList.remove("sorted-asc", "sorted-desc");
    });

    // Add indicator to current sorted column
    if (currentSortField) {
      const fieldMap = {
        "nis": 1,
        "nama": 2,
        "kelas": 3,
        "semester": 4,
        "tahunAjaran": 5,
        "averageGrade": 6,
      };

      const columnIndex = fieldMap[currentSortField];
      if (columnIndex !== undefined) {
        const th = document.querySelector(
          `.student-table th:nth-child(${columnIndex + 1})`
        );
        if (th && th.classList.contains("sortable")) {
          th.classList.add(
            currentSortDirection === "asc" ? "sorted-asc" : "sorted-desc"
          );
        }
      }
    }
  }

  // Event listeners
  document.addEventListener("DOMContentLoaded", function () {
    // Clean expired cache on page load
    if (!isGradesCacheValid()) {
      invalidateGradesCache();
    }

    updateDateTime();

    // Load data siswa untuk cache dan tampilkan
    loadAllStudentsData();

    // Setup real-time search
    setupRealTimeSearch();

    // Search button (untuk fallback)
    document
      .getElementById("search-btn")
      .addEventListener("click", function () {
        applyFiltersAndSearch();
      });

    // Reset button
    document.getElementById("reset-btn").addEventListener("click", resetSearch);

    // Grade filter dropdown
    document
      .getElementById("grade-filter")
      .addEventListener("change", function () {
        if (allStudentsData.length > 0) {
          applyFiltersAndSearch();
        }
      });

    // Year filter dropdown
    document
      .getElementById("year-filter")
      .addEventListener("change", function () {
        if (allStudentsData.length > 0) {
          applyFiltersAndSearch();
        }
      });

    // Class type filter dropdown
    document
      .getElementById("class-type-filter")
      .addEventListener("change", function () {
        if (allStudentsData.length > 0) {
          applyFiltersAndSearch();
        }
      });

    // Refresh button
    document
      .getElementById("refresh-grades-btn")
      .addEventListener("click", function () {
        showInfo("Memuat ulang data nilai dari server...");
        invalidateGradesCache();
        loadAllStudentsData(true); // Force refresh
        // Clear current search if any
        const searchQuery = document
          .getElementById("search-input")
          .value.trim();
        const gradeFilter = document.getElementById("grade-filter").value;
        if (searchQuery || gradeFilter !== "all") {
          setTimeout(() => {
            applyFiltersAndSearch(); // Re-run filters with fresh data
          }, 500);
        }
      });

    // Setup table header sorting
    document
      .querySelectorAll(".student-table th")
      .forEach(function (th, index) {
        // Skip NO. column (index 0) and Aksi column (index 7)
        if (index > 0 && index < 7) {
          th.classList.add("sortable");
          th.addEventListener("click", function () {
            const fieldMap = {
              1: "nis",
              2: "nama",
              3: "kelas",
              4: "semester",
              5: "tahunAjaran",
              6: "averageGrade",
            };

            sortTable(fieldMap[index]);
          });
        }
      });
  });

  // Update time every minute
  setInterval(updateDateTime, 60000);
</script>
