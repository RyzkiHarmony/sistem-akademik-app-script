    <script>
      let currentStudentId = null;

      // Fungsi untuk toggle sidebar di tampilan mobile
      function toggleSidebar() {
        document.body.classList.toggle("sidebar-active");
      }

      // Fungsi untuk mengupdate tanggal
      function updateDateTime() {
        const now = new Date();
        const options = {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
        };
        document.getElementById("current-date").textContent =
          now.toLocaleDateString("id-ID", options);
      }

      // Get session ID
      function getSessionId() {
        // First try to get from hidden input
        const hiddenInput = document.getElementById("sessionId");
        if (hiddenInput && hiddenInput.value) {
          return hiddenInput.value;
        }

        // Fallback to URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get("sessionId");
      }

      // Get student ID from URL parameters or server-side template
      function getStudentIdFromUrl() {
        // First try to get from server-side template parameter
        const serverStudentId =
          '<?= typeof studentId !== "undefined" ? studentId : "" ?>';
        if (serverStudentId && serverStudentId !== "") {
          return serverStudentId;
        }

        // Fallback to URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const urlStudentId = urlParams.get("id");

        return urlStudentId;
      }

      // Go back to students list
      function goBack() {
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = getSessionId();
        window.location.href =
          "<?= myURL() ?>?page=Students_manage&sessionId=" +
          encodeURIComponent(sessionId);
      }

      // Edit student
      function editStudent(event) {
        // Prevent default link behavior if called from link
        if (event) {
          event.preventDefault();
        }

        if (!currentStudentId) {
          alert("ID siswa tidak tersedia");
          return;
        }

        try {
          const sessionId = getSessionId();
          if (!sessionId) {
            alert("Session tidak valid. Silakan login kembali.");
            return;
          }

          const editUrl =
            "<?= myURL() ?>?page=Student_edit&sessionId=" +
            encodeURIComponent(sessionId) +
            "&id=" +
            encodeURIComponent(currentStudentId);

          // Direct redirect without delay to ensure URL changes immediately
          window.location.href = editUrl;
        } catch (error) {
          console.error("Error in editStudent:", error);
          alert("Terjadi kesalahan saat membuka halaman edit");
        }
      }

      // Generate PDF
      function generatePDF() {
        if (!currentStudentId) {
          alert("ID siswa tidak tersedia");
          return;
        }

        try {
          const sessionId = getSessionId();
          if (!sessionId) {
            alert("Session tidak valid. Silakan login kembali.");
            return;
          }

          // Show loading state
          const pdfButton = document.querySelector(".btn-info");
          const originalText = pdfButton.innerHTML;
          pdfButton.innerHTML = '<span class="btn-icon">⏳</span>Memproses...';
          pdfButton.disabled = true;

          // Call server-side function to get PDF URL
          google.script.run
            .withSuccessHandler(function (result) {
              // Reset button
              pdfButton.innerHTML = originalText;
              pdfButton.disabled = false;

              if (result.success) {
                // Open PDF in new tab
                window.open(result.url, "_blank");
              } else {
                alert(result.message || "Gagal mengakses file PDF");
              }
            })
            .withFailureHandler(function (error) {
              // Reset button
              pdfButton.innerHTML = originalText;
              pdfButton.disabled = false;

              console.error("Error generating PDF:", error);
              alert("Terjadi kesalahan: " + error);
            })
            .getStudentPDFUrl(currentStudentId);
        } catch (error) {
          console.error("Error in generatePDF:", error);
          alert("Terjadi kesalahan saat membuat PDF");
        }
      }

      // Load student detail
      function loadStudentDetail(studentId) {
        if (!studentId) {
          showError("ID siswa tidak ditemukan");
          return;
        }

        currentStudentId = studentId;

        const sessionId = getSessionId();

        // Show loading indicator
        document.getElementById("detail-content").innerHTML = `
          <div class="loading-container" style="text-align: center; padding: 50px;">
            <div style="font-size: 18px; color: #666;">Memuat data siswa...</div>
          </div>
        `;

        // Tambahkan timeout untuk debugging
        const startTime = new Date().getTime();

        google.script.run
          .withSuccessHandler(function (student) {
            const endTime = new Date().getTime();
            const duration = endTime - startTime;

            // Validasi lebih detail
            if (student === null) {
              console.error("Student data is null");
              showError("Data siswa tidak ditemukan (null). NIS: " + studentId);
              return;
            }

            if (student === undefined) {
              console.error("Student data is undefined");
              showError(
                "Data siswa tidak ditemukan (undefined). NIS: " + studentId
              );
              return;
            }

            if (!student) {
              console.error("Student data is falsy:", student);
              showError(
                "Data siswa tidak ditemukan (falsy). NIS: " + studentId
              );
              return;
            }

            // Validate student object has required properties
            if (typeof student !== "object") {
              console.error("Invalid student data format:", typeof student);
              showError(
                "Format data siswa tidak valid. Type: " + typeof student
              );
              return;
            }

            // Cek apakah ada data minimal yang diperlukan
            const hasNIS = student.nis || student.NIS;
            const hasName = student.nama || student["Nama Siswa"];

            if (!hasNIS && !hasName) {
              console.error("Student object missing essential data");
              console.error("Available keys:", Object.keys(student));
              showError("Data siswa tidak lengkap. Missing NIS and Name.");
              return;
            }

            renderStudentDetail(student);
          })
          .withFailureHandler(function (error) {
            const endTime = new Date().getTime();
            const duration = endTime - startTime;

            console.error("=== FAILURE HANDLER CALLED ===");
            console.error("Request duration:", duration + "ms");
            console.error("Error loading student detail:", error);
            console.error("Error type:", typeof error);
            console.error(
              "Error constructor:",
              error ? error.constructor.name : "No constructor"
            );

            let errorMessage = "Gagal memuat detail siswa";
            let debugInfo = "";

            if (error && error.message) {
              errorMessage += ": " + error.message;
              debugInfo += "Message: " + error.message + "\n";
            } else if (typeof error === "string") {
              errorMessage += ": " + error;
              debugInfo += "String error: " + error + "\n";
            } else {
              debugInfo += "Unknown error type: " + typeof error + "\n";
            }

            debugInfo += "NIS: " + studentId + "\n";
            debugInfo += "Session: " + sessionId + "\n";
            debugInfo += "Duration: " + duration + "ms";

            // Tampilkan error
            document.getElementById("detail-content").innerHTML = `
              <div class="error-container">
                <h3>❌ Error Memuat Data Siswa</h3>
                <p><strong>Pesan:</strong> ${errorMessage}</p>
                <div style="margin-top: 15px;">

                  <button class="btn btn-secondary" onclick="goBack()">📋 Kembali ke Daftar</button>
                </div>
              </div>
            `;
          })
          .getStudentById(studentId, sessionId);
      }

                       <div class="detail-value">   ${
                         student["Nama Prestasi (2)"]
                       } - ${student["Tingkat Prestasi (2)"] || "-"} - ${
                          student["Tahun Prestasi (2)"] || "-"
                        }</div>
                     </div>`
                      : ""
                  }
                  ${
                    student["Nama Prestasi (3)"] &&
                    student["Nama Prestasi (3)"] !== "-" &&
                    student["Nama Prestasi (3)"].trim() !== ""
                      ? `<div class="detail-row">
                    <div class="detail-value">    ${
                      student["Nama Prestasi (3)"]
                    } - ${student["Tingkat Prestasi (3)"] || "-"} - ${
                          student["Tahun Prestasi (3)"] || "-"
                        }</div>
                  </div>`
                      : ""
                  }
                  ${
                    student["Nama Prestasi (4)"] &&
                    student["Nama Prestasi (4)"] !== "-" &&
                    student["Nama Prestasi (4)"].trim() !== ""
                      ? `<div class="detail-row">
                       <div class="detail-value">   ${
                         student["Nama Prestasi (4)"]
                       } - ${student["Tingkat Prestasi (4)"] || "-"} - ${
                          student["Tahun Prestasi (4)"] || "-"
                        }</div>
                     </div>`
                      : ""
                  }
                  ${
                    student["Nama Prestasi (5)"] &&
                    student["Nama Prestasi (5)"] !== "-" &&
                    student["Nama Prestasi (5)"].trim() !== ""
                      ? `<div class="detail-row">
                       <div class="detail-value">   ${
                         student["Nama Prestasi (5)"]
                       } - ${student["Tingkat Prestasi (5)"] || "-"} - ${
                          student["Tahun Prestasi (5)"] || "-"
                        }</div>
                     </div>`
                      : ""
                  }
                  ${
                    (!student["Nama Prestasi"] ||
                      student["Nama Prestasi"] === "-" ||
                      student["Nama Prestasi"].trim() === "") &&
                    (!student["Nama Prestasi (2)"] ||
                      student["Nama Prestasi (2)"] === "-" ||
                      student["Nama Prestasi (2)"].trim() === "") &&
                    (
                      !student["Nama Prestasi (3)"] ||
                      student["Nama Prestasi (3)"] === "-" ||
                      student["Nama Prestasi (3)"].trim() === ""
                    )(
                      !student["Nama Prestasi (4)"] ||
                        student["Nama Prestasi (4)"] === "-" ||
                        student["Nama Prestasi (4)"].trim() === ""
                    )(
                      !student["Nama Prestasi (5)"] ||
                        student["Nama Prestasi (5)"] === "-" ||
                        student["Nama Prestasi (5))"].trim() === ""
                    )
                      ? `<div class="detail-row">
                       <div class="detail-value">Tidak ada prestasi</div>
                     </div>`
                      : ""
                  }
                  
                  <div class="detail-row">
                    <div class="detail-label">Beasiswa Siswa</div>
                  </div>
                  ${
                    student["Jenis Beasiswa"] &&
                    student["Jenis Beasiswa"] !== "-" &&
                    student["Jenis Beasiswa"].trim() !== ""
                      ? `<div class="detail-row">
                       <div class="detail-value">   ${
                         student["Jenis Beasiswa"]
                       } - ${student["Keterangan"] || "-"} - ${
                          student["Tahun Mulai"] || "-"
                        } s/d ${student["Tahun Selesai"] || "-"}</div>
                     </div>`
                      : ""
                  }
                  ${
                    student["Jenis Beasiswa (2)"] &&
                    student["Jenis Beasiswa (2)"] !== "-" &&
                    student["Jenis Beasiswa (2)"].trim() !== ""
                      ? `<div class="detail-row">
                       <div class="detail-value">   ${
                         student["Jenis Beasiswa (2)"]
                       } - ${student["Keterangan (2)"] || "-"} - ${
                          student["Tahun Mulai (2)"] || "-"
                        } s/d ${student["Tahun Selesai (2)"] || "-"}</div>
                     </div>`
                      : ""
                  }
                  ${
                    student["Jenis Beasiswa (3)"] &&
                    student["Jenis Beasiswa (3)"] !== "-" &&
                    student["Jenis Beasiswa (3)"].trim() !== ""
                      ? `<div class="detail-row">
                       <div class="detail-value">   ${
                         student["Jenis Beasiswa (3)"]
                       } - ${student["Keterangan (3)"] || "-"} - ${
                          student["Tahun Mulai (3)"] || "-"
                        } s/d ${student["Tahun Selesai (3)"] || "-"}</div>
                     </div>`
                      : ""
                  }
                  ${
                    (!student["Jenis Beasiswa"] ||
                      student["Jenis Beasiswa"] === "-" ||
                      student["Jenis Beasiswa"].trim() === "") &&
                    (!student["Jenis Beasiswa (2)"] ||
                      student["Jenis Beasiswa (2)"] === "-" ||
                      student["Jenis Beasiswa (2)"].trim() === "") &&
                    (!student["Jenis Beasiswa (3)"] ||
                      student["Jenis Beasiswa (3)"] === "-" ||
                      student["Jenis Beasiswa (3)"].trim() === "")
                      ? `<div class="detail-row">
                       <div class="detail-value">Tidak ada beasiswa</div>
                     </div>`
                      : ""
                  }

                </div>
              </div>
            </div>
          `;

          // Show action buttons
          document.getElementById("action-buttons").style.display = "block";

          // Setup edit button href (Opsi 1 - like navbar approach)
          const editButton = document.querySelector(".btn-edit-student");
          if (editButton && currentStudentId) {
            const sessionId = getSessionId();
            if (sessionId) {
              editButton.href =
                "<?= myURL() ?>?page=Student_edit&sessionId=" +
                encodeURIComponent(sessionId) +
                "&id=" +
                encodeURIComponent(currentStudentId);
            }
          }
        } catch (error) {
          console.error("Error rendering student detail:", error);
          showError("Gagal menampilkan detail siswa");
        }
      }

      // Initialize page
      document.addEventListener("DOMContentLoaded", function () {
        updateDateTime();
        const studentId = getStudentIdFromUrl();
        if (studentId) {
          loadStudentDetail(studentId);
        } else {
          showError("ID siswa tidak ditemukan dalam URL");
        }
      });
    </script>
  </body>
</html>
