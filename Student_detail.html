    <script>
      let currentStudentId = null;
      
      // Fungsi untuk toggle sidebar di tampilan mobile
      function toggleSidebar() {
        document.body.classList.toggle("sidebar-active");
      }

      // Fungsi untuk mengupdate tanggal
      function updateDateTime() {
        const now = new Date();
        const options = {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
        };
        document.getElementById("current-date").textContent =
          now.toLocaleDateString("id-ID", options);
      }

      // Get session ID
      function getSessionId() {
        // First try to get from hidden input
        const hiddenInput = document.getElementById("sessionId");
        if (hiddenInput && hiddenInput.value) {
          return hiddenInput.value;
        }
        
        // Fallback to URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get("sessionId");
      }

      // Get student ID from URL parameters or server-side template
      function getStudentIdFromUrl() {
        // First try to get from server-side template parameter
        const serverStudentId = '<?= typeof studentId !== "undefined" ? studentId : "" ?>';
        if (serverStudentId && serverStudentId !== '') {
          console.log('Student ID from server template:', serverStudentId);
          return serverStudentId;
        }
        
        // Fallback to URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const urlStudentId = urlParams.get("id");
        console.log('Student ID from URL parameters:', urlStudentId);
        return urlStudentId;
      }

      // Go back to students list
      function goBack() {
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = getSessionId();
        const baseUrl = window.location.origin + window.location.pathname;
        window.location.href = `${baseUrl}?page=Students_manage&sessionId=${sessionId}`;
      }

      // Edit student
      function editStudent() {
        if (!currentStudentId) {
          alert('ID siswa tidak tersedia');
          return;
        }
        
        try {
          const sessionId = getSessionId();
          if (!sessionId) {
            alert('Session tidak valid. Silakan login kembali.');
            return;
          }
          
          const baseUrl = window.location.origin + window.location.pathname;
          const editUrl = `${baseUrl}?page=Students_manage&sessionId=${encodeURIComponent(sessionId)}&edit=${encodeURIComponent(currentStudentId)}`;
          
          console.log('Navigating to edit page:', editUrl);
          window.location.href = editUrl;
        } catch (error) {
          console.error('Error in editStudent:', error);
          alert('Terjadi kesalahan saat membuka halaman edit');
        }
      }

      // Generate PDF
      function generatePDF() {
        if (!currentStudentId) {
          alert('ID siswa tidak tersedia');
          return;
        }
        
        try {
          const sessionId = getSessionId();
          if (!sessionId) {
            alert('Session tidak valid. Silakan login kembali.');
            return;
          }
          
          console.log("Generating PDF for student:", currentStudentId);
          
          // Show loading state
          const pdfButton = document.querySelector('.btn-info');
          const originalText = pdfButton.innerHTML;
          pdfButton.innerHTML = '<span class="btn-icon">⏳</span>Memproses...';
          pdfButton.disabled = true;
          
          // Call server-side function to generate PDF
          google.script.run
            .withSuccessHandler(function(pdfUrl) {
              // Reset button
              pdfButton.innerHTML = originalText;
              pdfButton.disabled = false;
              
              if (pdfUrl) {
                // Open PDF in new tab
                window.open(pdfUrl, '_blank');
              } else {
                alert('Gagal menghasilkan PDF');
              }
            })
            .withFailureHandler(function(error) {
              // Reset button
              pdfButton.innerHTML = originalText;
              pdfButton.disabled = false;
              
              console.error('Error generating PDF:', error);
              alert('Fitur cetak PDF sedang dalam pengembangan');
            })
            .getStudentPDFUrl(currentStudentId, sessionId);
            
        } catch (error) {
          console.error('Error in generatePDF:', error);
          alert('Terjadi kesalahan saat membuat PDF');
        }
      }

      // Load student detail
      function loadStudentDetail(studentId) {
        if (!studentId) {
          showError("ID siswa tidak ditemukan");
          return;
        }

        currentStudentId = studentId;
        console.log("Loading student detail for ID:", studentId);

        const sessionId = getSessionId();
        console.log("Session ID for request:", sessionId);

        google.script.run
          .withSuccessHandler(function (student) {
            console.log("Received student data:", student);

            if (!student) {
              showError("Data siswa tidak ditemukan");
              return;
            }

            renderStudentDetail(student);
          })
          .withFailureHandler(function (error) {
            console.error("Error loading student detail:", error);
            showError("Gagal memuat detail siswa: " + error);
          })
          .getStudentById(studentId, sessionId);
      }

      // Show error message

        document.getElementById("detail-content").innerHTML = `

            <h3>Error</h3>

        `;
      }

                      student.pekerjaanWali || "-"
                    }</div>
                  </div>
                  <div class="detail-row">
                    <div class="detail-label">Penghasilan Wali</div>
                    <div class="detail-value">${
                      student.penghasilanWali || "-"
                    }</div>
                  </div>
                </div>
              </div>
              
              <!-- Hobi dan Prestasi -->
              <div class="detail-section">
                <div class="section-header">
                  <h3 class="section-title">Hobi dan Prestasi</h3>
                </div>
                <div class="section-content">
                  <div class="detail-row">
                    <div class="detail-label">Hobi</div>
                    <div class="detail-value">${student.hobi || "-"}</div>
                  </div>
                  <div class="detail-row">
                    <div class="detail-label">Prestasi</div>
                    <div class="detail-value">${student.prestasi || "-"}</div>
                  </div>
                  <div class="detail-row">
                    <div class="detail-label">Beasiswa</div>
                    <div class="detail-value">${student.beasiswa || "-"}</div>
                  </div>
                </div>
              </div>
            </div>
          `;

          // Show action buttons
          document.getElementById("action-buttons").style.display = "block";
        } catch (error) {
          console.error("Error rendering student detail:", error);
          showError("Gagal menampilkan detail siswa");
        }
      }

      // Initialize page
      document.addEventListener('DOMContentLoaded', function() {
        updateDateTime();
        const studentId = getStudentIdFromUrl();
        if (studentId) {
          loadStudentDetail(studentId);
        } else {
          showError('ID siswa tidak ditemukan dalam URL');
        }
      });
    </script>
  </body>
</html>
