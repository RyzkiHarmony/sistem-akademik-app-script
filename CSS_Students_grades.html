<style>

  }

  .summary-card.warning {
    border-left-color: #f39c12;
  }

  .summary-card.success {
    border-left-color: #27ae60;
  }

    width: 50px;
    height: 50px;

    align-items: center;
    justify-content: center;
    background: #f8f9fa;
    border-radius: 10px;

    flex: 1;
  }

  .summary-title {
    font-size: 14px;
    color: #6c757d;
    font-weight: 500;
    margin-bottom: 5px;
  }

  .summary-value {
    font-size: 24px;
    font-weight: 700;
    color: #1a5276;
  }

  .summary-card.warning .summary-value {
    color: #f39c12;
  }

  .summary-card.success .summary-value {
    color: #27ae60;
  }

  .search-section {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    margin-bottom: 25px;
    border: 1px solid rgba(0, 0, 0, 0.05);
  }

  .search-container {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .search-box {
    flex: 2;
    min-width: 200px;
  }

  .filter-container {
    flex: 3;
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
  }

  .filter-container .form-group {
    flex: 1;
    min-width: 150px;
  }

      gap: 15px;
      margin-bottom: 15px;
    }

    .search-box {
      flex: 1;
      min-width: auto;

    .filter-container {
      flex: 1;
      flex-direction: column;
      gap: 12px;
    }

      margin-bottom: 10px;

      gap: 8px;
      margin-top: 10px;
    }

    .btn {
      padding: 12px 16px;
      min-width: auto;
      width: 100%;
      justify-content: center;
    }

    .page-title {
      padding-left: 10px;
      font-size: 20px;
    }

    .main-content {
      padding: 15px;
    }

    .filter-container .form-group {
      min-width: 150px;

  .form-group {
    margin-bottom: 15px;
  }

  .form-label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #2c3e50;
    font-size: 14px;
  }

    width: 100%;
    padding: 12px 15px;

    background: #fff;

    outline: none;
    border-color: #1a5276;
    box-shadow: 0 0 0 3px rgba(26, 82, 118, 0.1);

  .search-box.searching {
    position: relative;
  }

  .search-box.searching::after {
    content: "";

    top: 50%;
    right: 15px;
    width: 16px;
    height: 16px;
    border: 2px solid #1a5276;
    border-top: 2px solid transparent;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    transform: translateY(-50%);
  }

  @keyframes spin {
    0% {
      transform: translateY(-50%) rotate(0deg);
    }
    100% {
      transform: translateY(-50%) rotate(360deg);
    }
  }

  .search-box.searching .form-control {
    padding-right: 45px;
  }

  .btn-group {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  .btn {

    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;

  .student-table {

  .student-table td {

  }

    transition: opacity 0.3s ease;
  }

  .student-table th.sortable:hover:after {
    opacity: 0.8;
  }

  .student-table th.sorted-asc:after {
    content: "↑";
    opacity: 1;
    color: #3498db;
  }

  .student-table th.sorted-desc:after {
    content: "↓";
    opacity: 1;
    color: #3498db;
  }

  .student-table tr:last-child td {
    border-bottom: none;
  }

  .student-table tr:hover td {
    background-color: rgba(26, 82, 118, 0.02);
  }

    font-weight: 500;
