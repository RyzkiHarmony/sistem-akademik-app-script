<!-- CSS_Students_grades.html -->

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Quicksand", "Segoe UI", sans-serif;
  }

  body {
    background-color: #f8f9fa;
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
    flex-direction: column;
  }

  img {
    justify-content: center;
    align-items: center;
    max-width: 100%;
    max-height: 100%;
  }

  /* Sidebar */
  .sidebar {
    width: 250px;
    background: #1a5276;
    min-height: 100vh;
    color: white;
    transition: all 0.3s ease;
    box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
    z-index: 1000;
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
  }

  .sidebar-header {
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    margin-bottom: 20px;
  }

  .sidebar-logo {
    font-size: 24px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    text-decoration: none;
  }

  .sidebar-logo:before {
    content: "📚";
    margin-right: 10px;
  }

  .admin-info {
    display: flex;
    align-items: center;
    padding: 15px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    margin-bottom: 20px;
  }

  .admin-avatar {
    width: 40px;
    height: 40px;
    background: #f4d03f;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-right: 10px;
    font-size: 18px;
  }

  .admin-name {
    font-weight: 600;
    font-size: 14px;
  }

  .admin-role {
    font-size: 12px;
    opacity: 0.7;
  }

  .sidebar-menu {
    list-style: none;
    padding: 0;
  }

  .sidebar-menu li {
    margin-bottom: 5px;
  }

  .sidebar-menu a {
    display: flex;
    align-items: center;
    padding: 12px 20px;
    color: rgba(255, 255, 255, 0.8);
    text-decoration: none;
    transition: all 0.3s ease;
    font-size: 15px;
    border-left: 3px solid transparent;
  }

  .sidebar-menu a:hover,
  .sidebar-menu a.active {
    background: rgba(255, 255, 255, 0.08);
    color: white;
    border-left: 3px solid #f4d03f;
  }

  .sidebar-menu a:before {
    margin-right: 10px;
    font-size: 18px;
  }

  .menu-dashboard:before {
    content: "📊";
  }

  .menu-data:before {
    content: "👨‍🎓";
  }

  .menu-grades:before {
    content: "📝";
  }

  .menu-logout:before {
    content: "🚪";
  }

  .mobile-toggle {
    display: none;
    background: #1a5276;
    color: white;
    border: none;
    padding: 10px;
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 1001;
    border-radius: 8px;
    cursor: pointer;
    font-size: 20px;
  }

  /* Main Content */
  .main-content {
    flex: 1;
    padding: 25px;
    margin-left: 250px;
    transition: all 0.3s ease;
  }

  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    padding-bottom: 15px;
    border-bottom: 1px solid #e0e0e0;
  }

  .page-title {
    padding-left: 40px;
    font-size: 24px;
    font-weight: 600;
    color: #1a5276;
  }

  .page-date {
    font-size: 14px;
    color: #6c757d;
    font-weight: 500;
  }

  /* Search Section */
  .search-section {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    margin-bottom: 25px;
    border: 1px solid rgba(0, 0, 0, 0.05);
  }

  .search-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-bottom: 20px;
  }

  .search-box,
  .filter-container {
    display: flex;
    flex-direction: column;
  }

  .form-group {
    margin-bottom: 15px;
  }

  .form-label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #2c3e50;
    font-size: 14px;
  }

  .form-control {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #e9ecef;
    border-radius: 8px;
    font-size: 14px;
    transition: all 0.3s ease;
    background: #fff;
  }

  .form-control:focus {
    outline: none;
    border-color: #1a5276;
    box-shadow: 0 0 0 3px rgba(26, 82, 118, 0.1);
  }

  /* Real-time search styling */
  .search-box.searching {
    position: relative;
  }

  .search-box.searching::after {
    content: "";
    position: absolute;
    top: 50%;
    right: 15px;
    width: 16px;
    height: 16px;
    border: 2px solid #1a5276;
    border-top: 2px solid transparent;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    transform: translateY(-50%);
  }

  @keyframes spin {
    0% { transform: translateY(-50%) rotate(0deg); }
    100% { transform: translateY(-50%) rotate(360deg); }
  }

  .search-box.searching .form-control {
    padding-right: 45px;
  }

  .btn-group {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  .btn {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-width: 100px;
    justify-content: center;
  }

  .btn-primary {
    background: #1a5276;
    color: white;
  }

  .btn-primary:hover {
    background: #154360;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(26, 82, 118, 0.3);
  }

  .btn-secondary {
    background: #6c757d;
    color: white;
  }

  .btn-secondary:hover {
    background: #5a6268;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(108, 117, 125, 0.3);
  }

  .btn-info {
    background: #17a2b8;
    color: white;
  }

  .btn-info:hover {
    background: #138496;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(23, 162, 184, 0.3);
  }

  /* Results Container */
  .results-container {
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    overflow: hidden;
    border: 1px solid rgba(0, 0, 0, 0.05);
    min-height: 200px;
  }

  .search-info {
    padding: 40px 20px;
    text-align: center;
    color: #6c757d;
    font-size: 16px;
    background: #f8f9fa;
  }

  .search-info::before {
    content: "🔍";
    font-size: 48px;
    display: block;
    margin-bottom: 15px;
    opacity: 0.5;
  }

  .student-cards {
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 20px;
  }

  .student-card {
    background: white;
    border: 2px solid #e9ecef;
    border-radius: 12px;
    padding: 20px;
    transition: all 0.3s ease;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
  }

  .student-card:hover {
    border-color: #1a5276;
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(26, 82, 118, 0.15);
  }

  .student-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 15px;
    padding-bottom: 15px;
    border-bottom: 1px solid #e9ecef;
  }

  .student-info {
    flex: 1;
  }

  .student-name {
    font-size: 18px;
    font-weight: 700;
    color: #1a5276;
    margin-bottom: 5px;
  }

  .student-nis {
    font-size: 14px;
    color: #6c757d;
    font-weight: 500;
  }

  .student-card-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 20px;
  }

  .student-detail {
    display: flex;
    flex-direction: column;
  }

  .detail-label {
    font-size: 12px;
    color: #6c757d;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 5px;
  }

  .detail-value {
    font-size: 14px;
    color: #2c3e50;
    font-weight: 500;
  }

  .student-card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 15px;
    border-top: 1px solid #e9ecef;
  }

  .card-action-btn {
    padding: 8px 16px;
    background: #1a5276;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .card-action-btn:hover {
    background: #154360;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(26, 82, 118, 0.3);
  }

  .no-results {
    padding: 40px 20px;
    text-align: center;
    color: #6c757d;
  }

  .no-results::before {
    content: "❌";
    font-size: 48px;
    display: block;
    margin-bottom: 15px;
    opacity: 0.5;
  }

  .loading-results {
    padding: 40px 20px;
    text-align: center;
    color: #6c757d;
  }

  .loading-results::before {
    content: "⏳";
    font-size: 48px;
    display: block;
    margin-bottom: 15px;
    opacity: 0.5;
  }

  /* Action Buttons */
  .action-btn {
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin: 2px;
  }

  .btn-view {
    background: #17a2b8;
    color: white;
  }

  .btn-view:hover {
    background: #138496;
    transform: translateY(-1px);
    box-shadow: 0 2px 6px rgba(23, 162, 184, 0.3);
  }

  /* Status Badges */
  .status-badge {
    padding: 4px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .status-aktif {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
  }

  .status-lulus {
    background: #d1ecf1;
    color: #0c5460;
    border: 1px solid #bee5eb;
  }

  .status-mutasi {
    background: #fff3cd;
    color: #856404;
    border: 1px solid #ffeaa7;
  }

  .status-keluar {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
  }

  /* Pagination */
  .pagination {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    background: #f8f9fa;
    border-top: 1px solid #e9ecef;
  }

  .pagination-info {
    font-size: 14px;
    color: #6c757d;
    font-weight: 500;
  }

  .pagination-controls {
    display: flex;
    gap: 5px;
  }

  .pagination-btn {
    padding: 8px 12px;
    border: 1px solid #dee2e6;
    background: white;
    color: #495057;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 14px;
    text-decoration: none;
  }

  .pagination-btn:hover {
    background: #e9ecef;
    border-color: #adb5bd;
  }

  .pagination-btn.active {
    background: #1a5276;
    color: white;
    border-color: #1a5276;
  }

  .pagination-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Loading and Empty States */
  .loading-state,
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #6c757d;
  }

  .loading-state {
    font-size: 16px;
  }

  .empty-state {
    font-size: 14px;
  }

  .empty-state::before {
    content: "📝";
    font-size: 48px;
    display: block;
    margin-bottom: 15px;
    opacity: 0.5;
  }

  /* Media Queries */
  @media (max-width: 768px) {
    .sidebar {
      transform: translateX(-100%);
    }

    .main-content {
      margin-left: 0;
      padding: 15px;
    }

    .mobile-toggle {
      display: block;
    }

    body.sidebar-active .sidebar {
      transform: translateX(0);
    }

    body.sidebar-active .mobile-toggle {
      left: 260px;
    }

    body.sidebar-active .main-content {
      transform: translateX(250px);
    }

    .search-container {
      gap: 10px;
    }

    .student-cards {
      grid-template-columns: 1fr;
      padding: 15px;
      gap: 15px;
    }

    .student-card-body {
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .btn-group {
      justify-content: center;
      flex-wrap: wrap;
    }

    .page-header {
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    .page-title {
      padding-left: 0;
      font-size: 20px;
    }

    .student-card {
      padding: 15px;
    }

    .student-name {
      font-size: 16px;
    }

    .card-action-btn {
      padding: 6px 12px;
      font-size: 12px;
    }

    .pagination {
      flex-direction: column;
      gap: 15px;
    }

    .pagination-controls {
      justify-content: center;
      flex-wrap: wrap;
    }
  }

  @media (max-width: 480px) {
    .student-cards {
      padding: 10px;
    }

    .student-card {
      padding: 12px;
    }

    .student-card-body {
      gap: 8px;
    }

    .detail-label {
      font-size: 11px;
    }

    .detail-value {
      font-size: 13px;
    }
  }
</style>
