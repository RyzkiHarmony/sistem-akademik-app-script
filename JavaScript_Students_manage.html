<script>
  // JavaScript_Students.html
  // Get session ID
  function getSessionId() {
    // First try to get from hidden input
    const hiddenInput = document.getElementById("sessionId");
    if (hiddenInput && hiddenInput.value) {
      return hiddenInput.value;
    }

    // Fallback to URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get("sessionId");
  }
  // Variabel global
  let allStudents = [];
  let filteredStudents = [];
  let currentPage = 1;
  let itemsPerPage = 10;
  let currentSortField = "nis";
  let currentSortDirection = "asc";
  let studentToDelete = null;
  let isLoading = false; // Status loading

  // Real-time search variables
  let searchTimeout = null;
  let lastSearchQuery = "";

  // Progress tracking variables
  let progressModal = null;
  let progressBar = null;
  let progressText = null;

  // Fungsi untuk toggle sidebar di tampilan mobile
  function toggleSidebar() {
    document.body.classList.toggle("sidebar-active");
  }

  // Fungsi untuk mengupdate tanggal
  function updateDateTime() {
    const now = new Date();
    const options = {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric",
    };
    document.getElementById("current-date").textContent =
      now.toLocaleDateString("id-ID", options);
  }

  // Fungsi untuk memuat data siswa dari server dengan pagination server-side
  function loadStudents() {
    // Tampilkan loading state
    document.getElementById("students-table-body").innerHTML =
      "<tr><td colspan='8' style='text-align: center;'><div style='padding: 20px;'><span style='color: #1a5276; font-weight: 600;'>⏳ Memuat data siswa...</span></div></td></tr>";

    // Update pagination info dengan loading state
    document.getElementById("pagination-info").textContent = "Memuat data...";

    // Siapkan opsi untuk pagination dan optimasi data
    const options = {
      page: currentPage,
      limit: itemsPerPage,
      searchQuery: document.getElementById("search-input").value.toLowerCase(),
      statusFilter: document.getElementById("filter-status").value,
      sortField: currentSortField,
      sortDirection: currentSortDirection,
      fieldsToReturn: ["nis", "nama", "gender", "tanggalDaftar", "status"], // Terbatas
    };

    // Panggil fungsi server untuk mendapatkan data siswa dengan pagination
    google.script.run
      .withSuccessHandler(function (result) {
        try {
          // Validasi hasil dari server
          if (!result || typeof result !== "object") {
            throw new Error("Data tidak valid dari server");
          }

          // Simpan data siswa ke variabel global
          allStudents = result.students || [];
          filteredStudents = result.students || []; // Tidak perlu filter lagi karena sudah difilter di server

          // Update pagination info
          currentPage = result.currentPage || 1;
          const totalPages = result.totalPages || 1;
          const totalCount = result.totalCount || 0;

          // Render halaman
          renderStudentsTable(
            result.students || [],
            result.currentPage || 1,
            totalPages,
            totalCount
          );

          // Update sort indicators
          updateSortIndicators();

          // Re-enable pagination controls
          enablePaginationControls();
        } catch (error) {
          document.getElementById(
            "students-table-body"
          ).innerHTML = `<tr><td colspan='8' style='text-align: center; color: #e74c3c; padding: 20px;'>Error memproses data: ${error.message}</td></tr>`;
          showNotification(
            "Gagal memproses data siswa: " + error.message,
            "error"
          );
          enablePaginationControls();
        } finally {
          // Sembunyikan loading indicator
          hideLoadingIndicator();
          isLoading = false;
        }
      })
      .withFailureHandler(function (error) {
        document.getElementById(
          "students-table-body"
        ).innerHTML = `<tr><td colspan='8' style='text-align: center; color: #e74c3c; padding: 20px;'>❌ Error: ${error}</td></tr>`;
        document.getElementById("pagination-info").textContent =
          "Error memuat data";
        showNotification("Gagal memuat data siswa: " + error, "error");
        enablePaginationControls();
        // Sembunyikan loading indicator
        hideLoadingIndicator();
        isLoading = false;
      })
      .getAllStudents(options);
  }

  // Function to re-enable pagination controls after loading
  function enablePaginationControls() {
    const paginationControls = document.getElementById("pagination-controls");
    if (paginationControls) {
      const buttons = paginationControls.querySelectorAll("button");
      buttons.forEach((btn) => {
        // Only enable if not supposed to be disabled
        if (!btn.hasAttribute("data-should-be-disabled")) {
          btn.disabled = false;
          btn.style.opacity = "";
        }
      });
    }
  }

  // Fungsi untuk menampilkan loading indicator
  function showLoadingIndicator() {
    const searchBtn = document.getElementById("search-btn");
    const searchInput = document.getElementById("search-input");
    const searchBox = document.querySelector(".search-box");

    if (searchBtn) {
      searchBtn.disabled = true;
      searchBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mencari...';
    }

    if (searchInput) {
      searchInput.style.opacity = "0.7";
    }

    if (searchBox) {
      searchBox.classList.add("searching");
    }
  }

  // Fungsi untuk menyembunyikan loading indicator
  function hideLoadingIndicator() {
    const searchBtn = document.getElementById("search-btn");
    const searchInput = document.getElementById("search-input");
    const searchBox = document.querySelector(".search-box");

    if (searchBtn) {
      searchBtn.disabled = false;
      searchBtn.innerHTML = '<i class="fas fa-search"></i> Cari';
    }

    if (searchInput) {
      searchInput.style.opacity = "1";
    }

    if (searchBox) {
      searchBox.classList.remove("searching");
    }
  }

  // Real-time search dengan debouncing
  function setupRealTimeSearch() {
    const searchInput = document.getElementById("search-input");

    if (searchInput) {
      searchInput.addEventListener("input", function (e) {
        const query = e.target.value.trim();

        // Clear previous timeout
        if (searchTimeout) {
          clearTimeout(searchTimeout);
        }

        // Only search if query changed
        if (query === lastSearchQuery) {
          return;
        }

        lastSearchQuery = query;

        // Show real-time feedback
        const searchBox = document.querySelector(".search-box");
        if (searchBox) {
          searchBox.classList.add("searching");
        }

        // Debounce search - wait 500ms after user stops typing
        searchTimeout = setTimeout(() => {
          currentPage = 1; // Reset to first page
          loadStudents();

          // Remove searching class after search completes
          setTimeout(() => {
            if (searchBox) {
              searchBox.classList.remove("searching");
            }
          }, 300);
        }, 500);
      });

      // Handle Enter key for immediate search
      searchInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          if (searchTimeout) {
            clearTimeout(searchTimeout);
          }
          currentPage = 1;
          loadStudents();
        }
      });
    }
  }

  // Calculate student statistics for enhanced preview
  function calculateStudentStatistics(students) {
    const stats = {
      total: students.length,
      male: 0,
      female: 0,
      years: new Set(),
    };

    students.forEach((student) => {
      if (student.gender === "Laki-laki" || student.gender === "L") {
        stats.male++;
      } else if (student.gender === "Perempuan" || student.gender === "P") {
        stats.female++;
      }

      // Extract year from tanggalDaftar
      if (student.tanggalDaftar) {
        const year = new Date(student.tanggalDaftar).getFullYear();
        if (!isNaN(year)) {
          stats.years.add(year);
        }
      }
    });

    // Create year range string
    const yearArray = Array.from(stats.years).sort();
    stats.yearRange =
      yearArray.length > 0
        ? yearArray.length === 1
          ? yearArray[0].toString()
          : `${yearArray[0]} - ${yearArray[yearArray.length - 1]}`
        : "N/A";

    return stats;
  }

  // Generate enhanced preview with better formatting
  function generateEnhancedPreview(students, stats) {
    let html = '<div class="preview-list">';

    students.forEach((student, index) => {
      const genderIcon =
        student.gender === "Laki-laki" || student.gender === "L" ? "👨" : "👩";
      const entryYear = student.tanggalDaftar
        ? new Date(student.tanggalDaftar).getFullYear()
        : "N/A";

      const genderText =
        student.gender === "Laki-laki" || student.gender === "L"
          ? "Laki-laki"
          : "Perempuan";
      const statusText = student.status || "Aktif";

      html += `
        <div class="preview-item">
          <div class="preview-student-info">
            <div class="preview-number">${index + 1}</div>
            <div class="preview-student-details">
              <div class="preview-student-name">${student.nama}</div>
              <div class="preview-student-id">${student.nis}</div>
              <div class="preview-student-meta">
                <span class="preview-gender">${genderIcon} ${genderText}</span>
                <span class="preview-status">📋 ${statusText}</span>
              </div>
            </div>
          </div>
          <div class="preview-year">📅 ${entryYear}</div>
        </div>
      `;
    });

    html += "</div>";
    return html;
  }

  // Create and show progress modal
  function createProgressModal() {
    const modalHtml = `
      <div id="progress-modal" class="modal-overlay" style="display: flex;">
        <div class="modal" style="max-width: 400px;">
          <div class="modal-header">
            <h3 class="modal-title">🔄 Memproses Batch Update</h3>
          </div>
          <div class="modal-body">
            <div style="margin-bottom: 15px;">
              <div id="progress-text" style="text-align: center; margin-bottom: 10px; font-weight: 500;">
                Memulai proses...
              </div>
              <div style="background: #f8f9fa; border-radius: 10px; overflow: hidden; height: 20px;">
                <div id="progress-bar" style="background: linear-gradient(90deg, #3498db, #2ecc71); height: 100%; width: 0%; transition: width 0.3s ease; border-radius: 10px;"></div>
              </div>
              <div style="text-align: center; margin-top: 5px; font-size: 12px; color: #666;">
                <span id="progress-percentage">0%</span>
              </div>
            </div>
            <div id="progress-details" style="font-size: 14px; color: #666; text-align: center;">
              Mohon tunggu, jangan tutup halaman ini...
            </div>
          </div>
        </div>
      </div>
    `;

    document.body.insertAdjacentHTML("beforeend", modalHtml);

    progressModal = document.getElementById("progress-modal");
    progressBar = document.getElementById("progress-bar");
    progressText = document.getElementById("progress-text");

    return {
      modal: progressModal,
      bar: progressBar,
      text: progressText,
      percentage: document.getElementById("progress-percentage"),
      details: document.getElementById("progress-details"),
    };
  }

  // Update progress
  function updateProgress(percentage, text, details) {
    if (progressBar) {
      progressBar.style.width = percentage + "%";
    }
    if (progressText) {
      progressText.textContent = text;
    }
    if (document.getElementById("progress-percentage")) {
      document.getElementById("progress-percentage").textContent =
        percentage + "%";
    }
    if (details && document.getElementById("progress-details")) {
      document.getElementById("progress-details").textContent = details;
    }
  }

  // Close progress modal
  function closeProgressModal() {
    if (progressModal) {
      progressModal.remove();
      progressModal = null;
      progressBar = null;
      progressText = null;
    }
  }

  // Filter dan sort data siswa - sekarang dilakukan di server
  function applyFiltersAndSort() {
    // Reset ke halaman pertama saat filter berubah
    currentPage = 1;

    // Muat ulang data dengan filter baru
    loadStudents();
  }

  // Fungsi untuk menampilkan data siswa dengan pagination server-side
  function renderStudentsTable(students, currentPage, totalPages, totalCount) {
    const tableBody = document.getElementById("students-table-body");

    // Check if no data
    if (students.length === 0) {
      tableBody.innerHTML =
        "<tr><td colspan='8' style='text-align: center;'>Tidak ada data siswa</td></tr>";
      document.getElementById("pagination-info").textContent = "Tidak ada data";
      document.getElementById("pagination-controls").innerHTML = "";
      return;
    }

    // Clear table
    tableBody.innerHTML = "";

    // Calculate start index for numbering
    const startIndex = (currentPage - 1) * itemsPerPage;

    // Add rows
    students.forEach((student, index) => {
      const row = document.createElement("tr");

      // Create status badge
      const statusBadge = getStatusBadge(student.status);

      row.innerHTML = `
        <td>${startIndex + index + 1}</td>
        <td>${student.nis || "-"}</td>
        <td class="student-name">${student.nama || "-"}</td>
        <td>${student.gender || "-"}</td>
        <td>${student.tanggalDaftar || "-"}</td>
        <td>${statusBadge}</td>
        <td class="action-buttons">
          <a href="#" class="btn btn-sm btn-primary btn-view" data-id="${
            student.nis
          }">Lihat</a>
          <a href="#" class="btn btn-sm btn-warning btn-edit" data-id="${
            student.nis
          }">Edit</a>
          <button class="btn btn-sm btn-danger btn-delete" data-id="${
            student.nis
          }">Hapus</button>
        </td>
      `;

      tableBody.appendChild(row);
    });

    // Update pagination info
    document.getElementById("pagination-info").textContent = `Menampilkan ${
      startIndex + 1
    }-${startIndex + students.length} dari ${totalCount} siswa`;

    // Update pagination controls
    renderServerPaginationControls(currentPage, totalPages);

    // Setup action buttons
    setupActionButtons();
  }

  // Fungsi untuk mengubah jumlah item per halaman
  function changeItemsPerPage(newItemsPerPage) {
    itemsPerPage = newItemsPerPage;
    currentPage = 1; // Reset ke halaman pertama
    loadStudents();
  }

  // Render pagination controls untuk server-side pagination
  function renderServerPaginationControls(currentPageParam, totalPages) {
    const paginationControls = document.getElementById("pagination-controls");

    // Clear current controls
    paginationControls.innerHTML = "";

    // Update global currentPage variable
    currentPage = currentPageParam;

    // No pagination needed if only one page
    if (totalPages <= 1) {
      return;
    }

    // Previous button
    const prevButton = document.createElement("button");
    prevButton.innerHTML = "&laquo; Sebelumnya";
    prevButton.className = "pagination-btn prev-btn";
    prevButton.disabled = currentPage === 1;
    if (currentPage === 1) {
      prevButton.setAttribute("data-should-be-disabled", "true");
    }
    prevButton.addEventListener("click", (e) => {
      e.preventDefault();
      if (currentPage > 1) {
        goToPage(currentPage - 1);
      }
    });
    paginationControls.appendChild(prevButton);

    // First page button (if not in visible range)
    const maxVisiblePages = 5;
    let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
    let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

    // Adjust if we're near the end
    if (endPage - startPage + 1 < maxVisiblePages && startPage > 1) {
      startPage = Math.max(1, endPage - maxVisiblePages + 1);
    }

    // Add first page and ellipsis if needed
    if (startPage > 1) {
      const firstPageButton = document.createElement("button");
      firstPageButton.textContent = "1";
      firstPageButton.className = "pagination-btn page-btn";
      firstPageButton.addEventListener("click", (e) => {
        e.preventDefault();
        goToPage(1);
      });
      paginationControls.appendChild(firstPageButton);

      if (startPage > 2) {
        const ellipsis = document.createElement("span");
        ellipsis.textContent = "...";
        ellipsis.className = "pagination-ellipsis";
        paginationControls.appendChild(ellipsis);
      }
    }

    // Page numbers
    for (let i = startPage; i <= endPage; i++) {
      const pageButton = document.createElement("button");
      pageButton.textContent = i;
      pageButton.className = "pagination-btn page-btn";

      if (i === currentPage) {
        pageButton.classList.add("active");
        pageButton.setAttribute("aria-current", "page");
      }

      pageButton.addEventListener("click", (e) => {
        e.preventDefault();
        if (i !== currentPage) {
          goToPage(i);
        }
      });

      paginationControls.appendChild(pageButton);
    }

    // Add last page and ellipsis if needed
    if (endPage < totalPages) {
      if (endPage < totalPages - 1) {
        const ellipsis = document.createElement("span");
        ellipsis.textContent = "...";
        ellipsis.className = "pagination-ellipsis";
        paginationControls.appendChild(ellipsis);
      }

      const lastPageButton = document.createElement("button");
      lastPageButton.textContent = totalPages;
      lastPageButton.className = "pagination-btn page-btn";
      lastPageButton.addEventListener("click", (e) => {
        e.preventDefault();
        goToPage(totalPages);
      });
      paginationControls.appendChild(lastPageButton);
    }

    // Next button
    const nextButton = document.createElement("button");
    nextButton.innerHTML = "Selanjutnya &raquo;";
    nextButton.className = "pagination-btn next-btn";
    nextButton.disabled = currentPage === totalPages;
    if (currentPage === totalPages) {
      nextButton.setAttribute("data-should-be-disabled", "true");
    }
    nextButton.addEventListener("click", (e) => {
      e.preventDefault();
      if (currentPage < totalPages) {
        goToPage(currentPage + 1);
      }
    });
    paginationControls.appendChild(nextButton);
  }

  // Function to navigate to specific page
  function goToPage(pageNumber) {
    if (pageNumber < 1) {
      pageNumber = 1;
    }

    // Validate page number
    if (pageNumber !== currentPage && pageNumber >= 1) {
      currentPage = pageNumber;

      // Show loading state for pagination controls
      const paginationControls = document.getElementById("pagination-controls");
      if (paginationControls) {
        const buttons = paginationControls.querySelectorAll("button");
        buttons.forEach((btn) => {
          // Store original disabled state
          if (btn.disabled) {
            btn.setAttribute("data-should-be-disabled", "true");
          } else {
            btn.removeAttribute("data-should-be-disabled");
          }

          // Disable all buttons during loading
          btn.disabled = true;
          btn.style.opacity = "0.6";
        });
      }

      // Load new page data
      loadStudents();
    }
  }

  // Helper function untuk mendapatkan badge status
  function getStatusBadge(status) {
    switch (status?.toLowerCase()) {
      case "aktif":
        return '<span class="badge badge-success">Aktif</span>';
      case "lulus":
        return '<span class="badge badge-primary">Lulus</span>';
      case "mutasi":
        return '<span class="badge badge-warning">Mutasi</span>';
      case "keluar":
        return '<span class="badge badge-danger">Keluar</span>';
    }
  }

  // Event delegation handler removed - now handled directly in DOMContentLoaded

  // Setup action buttons
  function setupActionButtons() {
    console.log("Setting up action buttons...");

    // Debug: Check if delete buttons exist
    const deleteButtons = document.querySelectorAll(".btn-delete");
    console.log("Found delete buttons:", deleteButtons.length);

    // Remove any existing event listeners to prevent duplicates
    deleteButtons.forEach((button) => {
      // Clone the button to remove all event listeners
      const newButton = button.cloneNode(true);
      button.parentNode.replaceChild(newButton, button);
    });

    // Re-query after cloning
    const freshDeleteButtons = document.querySelectorAll(".btn-delete");

    // View student button - Setup both href and click handler
    document.querySelectorAll(".btn-view").forEach(function (button) {
      const studentId = button.getAttribute("data-id");
      const sessionId = getSessionId();

      // Set href like navbar approach (Opsi 1)
      if (sessionId && studentId) {
        button.href =
          "<?= myURL() ?>?page=Student_detail&sessionId=" +
          encodeURIComponent(sessionId) +
          "&id=" +
          encodeURIComponent(studentId);
      }

      // Keep click handler as backup (Opsi 2)
      button.addEventListener("click", function (event) {
        const studentId = this.getAttribute("data-id");

        openDetailStudent(studentId, event);
      });
    });

    // Edit student button
    document.querySelectorAll(".btn-edit").forEach(function (button) {
      const studentId = button.getAttribute("data-id");
      const sessionId = getSessionId();

      // Set href like navbar approach (Opsi 1)
      if (sessionId && studentId) {
        button.href =
          "<?= myURL() ?>?page=Student_edit&sessionId=" +
          encodeURIComponent(sessionId) +
          "&id=" +
          encodeURIComponent(studentId);
      }

      // Keep click handler as backup (Opsi 2)
      button.addEventListener("click", function (event) {
        const studentId = this.getAttribute("data-id");

        openEditStudent(studentId, event);
      });
    });

    // Setup delete buttons with direct event listeners
    freshDeleteButtons.forEach((button, index) => {
      console.log(`Setting up delete button ${index + 1}:`, button);

      button.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        const studentId = this.getAttribute("data-id");
        console.log("Delete button clicked for student:", studentId);
        console.log("Button element:", this);

        // Add visual feedback
        this.style.transform = "scale(0.95)";
        setTimeout(() => {
          this.style.transform = "";
        }, 150);

        openDeleteModal(studentId);
      });

      // Add additional debugging
      button.addEventListener("mousedown", function () {
        console.log("Delete button mousedown event");
      });

      button.addEventListener("mouseup", function () {
        console.log("Delete button mouseup event");
      });
    });
  }

  // Open student detail page
  function openDetailStudent(studentId, event) {
    // Only prevent default if href is not properly set (fallback mode)
    const button = event ? event.target : null;
    const hasValidHref =
      button &&
      button.href &&
      button.href !== "#" &&
      !button.href.endsWith("#");

    if (event && !hasValidHref) {
      event.preventDefault();
    }

    // If href is properly set, let the browser handle navigation naturally
    if (hasValidHref) {
      return; // Let the href handle navigation
    }

    // Fallback navigation for cases where href is not set
    if (!studentId) {
      showNotification("ID siswa tidak valid", "error");
      return;
    }

    try {
      // Get current session ID from URL
      const sessionId = getSessionId();

      // Navigate to student detail page with proper Google Apps Script URL format
      const detailUrl =
        "<?= myURL() ?>?page=Student_detail&sessionId=" +
        encodeURIComponent(sessionId) +
        "&id=" +
        encodeURIComponent(studentId);

      // Direct redirect without delay to ensure URL changes immediately
      window.location.href = detailUrl;
    } catch (error) {
      showNotification("Terjadi kesalahan saat membuka detail siswa", "error");
    }
  }

  // Open page to edit student
  function openEditStudent(studentId, event) {
    // Only prevent default if href is not properly set (fallback mode)
    const button = event ? event.target : null;
    const hasValidHref =
      button &&
      button.href &&
      button.href !== "#" &&
      !button.href.endsWith("#");

    if (event && !hasValidHref) {
      event.preventDefault();
    }

    // If href is properly set, let the browser handle navigation naturally
    if (hasValidHref) {
      return; // Let the href handle navigation
    }

    // Fallback navigation for cases where href is not set
    if (!studentId) {
      showNotification("ID siswa tidak valid", "error");
      return;
    }

    try {
      // Get current session ID from URL
      const sessionId = getSessionId();

      // Navigate to student edit page with proper Google Apps Script URL format
      const editUrl =
        "<?= myURL() ?>?page=Student_edit&sessionId=" +
        encodeURIComponent(sessionId) +
        "&id=" +
        encodeURIComponent(studentId);

      // Direct redirect without delay to ensure URL changes immediately
      window.location.href = editUrl;
    } catch (error) {
      showNotification("Terjadi kesalahan saat membuka edit siswa", "error");
    }
  }

  // Open delete confirmation modal
  function openDeleteModal(studentId) {
    // Validate studentId
    if (!studentId) {
      showNotification("ID siswa tidak valid", "error");
      return;
    }

    const student = allStudents.find((s) => s.nis == studentId);

    if (!student) {
      showNotification("Data siswa tidak ditemukan", "error");
      return;
    }

    // Store student to delete
    studentToDelete = student;

    // Show student info with more details
    document.getElementById("student-to-delete-info").innerHTML = `
      <div class="student-delete-details">
        <div><strong>NIS:</strong> ${student.nis || "-"}</div>
        <div><strong>Nama:</strong> ${student.nama || "-"}</div>
        <div><strong>Status:</strong> ${student.status || "-"}</div>
      </div>
      <div class="delete-warning">
        <i class="icon-warning"></i>
        <small>Semua data terkait siswa ini akan dihapus permanen termasuk data nilai dan raport.</small>
      </div>
    `;

    // Reset modal state
    document.getElementById("confirm-delete-btn").disabled = false;
    document.getElementById("confirm-delete-btn").textContent = "Hapus Data";

    // Show modal
    document.getElementById("delete-modal").style.display = "flex";

    // Focus on cancel button for better UX
    setTimeout(() => {
      document.getElementById("cancel-delete-btn").focus();
    }, 100);
  }

  // Delete student data
  function deleteStudent() {
    if (!studentToDelete || !studentToDelete.nis) {
      showNotification("Tidak ada data siswa yang dipilih", "error");
      return;
    }

    // Show loading state
    const confirmBtn = document.getElementById("confirm-delete-btn");
    const cancelBtn = document.getElementById("cancel-delete-btn");
    const closeBtn = document.getElementById("close-delete-modal");

    confirmBtn.disabled = true;
    cancelBtn.disabled = true;
    closeBtn.disabled = true;
    confirmBtn.innerHTML =
      '<i class="fas fa-spinner fa-spin"></i> Menghapus...';

    // Store student info for success message
    const studentName = studentToDelete.nama;
    const studentNis = studentToDelete.nis;

    // Call server function to delete student
    google.script.run
      .withSuccessHandler(function (result) {
        if (result && result.success) {
          showNotification(
            `Data siswa ${studentName} (NIS: ${studentNis}) berhasil dihapus`,
            "success"
          );
          closeDeleteModal();

          // Reload data and maintain current page if possible
          const currentPageBackup = currentPage;
          loadStudents();

          // If current page becomes empty, go to previous page
          setTimeout(() => {
            if (filteredStudents.length === 0 && currentPageBackup > 1) {
              currentPage = currentPageBackup - 1;
              loadStudents();
            }
          }, 500);
        } else {
          const errorMessage =
            result && result.message
              ? result.message
              : "Gagal menghapus data siswa";
          showNotification(errorMessage, "error");
          resetDeleteButton();
        }
      })
      .withFailureHandler(function (error) {
        console.error("Delete student error:", error);
        showNotification(
          "Terjadi kesalahan saat menghapus data siswa: " + error,
          "error"
        );
        resetDeleteButton();
      })
      .deleteStudent(studentToDelete.nis);
  }

  // Helper function to reset delete button state
  function resetDeleteButton() {
    const confirmBtn = document.getElementById("confirm-delete-btn");
    const cancelBtn = document.getElementById("cancel-delete-btn");
    const closeBtn = document.getElementById("close-delete-modal");

    if (confirmBtn) {
      confirmBtn.disabled = false;
      confirmBtn.textContent = "Hapus Data";
    }
    if (cancelBtn) {
      cancelBtn.disabled = false;
    }
    if (closeBtn) {
      closeBtn.disabled = false;
    }
  }

  // Toggle form fields enabled/disabled
  function toggleFormEnabled(enabled) {
    const form = document.getElementById("student-form");
    const formElements = form.elements;

    for (let i = 0; i < formElements.length; i++) {
      formElements[i].disabled = !enabled;
    }

    document.getElementById("save-btn").disabled = !enabled;

    if (!enabled) {
      document.getElementById("save-btn").textContent = "Menyimpan...";
    } else {
      document.getElementById("save-btn").textContent = "Simpan Data";
    }
  }

  // Reset search and filters (mengadaptasi dari file_old)
  function resetFilters() {
    document.getElementById("search-input").value = "";
    document.getElementById("filter-status").value = "";

    // Apply filters
    applyFiltersAndSort();
  }

  // Sort table by column (mengadaptasi dari file_old)
  function sortTable(field) {
    if (field === currentSortField) {
      // Toggle direction if same field
      currentSortDirection = currentSortDirection === "asc" ? "desc" : "asc";
    } else {
      // New field, default to ascending
      currentSortField = field;
      currentSortDirection = "asc";
    }

    // Apply sort
    applyFiltersAndSort();
  }

  // Update sort indicators on table headers
  function updateSortIndicators() {
    // Remove all existing sort classes
    document.querySelectorAll(".student-table th").forEach((th) => {
      th.classList.remove("sorted-asc", "sorted-desc");
    });

    // Add sort class to current sorted column
    const fieldMap = {
      nis: 1,
      nama: 2,
      gender: 3,
      tanggalDaftar: 4,
      status: 5,
    };

    const columnIndex = fieldMap[currentSortField];
    if (columnIndex) {
      const headers = document.querySelectorAll(".student-table th");
      if (headers[columnIndex]) {
        const sortClass =
          currentSortDirection === "asc" ? "sorted-asc" : "sorted-desc";
        headers[columnIndex].classList.add(sortClass);
      }
    }
  }

  // Show notification
  function showNotification(message, type) {
    // Create notification element if it doesn't exist
    let notification = document.querySelector(".notification");

    if (!notification) {
      notification = document.createElement("div");
      notification.className = "notification";
      document.body.appendChild(notification);
    }

    // Set content and type
    notification.textContent = message;
    notification.className = `notification notification-${type}`;

    // Show notification
    setTimeout(() => {
      notification.classList.add("show");
    }, 10);

    // Hide after 3 seconds
    setTimeout(() => {
      notification.classList.remove("show");
    }, 4000);
  }

  function closeDeleteModal() {
    const modal = document.getElementById("delete-modal");
    if (modal) {
      modal.style.display = "none";
    }

    // Reset state
    studentToDelete = null;

    // Reset all button states
    resetDeleteButton();

    // Clear student info
    const studentInfo = document.getElementById("student-to-delete-info");
    if (studentInfo) {
      studentInfo.innerHTML = "";
    }
  }

  // Function to close graduation batch modal - adapted from file_old
  function closeGraduationBatchModal() {
    document.getElementById("graduation-batch-modal").style.display = "none";
    // Reset form
    document.getElementById("filter-type").value = "specific-date";
    document.getElementById("entry-specific-date").value = "";
    document.getElementById("entry-start-date").value = "";
    document.getElementById("entry-end-date").value = "";
    document.getElementById("entry-year").value = "";
    document.getElementById("new-status").value = "Lulus";
    document.getElementById("graduation-date").value = "";
    document.getElementById("batch-notes").value = "";
    document.getElementById("preview-container").style.display = "none";
    document.getElementById("process-btn").disabled = true;
    // Show specific date filter by default
    document.querySelectorAll(".filter-option").forEach((el) => {
      el.style.display = "none";
    });
    document.getElementById("specific-date-filter").style.display = "block";
  }

  // Setup logout button
  function setupLogout() {
    document
      .getElementById("logout-link")
      .addEventListener("click", function (e) {
        e.preventDefault();

        if (confirm("Apakah Anda yakin ingin logout?")) {
          google.script.run
            .withSuccessHandler(function (url) {
              window.location.href = url;
            })
            .logout();
        }
      });
  }

  // Document ready
  document.addEventListener("DOMContentLoaded", function () {
    // Update tanggal
    updateDateTime();

    // Load data siswa
    loadStudents();

    // Initialize sort indicators after a short delay
    setTimeout(() => {
      updateSortIndicators();
      // Setup action buttons after table is rendered
      setupActionButtons();
    }, 500);

    // Setup event listeners for search and filter (mengadaptasi dari file_old)
    document
      .getElementById("search-btn")
      .addEventListener("click", function () {
        applyFiltersAndSort();
      });

    // Event listener untuk pencarian dengan Enter key (dari file_old)
    document
      .getElementById("search-input")
      .addEventListener("keyup", function (event) {
        if (event.key === "Enter") {
          applyFiltersAndSort();
        }
      });

    // Status filter change event (dari file_old)
    document
      .getElementById("filter-status")
      .addEventListener("change", function () {
        applyFiltersAndSort();
      });

    // Reset button event (dari file_old)
    document.getElementById("reset-btn").addEventListener("click", function () {
      resetFilters();
    });

    // Setup delete modal events
    document
      .getElementById("close-delete-modal")
      .addEventListener("click", function () {
        closeDeleteModal();
      });

    document
      .getElementById("cancel-delete-btn")
      .addEventListener("click", function () {
        closeDeleteModal();
      });

    document
      .getElementById("confirm-delete-btn")
      .addEventListener("click", function () {
        deleteStudent();
      });

    // Setup table header sorting (mengadaptasi dari file_old)
    document
      .querySelectorAll(".student-table th")
      .forEach(function (th, index) {
        if (index > 0 && index < 7) {
          // Skip index column and actions column
          th.addEventListener("click", function () {
            const fieldMap = {
              1: "nis",
              2: "nama",
              3: "gender",
              4: "tanggalDaftar",
              5: "status",
            };

            sortTable(fieldMap[index]);
          });
        }
      });

    // Setup buttons for graduate - adapted from file_old
    document
      .getElementById("graduate-batch-btn")
      .addEventListener("click", function () {
        document.getElementById("graduation-batch-modal").style.display =
          "flex";
      });

    // Setup graduation batch modal events - adapted from file_old
    document
      .getElementById("close-graduate-modal")
      .addEventListener("click", function () {
        closeGraduationBatchModal();
      });

    document
      .getElementById("cancel-graduate-btn")
      .addEventListener("click", function () {
        closeGraduationBatchModal();
      });

    // Filter type change handler - adapted from file_old
    document
      .getElementById("filter-type")
      .addEventListener("change", function () {
        // Hide all filter options
        document.querySelectorAll(".filter-option").forEach((el) => {
          el.style.display = "none";
        });

        // Show selected filter option
        const selectedFilter = this.value;
        document.getElementById(selectedFilter + "-filter").style.display =
          "block";

        // Reset preview
        document.getElementById("preview-container").style.display = "none";
        document.getElementById("process-btn").disabled = true;
      });

    // Fill year options (last 10 years) - adapted from file_old
    const yearSelect = document.getElementById("entry-year");
    const currentYear = new Date().getFullYear();
    for (let year = currentYear; year >= currentYear - 10; year--) {
      const option = document.createElement("option");
      option.value = year;
      option.textContent = year;
      yearSelect.appendChild(option);
    }

    // Enhanced preview button handler with statistics
    document
      .getElementById("preview-btn")
      .addEventListener("click", function () {
        const filterType = document.getElementById("filter-type").value;
        let filterParams = {};

        if (filterType === "specific-date") {
          filterParams.date = document.getElementById(
            "entry-specific-date"
          ).value;
          if (!filterParams.date) {
            showNotification("Harap pilih tanggal tertentu", "error");
            return;
          }
        } else if (filterType === "date-range") {
          filterParams.startDate =
            document.getElementById("entry-start-date").value;
          filterParams.endDate =
            document.getElementById("entry-end-date").value;
          if (!filterParams.startDate || !filterParams.endDate) {
            showNotification("Harap pilih tanggal mulai dan akhir", "error");
            return;
          }
        } else if (filterType === "year") {
          filterParams.year = document.getElementById("entry-year").value;
          if (!filterParams.year) {
            showNotification("Harap pilih tahun", "error");
            return;
          }
        }

        // Show loading state for preview
        const previewBtn = document.getElementById("preview-btn");
        const originalText = previewBtn.innerHTML;
        previewBtn.innerHTML =
          '<i class="fas fa-spinner fa-spin"></i> Memuat Preview...';
        previewBtn.disabled = true;

        // Call server function to get matching students
        google.script.run
          .withSuccessHandler(function (students) {
            const previewContainer =
              document.getElementById("preview-container");
            const studentsPreview = document.getElementById("students-preview");
            const previewSummary = document.getElementById("preview-summary");

            previewContainer.style.display = "block";

            if (students.length === 0) {
              studentsPreview.innerHTML =
                '<p style="text-align: center; color: #666; padding: 20px;">📭 Tidak ada siswa yang sesuai dengan kriteria</p>';
              previewSummary.innerHTML =
                '<div class="text-warning">Total: 0 siswa</div>';
              document.getElementById("process-btn").disabled = true;
            } else {
              // Calculate statistics
              const stats = calculateStudentStatistics(students);

              // Generate enhanced preview with statistics
              let html = generateEnhancedPreview(students, stats);

              studentsPreview.innerHTML = html;

              // Enhanced summary with statistics
              const summaryHtml = `
                <div class="preview-statistics">
                  <div class="stat-item text-success">
                    <strong>📊 Total: ${students.length} siswa</strong>
                  </div>
                  <div class="stat-details">
                    <span class="stat-badge">👨 Laki-laki: ${stats.male}</span>
                    <span class="stat-badge">👩 Perempuan: ${stats.female}</span>
                  </div>
                  <div class="stat-details">
                    <span class="stat-badge">📅 Rentang Tahun: ${stats.yearRange}</span>
                  </div>
                </div>
              `;

              previewSummary.innerHTML = summaryHtml;
              document.getElementById("process-btn").disabled = false;
            }

            // Reset preview button
            previewBtn.innerHTML = originalText;
            previewBtn.disabled = false;
          })
          .withFailureHandler(function (error) {
            showNotification("Error: " + error, "error");
            // Reset preview button
            previewBtn.innerHTML = originalText;
            previewBtn.disabled = false;
          })
          .previewStudentsByEntryDate(filterParams);
      });

    // Enhanced process button handler with progress indicator
    document
      .getElementById("process-btn")
      .addEventListener("click", function () {
        const previewSummary = document.getElementById("preview-summary");
        const studentCount = previewSummary
          ? (previewSummary.textContent.match(/\d+/) || [0])[0]
          : 0;

        if (
          !confirm(
            `Apakah Anda yakin akan mengubah status ${studentCount} siswa secara batch?\n\nProses ini tidak dapat dibatalkan!`
          )
        ) {
          return;
        }

        const filterType = document.getElementById("filter-type").value;
        let filterParams = {};

        if (filterType === "specific-date") {
          filterParams.date = document.getElementById(
            "entry-specific-date"
          ).value;
        } else if (filterType === "date-range") {
          filterParams.startDate =
            document.getElementById("entry-start-date").value;
          filterParams.endDate =
            document.getElementById("entry-end-date").value;
        } else if (filterType === "year") {
          filterParams.year = document.getElementById("entry-year").value;
        }

        const updateData = {
          newStatus: document.getElementById("new-status").value,
          graduationDate: document.getElementById("graduation-date").value,
          notes: document.getElementById("batch-notes").value,
        };

        // Combine filter parameters and update data
        const batchUpdateParams = {
          filter: filterParams,
          update: updateData,
        };

        // Create and show progress modal
        const progress = createProgressModal();

        // Simulate progress steps
        updateProgress(
          10,
          "Memvalidasi data...",
          "Memeriksa parameter batch update"
        );

        setTimeout(() => {
          updateProgress(
            25,
            "Mengambil data siswa...",
            "Memfilter siswa berdasarkan kriteria"
          );
        }, 500);

        setTimeout(() => {
          updateProgress(
            50,
            "Memproses update...",
            "Mengupdate status siswa di database"
          );
        }, 1000);

        // Call server function to process batch changes
        google.script.run
          .withSuccessHandler(function (result) {
            updateProgress(
              90,
              "Menyelesaikan...",
              "Memverifikasi hasil update"
            );

            setTimeout(() => {
              updateProgress(
                100,
                "Selesai!",
                "Batch update berhasil diselesaikan"
              );

              setTimeout(() => {
                closeProgressModal();

                if (result.success) {
                  showNotification(
                    `🎉 Berhasil! ${result.count} siswa telah diperbarui statusnya menjadi "${updateData.newStatus}"`,
                    "success"
                  );
                  closeGraduationBatchModal();
                  loadStudents();
                } else {
                  showNotification("❌ Error: " + result.message, "error");
                }
              }, 1000);
            }, 500);
          })
          .withFailureHandler(function (error) {
            updateProgress(100, "Error!", "Terjadi kesalahan saat memproses");

            setTimeout(() => {
              closeProgressModal();
              showNotification("❌ Error: " + error, "error");
            }, 1500);
          })
          .batchUpdateStudentStatus(batchUpdateParams);
      });

    // Setup real-time search
    setupRealTimeSearch();

    // Setup logout
    setupLogout();

    // Note: Removed incorrect cancel-btn and close-modal handlers
    // as these elements don't exist in the current HTML structure

    // Close modals when clicking outside - adapted from file_old
    window.onclick = function (event) {
      const deleteModal = document.getElementById("delete-modal");
      const graduationModal = document.getElementById("graduation-batch-modal");

      // Only close modal if it's currently visible and the click target is the modal overlay itself
      if (
        event.target === deleteModal &&
        deleteModal.style.display === "flex"
      ) {
        closeDeleteModal();
      }

      if (
        event.target === graduationModal &&
        graduationModal.style.display === "flex"
      ) {
        closeGraduationBatchModal();
      }
    };
  });
</script>
