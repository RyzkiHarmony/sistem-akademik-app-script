  // JavaScript_Students.html
  // Get session ID from hidden input
  function getSessionId() {
    return document.getElementById("sessionId").value;
  }
  // Variabel global
  let allStudents = [];
  let filteredStudents = [];
  let currentPage = 1;
  let itemsPerPage = 10;
  let currentSortField = "nis";
  let currentSortDirection = "asc";
  let studentToDelete = null;

  // Fungsi untuk toggle sidebar di tampilan mobile
  function toggleSidebar() {
    document.body.classList.toggle("sidebar-active");
  }

  // Fungsi untuk mengupdate tanggal
  function updateDateTime() {
    const now = new Date();
    const options = {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric",
    };
    document.getElementById("current-date").textContent =
      now.toLocaleDateString("id-ID", options);
  }

  // Fungsi untuk memuat data siswa dari server dengan pagination server-side
  function loadStudents() {
    // Tampilkan loading state
    document.getElementById("students-table-body").innerHTML =
      "<tr><td colspan='8' style='text-align: center;'>Memuat data siswa...</td></tr>";

    // Siapkan opsi untuk pagination dan optimasi data
    const options = {
      page: currentPage,
      limit: itemsPerPage,
      searchQuery: document.getElementById("search-input").value.toLowerCase(),
      statusFilter: document.getElementById("filter-status").value,
      sortField: currentSortField,
      sortDirection: currentSortDirection,
      // Hanya ambil kolom yang diperlukan untuk tampilan tabel
      fieldsToReturn: ["nis", "nama", "gender", "tanggalDaftar", "status"],
    };

    // Panggil fungsi server untuk mendapatkan data siswa dengan pagination
    google.script.run
      .withSuccessHandler(function (result) {
        // Simpan data siswa ke variabel global
        allStudents = result.students;
        filteredStudents = result.students; // Tidak perlu filter lagi karena sudah difilter di server

        // Update pagination info
        currentPage = result.currentPage;
        const totalPages = result.totalPages;
        const totalCount = result.totalCount;

        // Render halaman
        renderStudentsTable(
          result.students,
          result.currentPage,
          totalPages,
          totalCount
        );
      })
      .withFailureHandler(function (error) {
        console.error("Error loading students:", error);
        document.getElementById(
          "students-table-body"
        ).innerHTML = `<tr><td colspan='8' style='text-align: center; color: #e74c3c;'>Error: ${error}</td></tr>`;
        showNotification("Gagal memuat data siswa: " + error, "error");
      })
      .getAllStudents(options);
  }

  // Filter dan sort data siswa - sekarang dilakukan di server
  function applyFiltersAndSort() {
    // Reset ke halaman pertama saat filter berubah
    currentPage = 1;

    // Muat ulang data dengan filter baru
    loadStudents();
  }

  // Fungsi untuk menampilkan data siswa dengan pagination server-side
  function renderStudentsTable(students, currentPage, totalPages, totalCount) {
    const tableBody = document.getElementById("students-table-body");

    // Check if no data
    if (students.length === 0) {
      tableBody.innerHTML =
        "<tr><td colspan='8' style='text-align: center;'>Tidak ada data siswa</td></tr>";
      document.getElementById("pagination-info").textContent = "Tidak ada data";
      document.getElementById("pagination-controls").innerHTML = "";
      return;
    }

    // Clear table
    tableBody.innerHTML = "";

    // Calculate start index for numbering
    const startIndex = (currentPage - 1) * itemsPerPage;

    // Add rows
    students.forEach((student, index) => {
      const row = document.createElement("tr");

      // Create status badge
      const statusBadge = getStatusBadge(student.status);

      row.innerHTML = `
        <td>${startIndex + index + 1}</td>
        <td>${student.nis || "-"}</td>
        <td class="student-name">${student.nama || "-"}</td>
        <td>${student.gender || "-"}</td>
        <td>${student.tanggalDaftar || "-"}</td>
        <td>${statusBadge}</td>
        <td class="action-buttons">
          <button class="btn btn-sm btn-primary btn-view" data-id="${
            student.nis
          }">Lihat</button>
          <button class="btn btn-sm btn-warning btn-edit" data-id="${
            student.nis
          }">Edit</button>
          <button class="btn btn-sm btn-warning btn-pdf" data-id="${
            student.nis
          }">PDF</button>
          <button class="btn btn-sm btn-danger btn-delete" data-id="${
            student.nis
          }">Hapus</button>
        </td>
      `;

      tableBody.appendChild(row);
    });

    // Update pagination info
    document.getElementById("pagination-info").textContent = `Menampilkan ${
      startIndex + 1
    }-${startIndex + students.length} dari ${totalCount} siswa`;

    // Update pagination controls
    renderServerPaginationControls(currentPage, totalPages);

    // Setup action buttons
    setupActionButtons();
  }

  // Fungsi untuk mengubah jumlah item per halaman
  function changeItemsPerPage(newItemsPerPage) {
    itemsPerPage = newItemsPerPage;
    currentPage = 1; // Reset ke halaman pertama
    loadStudents();
  }

  // Render pagination controls untuk server-side pagination
  function renderServerPaginationControls(currentPage, totalPages) {
    const paginationControls = document.getElementById("pagination-controls");

    // Clear current controls
    paginationControls.innerHTML = "";

    // No pagination needed if only one page
    if (totalPages <= 1) {
      return;
    }

    // Previous button
    const prevButton = document.createElement("button");
    prevButton.innerHTML = "&laquo;";
    prevButton.disabled = currentPage === 1;
    prevButton.addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage--;
        loadStudents(); // Muat ulang data dengan halaman baru
      }
    });
    paginationControls.appendChild(prevButton);

    // Page numbers
    const maxVisiblePages = 5;
    let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
    let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

    // Adjust if we're near the end
    if (endPage - startPage + 1 < maxVisiblePages && startPage > 1) {
      startPage = Math.max(1, endPage - maxVisiblePages + 1);
    }

    for (let i = startPage; i <= endPage; i++) {
      const pageButton = document.createElement("button");
      pageButton.textContent = i;
      if (i === currentPage) {
        pageButton.classList.add("active");
      }

      pageButton.addEventListener("click", () => {
        currentPage = i;
        loadStudents(); // Muat ulang data dengan halaman baru
      });

      paginationControls.appendChild(pageButton);
    }

    // Next button
    const nextButton = document.createElement("button");
    nextButton.innerHTML = "&raquo;";
    nextButton.disabled = currentPage === totalPages;
    nextButton.addEventListener("click", () => {
      if (currentPage < totalPages) {
        currentPage++;
        loadStudents(); // Muat ulang data dengan halaman baru
      }
    });
    paginationControls.appendChild(nextButton);
  }

  // Helper function untuk mendapatkan badge status

    switch (status?.toLowerCase()) {
      case "aktif":

      case "lulus":
        return '<span class="badge badge-primary">Lulus</span>';
      case "mutasi":
        return '<span class="badge badge-warning">Mutasi</span>';
      case "keluar":
        return '<span class="badge badge-danger">Keluar</span>';
    }
  }

  // Open modal to edit student
  function openEditModal(studentId) {
    // Set form mode to edit
    document.getElementById("form-mode").value = "edit";
    document.getElementById("modal-title").textContent = "Edit Data Siswa";

    // Show loading state
    showNotification("Memuat data siswa...", "info");

    // Get complete student data from server
    google.script.run
      .withSuccessHandler(function (student) {
        if (!student) {
          showNotification("Data siswa tidak ditemukan", "error");
          return;
        }

        populateEditForm(student);
        $("#studentFormModal").modal("show");
      })
      .withFailureHandler(function (error) {
        showNotification("Gagal memuat data siswa: " + error, "error");
      })
      .getStudentDetail(studentId);

  // Open delete confirmation modal
  function openDeleteModal(studentId) {
    const student = allStudents.find((s) => s.nis == studentId);

    if (!student) {
      showNotification("Data siswa tidak ditemukan", "error");
      return;
    }

    // Store student to delete
    studentToDelete = student;

    // Show student info
    document.getElementById("student-to-delete-info").innerHTML = `
      <div><strong>NIS:</strong> ${student.nis}</div>
      <div><strong>Nama:</strong> ${student.nama}</div>
    `;

    // Show modal
    document.getElementById("delete-modal").style.display = "flex";
  }

      pernahBeasiswa: document.getElementById("student-pernah-beasiswa").value,

      keteranganBeasiswa1: document.getElementById(
        "student-keterangan-beasiswa1"
      ).value,
      tahunMulaiBeasiswa1: document.getElementById(
        "student-tahun-mulai-beasiswa1"
      ).value,
      tahunSelesaiBeasiswa1: document.getElementById(
        "student-tahun-selesai-beasiswa1"
      ).value,

      // Status Akademik
      status: document.getElementById("student-status").value,
      notes: document.getElementById("student-notes").value,
    };

    // Validate required fields
    if (!studentData.nis || !studentData.nama) {
      showNotification("NIS dan Nama Lengkap wajib diisi", "error");
      return;
    }
    if (!studentData.birthdate) {
      showNotification("Tanggal Lahir wajib diisi", "error");
      return;
    }

    // Disable form while submitting
    toggleFormEnabled(false);

    // Add or Update based on mode
    if (formMode === "edit") {
      // Call server function to update student
      google.script.run
        .withSuccessHandler(function (result) {
          if (result.success) {
            showNotification("Data siswa berhasil diperbarui", "success");
            closeStudentModal();
            loadStudents(); // Reload data
          } else {
            showNotification(
              result.message || "Gagal memperbarui data siswa",
              "error"
            );
            toggleFormEnabled(true);
          }
        })
        .withFailureHandler(function (error) {
          console.error("Error updating student:", error);
          showNotification("Terjadi kesalahan: " + error, "error");
          toggleFormEnabled(true);
        })
        .updateStudent(studentData);
    } else if (formMode === "add") {
      // Call server function to add new student
      google.script.run
        .withSuccessHandler(function (result) {
          if (result.success) {
            showNotification("Data siswa baru berhasil ditambahkan", "success");
            closeStudentModal();
            loadStudents(); // Reload data
          } else {
            showNotification(
              result.message || "Gagal menambahkan data siswa baru",
              "error"
            );
            toggleFormEnabled(true);
          }
        })
        .withFailureHandler(function (error) {
          console.error("Error adding student:", error);
          showNotification("Terjadi kesalahan: " + error, "error");
          toggleFormEnabled(true);
        })
        .addStudent(studentData);
    }
  }

  // Delete student data
  function deleteStudent() {
    if (!studentToDelete || !studentToDelete.nis) {
      showNotification("Tidak ada data siswa yang dipilih", "error");
      return;
    }

    // Disable delete button
    document.getElementById("confirm-delete-btn").disabled = true;
    document.getElementById("confirm-delete-btn").textContent = "Menghapus...";

    // Call server function to delete student
    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          showNotification("Data siswa berhasil dihapus", "success");
          closeDeleteModal();
          loadStudents(); // Reload data
        } else {
          showNotification(
            result.message || "Gagal menghapus data siswa",
            "error"
          );
          document.getElementById("confirm-delete-btn").disabled = false;
          document.getElementById("confirm-delete-btn").textContent =
            "Hapus Data";
        }
      })
      .withFailureHandler(function (error) {
        console.error("Error deleting student:", error);
        showNotification("Terjadi kesalahan: " + error, "error");
        document.getElementById("confirm-delete-btn").disabled = false;
        document.getElementById("confirm-delete-btn").textContent =
          "Hapus Data";
      })
      .deleteStudent(studentToDelete.nis);
  }

  // Fungsi untuk mengakses file PDF siswa di Google Drive
  function accessStudentPDF(studentId) {
    // Tampilkan loading state
    showNotification("Mengakses file PDF siswa...", "info");

    // Panggil fungsi di server untuk mendapatkan URL PDF
    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          // Buka link PDF di tab baru
          window.open(result.url, "_blank");
        } else {
          showNotification(
            result.message || "Gagal mengakses file PDF",
            "error"
          );
        }
      })
      .withFailureHandler(function (error) {
        console.error("Error accessing PDF:", error);
        showNotification("Terjadi kesalahan: " + error, "error");
      })
      .getStudentPDFUrl(studentId);
  }

  // Toggle form fields enabled/disabled
  function toggleFormEnabled(enabled) {
    const form = document.getElementById("student-form");
    const formElements = form.elements;

    for (let i = 0; i < formElements.length; i++) {
      formElements[i].disabled = !enabled;
    }

    document.getElementById("save-btn").disabled = !enabled;

    if (!enabled) {
      document.getElementById("save-btn").textContent = "Menyimpan...";
    } else {
      document.getElementById("save-btn").textContent = "Simpan Data";
    }
  }

  // Reset search and filters
  function resetFilters() {
    document.getElementById("search-input").value = "";
    document.getElementById("filter-status").value = "";

    // Apply filters
    applyFiltersAndSort();
  }

  // Sort table by column
  function sortTable(field) {
    if (field === currentSortField) {
      // Toggle direction if same field
      currentSortDirection = currentSortDirection === "asc" ? "desc" : "asc";
    } else {
      // New field, default to ascending
      currentSortField = field;
      currentSortDirection = "asc";
    }

    // Apply sort
    applyFiltersAndSort();
  }

  // Show notification
  function showNotification(message, type) {
    // Create notification element if it doesn't exist
    let notification = document.querySelector(".notification");

    if (!notification) {
      notification = document.createElement("div");
      notification.className = "notification";
      document.body.appendChild(notification);
    }

    // Set content and type
    notification.textContent = message;
    notification.className = `notification notification-${type}`;

    // Show notification
    setTimeout(() => {
      notification.classList.add("show");
    }, 10);

    // Hide after 3 seconds
    setTimeout(() => {
      notification.classList.remove("show");
    }, 4000);
  }

  // Close modals
  function closeStudentModal() {
    document.getElementById("student-modal").style.display = "none";
    toggleFormEnabled(true);
  }

  function closeGraduationBatchModal() {
    document.getElementById("graduation-batch-modal").style.display = "none";
  }

  function closeViewModal() {
    document.getElementById("view-modal").style.display = "none";
  }

  function closeDeleteModal() {
    document.getElementById("delete-modal").style.display = "none";
    studentToDelete = null;
    document.getElementById("confirm-delete-btn").disabled = false;
    document.getElementById("confirm-delete-btn").textContent = "Hapus Data";
  }

  // Setup logout button
  function setupLogout() {
    document
      .getElementById("logout-link")
      .addEventListener("click", function (e) {
        e.preventDefault();

        if (confirm("Apakah Anda yakin ingin logout?")) {
          google.script.run
            .withSuccessHandler(function (url) {
              window.location.href = url;
            })
            .logout();
        }
      });
  }

  // Document ready
  document.addEventListener("DOMContentLoaded", function () {
    // Update tanggal
    updateDateTime();

    // Load data siswa
    loadStudents();

    // Setup event listeners for search and filter
    document
      .getElementById("search-btn")
      .addEventListener("click", function () {
        applyFiltersAndSort();
      });

    document
      .getElementById("search-input")
      .addEventListener("keyup", function (event) {
        if (event.key === "Enter") {
          applyFiltersAndSort();
        }
      });

    document
      .getElementById("filter-status")
      .addEventListener("change", function () {
        applyFiltersAndSort();
      });

    document.getElementById("reset-btn").addEventListener("click", function () {
      resetFilters();
    });

    // Setup buttons for graduate
    document
      .getElementById("graduate-batch-btn")
      .addEventListener("click", function () {
        document.getElementById("graduation-batch-modal").style.display =
          "flex";
      });

    // Setup student modal events
    document
      .getElementById("close-modal")
      .addEventListener("click", function () {
        closeStudentModal();
      });

    document
      .getElementById("cancel-btn")
      .addEventListener("click", function () {
        closeStudentModal();
      });

    document
      .getElementById("close-graduate-modal")
      .addEventListener("click", function () {
        closeGraduationBatchModal();
      });

    document
      .getElementById("cancel-graduate-btn")
      .addEventListener("click", function () {
        closeGraduationBatchModal();
      });

    document.getElementById("save-btn").addEventListener("click", function () {
      saveStudentData();
    });

    // Setup view modal events
    document
      .getElementById("close-view-modal")
      .addEventListener("click", function () {
        closeViewModal();
      });

    document
      .getElementById("close-detail-btn")
      .addEventListener("click", function () {
        closeViewModal();
      });

    document
      .getElementById("edit-from-view-btn")
      .addEventListener("click", function () {
        const studentId = this.getAttribute("data-id");
        closeViewModal();
        openEditModal(studentId);
      });

    // Setup delete modal events
    document
      .getElementById("close-delete-modal")
      .addEventListener("click", function () {
        closeDeleteModal();
      });

    document
      .getElementById("cancel-delete-btn")
      .addEventListener("click", function () {
        closeDeleteModal();
      });

    document
      .getElementById("confirm-delete-btn")
      .addEventListener("click", function () {
        deleteStudent();
      });

    // Setup table header sorting
    document
      .querySelectorAll(".student-table th")
      .forEach(function (th, index) {
        if (index > 0 && index < 7) {
          // Skip index column and actions column
          th.addEventListener("click", function () {
            const fieldMap = {
              1: "nis",
              2: "nama",
              3: "gender",
              4: "tanggalDaftar",
              5: "status",
            };

            sortTable(fieldMap[index]);
          });
        }
      });

    // Setup logout
    setupLogout();

    // Tampilkan opsi filter yang sesuai berdasarkan pilihan
    document
      .getElementById("filter-type")
      .addEventListener("change", function () {
        // Sembunyikan semua opsi filter
        document.querySelectorAll(".filter-option").forEach((el) => {
          el.style.display = "none";
        });

        // Tampilkan opsi filter yang dipilih
        const selectedFilter = this.value;
        document.getElementById(selectedFilter + "-filter").style.display =
          "block";

        // Reset preview
        document.getElementById("preview-container").style.display = "none";
        document.getElementById("process-btn").disabled = true;
      });

    // Isi opsi tahun (5 tahun terakhir)
    const yearSelect = document.getElementById("entry-year");
    const currentYear = new Date().getFullYear();
    for (let year = currentYear; year >= currentYear - 10; year--) {
      const option = document.createElement("option");
      option.value = year;
      option.textContent = year;
      yearSelect.appendChild(option);
    }

    // Preview button handler
    document
      .getElementById("preview-btn")
      .addEventListener("click", function () {
        const filterType = document.getElementById("filter-type").value;
        let filterParams = {};

        if (filterType === "specific-date") {
          filterParams.date = document.getElementById(
            "entry-specific-date"
          ).value;
          if (!filterParams.date) {
            alert("Harap pilih tanggal tertentu");
            return;
          }
        } else if (filterType === "date-range") {
          filterParams.startDate =
            document.getElementById("entry-start-date").value;
          filterParams.endDate =
            document.getElementById("entry-end-date").value;
          if (!filterParams.startDate || !filterParams.endDate) {
            alert("Harap pilih tanggal mulai dan akhir");
            return;
          }
        } else if (filterType === "year") {
          filterParams.year = document.getElementById("entry-year").value;
          if (!filterParams.year) {
            alert("Harap pilih tahun");
            return;
          }
        }

        // Panggil fungsi server untuk mendapatkan siswa yang sesuai
        google.script.run
          .withSuccessHandler(function (students) {
            const previewContainer =
              document.getElementById("preview-container");
            const studentsPreview = document.getElementById("students-preview");
            const previewSummary = document.getElementById("preview-summary");

            previewContainer.style.display = "block";

            if (students.length === 0) {
              studentsPreview.innerHTML =
                '<p class="text-center">Tidak ada siswa yang sesuai dengan kriteria</p>';
              previewSummary.textContent = "Total: 0 siswa";
              document.getElementById("process-btn").disabled = true;
            } else {
              let html = "";
              students.forEach((student) => {
                html += `<div class="preview-item">
                  <strong>${student.nis}</strong> - ${student.name} 
                  (${student.gender}})
                </div>`;
              });

              studentsPreview.innerHTML = html;
              previewSummary.textContent = `Total: ${students.length} siswa akan diperbarui`;
              document.getElementById("process-btn").disabled = false;
            }
          })
          .withFailureHandler(function (error) {
            alert("Error: " + error);
          })
          .previewStudentsByEntryDate(filterParams);
      });

    // Process button handler
    document
      .getElementById("process-btn")
      .addEventListener("click", function () {
        if (
          !confirm("Apakah Anda yakin akan mengubah status siswa secara batch?")
        ) {
          return;
        }

        const filterType = document.getElementById("filter-type").value;
        let filterParams = {};

        if (filterType === "specific-date") {
          filterParams.date = document.getElementById(
            "entry-specific-date"
          ).value;
        } else if (filterType === "date-range") {
          filterParams.startDate =
            document.getElementById("entry-start-date").value;
          filterParams.endDate =
            document.getElementById("entry-end-date").value;
        } else if (filterType === "year") {
          filterParams.year = document.getElementById("entry-year").value;
        }

        const updateData = {
          newStatus: document.getElementById("new-status").value,
          graduationDate: document.getElementById("graduation-date").value,
          notes: document.getElementById("batch-notes").value,
        };

        // Gabungkan parameter filter dan data update
        const batchUpdateParams = {
          filter: filterParams,
          update: updateData,
        };

        // Panggil fungsi server untuk memproses perubahan batch
        google.script.run
          .withSuccessHandler(function (result) {
            if (result.success) {
              alert(
                `Berhasil! ${result.count} siswa telah diperbarui statusnya menjadi "${updateData.newStatus}"`
              );
              closeGraduationBatchModal(); // Menggunakan fungsi yang benar
              loadStudents(); // Fungsi yang sudah benar
            } else {
              alert("Error: " + result.message);
            }
          })
          .withFailureHandler(function (error) {
            alert("Error: " + error);
          })
          .updateStudentsStatusBatch(batchUpdateParams);
      });

    // Cancel button handler
    document
      .getElementById("cancel-btn")
      .addEventListener("click", function () {
        document.getElementById("close-modal").click();
      });

    // Close modal handler
    document
      .getElementById("close-modal")
      .addEventListener("click", function () {
        document.getElementById("student-modal").style.display = "none";
      });

    // Close modals when clicking outside
    window.onclick = function (event) {
      const studentModal = document.getElementById("student-modal");
      const viewModal = document.getElementById("view-modal");
      const deleteModal = document.getElementById("delete-modal");
      const graduationBatchModal = document.getElementById(
        "graduation-batch-modal"
      );

      if (event.target === studentModal) {
        closeStudentModal();
      } else if (event.target === viewModal) {
        closeViewModal();
      } else if (event.target === deleteModal) {
        closeDeleteModal();
      } else if (event.target === graduationBatchModal) {
        closeGraduationBatchModal();
      }
    };
  });
</script>
